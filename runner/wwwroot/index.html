<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C# Runner</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2376c7ad'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='700' font-size='13' fill='%23151c19'>C%23</text></svg>" />
    <base href="/runner/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="css/app.css?v=13" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="color:#a1aaa6;font-family:'Inter',sans-serif;font-size:13px;padding:16px">
            Завантаження C# runner…
        </div>
    </div>
    <script src="js/runner.js?v=13"></script>
    <script>
      // Динамічно завантажуємо Blazor лише тоді, коли crossOriginIsolated = true.
      // Це потрібно для WasmEnableThreads: Blazor падає при старті якщо SharedArrayBuffer недоступний.
      //
      // Логіка:
      //   crossOriginIsolated = true  → COOP/COEP вже активні (SW працює) → вантажимо Blazor
      //   crossOriginIsolated = false → встановлюємо SW, перезавантажуємо сторінку (Blazor НЕ вантажимо)
      //   SW недоступний             → вантажимо Blazor без threading як fallback
      (function () {
        function loadBlazor() {
          var s = document.createElement('script');
          s.src = '_framework/blazor.webassembly.js';
          document.body.appendChild(s);
        }

        if (window.crossOriginIsolated) {
          // Вже ізольовано — можна запускати Blazor з threading
          loadBlazor();
        } else if ('serviceWorker' in navigator) {
          // Не ізольовано: встановлюємо SW і перезавантажуємо
          // Blazor не вантажимо — він упаде без SharedArrayBuffer
          navigator.serviceWorker.register('coi-serviceworker.js').then(function () {
            window.location.reload();
          }).catch(function () {
            // SW не вдалося встановити — вантажимо Blazor як є (без threading)
            loadBlazor();
          });
        } else {
          // Браузер не підтримує SW (приватний режим Firefox тощо) — fallback
          loadBlazor();
        }
      })();
    </script>
</body>
</html>
