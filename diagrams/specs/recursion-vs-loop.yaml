# Лекція 2.21 «Рекурсивні функції»
# Оригінал: lectures/_assets/02-21/Архив/recursion-vs-loop.png
id: recursion-vs-loop
title: "Рекурсія і цикл: числа Фібоначчі"
subtitle: "Однаковий результат, різна ціна: наївна рекурсія повторно обчислює ті самі значення"

types: []

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "Рекурсія — O(2ⁿ)"
            check: skip
            code: |
              int Fibonacci(int n)
              {
                  if (n <= 1) return n;
                  return Fibonacci(n - 1) + Fibonacci(n - 2);
              }
            notes: ["`Fibonacci(30)` — [[2 692 537]] викликів", "кожен виклик — кадр стека"]
        - box:
            title: "Цикл — O(n)"
            kind: box_accent
            check: skip
            code: |
              int FibonacciLoop(int n)
              {
                  if (n == 0) return 0;
                  int prev = 0, curr = 1;
                  for (int i = 2; i <= n; i++)
                      (prev, curr) = (curr, prev + curr);
                  return curr;
              }
            notes: ["`FibonacciLoop(30)` — [[29]] ітерацій", "пам'ять — дві змінні"]
  - panel:
      heading: "Перевірено виконанням"
      children:
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "значення"]
            groups:
              - rows:
                  - ["Fibonacci(10)",  "`55`"]
                  - ["FibonacciLoop(10)", "`55`"]
                  - ["FibonacciLoop(30)", "`832040`"]
                  - ["Calls(30)",   "`2692537`"]

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    int Fibonacci(int n) { if (n <= 1) return n; return Fibonacci(n - 1) + Fibonacci(n - 2); }
    int FibonacciLoop(int n) { if (n == 0) return 0; int prev = 0, curr = 1; for (int i = 2; i <= n; i++) (prev, curr) = (curr, prev + curr); return curr; }
    int calls = 0;
    int C(int n) { calls++; if (n <= 1) return n; return C(n - 1) + C(n - 2); }
    int Calls(int n) { calls = 0; C(n); return calls; }

publish:
  dark: ../lectures/_assets/02-21/recursion-vs-loop.png
  bw: ../lectures/_assets/02-21/book/recursion-vs-loop.png
