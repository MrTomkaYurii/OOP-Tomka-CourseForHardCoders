# Лекція 12.1 «Структура DateTime»
# Оригінал: lectures/_assets/12-01/Архив/datetime-structure.png
id: datetime-structure
title: "DateTime: будова, Kind і арифметика"
subtitle: "Значущий тип: одне 64-бітне число — тіки від 01.01.0001 00:00 плюс позначка часового поясу"

types: [DateTime, DateTimeKind, TimeSpan, DayOfWeek]

body:
  - panel:
      heading: "Усередині — 64 біти"
      children:
        - row:
            gap: 16
            children:
              - box: { kind: box_muted, align: center, title: "2 біти — Kind", notes: ["`Unspecified` · `Local` · `Utc`"] }
              - box: { kind: box_accent, align: center, title: "62 біти — Ticks", notes: ["1 тік = 100 нс; відлік від 01.01.0001 [[00:00]] (опівночі)"] }
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "значення"]
            groups:
              - rows:
                  - ["new DateTime(2026, 6, 11, 9, 30, 0).Ticks", "`639_167_670_000_000_000`"]
                  - ["TimeSpan.TicksPerSecond",                  "`10_000_000`"]
                  - ["DateTime.MinValue.Ticks",                  "`0`"]
                  - ["DateTime.MaxValue.ToString(\"O\")",        "`\"9999-12-31T23:59:59.9999999\"`"]

  - row:
      gap: 24
      children:
        - panel:
            heading: "Kind — чий це час"
            children:
              - kv:
                  check: skip
                  columns: ["джерело", "Kind", "де використовувати"]
                  groups:
                    - rows:
                        - ["new DateTime(2026, 6, 11)", "`Unspecified`", "невідомо — небезпечно"]
                        - ["DateTime.Now",             "`Local`",       "лише показ у UI"]
                        - ["DateTime.UtcNow",          "`Utc`",         "[[БД]], журнали, API"]
              - kv:
                  check: skip
                  columns: ["перетворення", "результат"]
                  groups:
                    - rows:
                        - ["utc.ToLocalTime()",  "`Local` для показу"]
                        - ["local.ToUniversalTime()", "`Utc` для збереження"]
                        - ["DateTime.SpecifyKind(d, Utc)", "лише нова позначка"]
              - note:
                  kind: box_accent
                  text:
                    - "`==`, `<`, `-` [[ігнорують Kind]]: 12:00 Local == 12:00 Utc."
                    - "Змішувати Local і Utc в одному порівнянні не можна."

        - panel:
            heading: "dt = new DateTime(2026, 6, 11, 14, 30, 25)"
            children:
              - kv:
                  check: skip
                  columns: ["вираз", "результат"]
                  groups:
                    - heading: "властивості"
                      rows:
                        - ["dt.DayOfWeek",  "`Thursday`"]
                        - ["dt.DayOfYear",  "`162`"]
                        - ["dt.TimeOfDay",  "`14:30:25` — `TimeSpan`"]
                        - ["dt.Date",       "11.06.2026 00:00"]
                    - heading: "арифметика — завжди новий DateTime"
                      rows:
                        - ["dt.AddDays(7)",       "18.06.2026 14:30:25"]
                        - ["dt.AddHours(-2)",     "11.06.2026 12:30:25"]
                        - ["new DateTime(2026, 1, 31).AddMonths(1)", "[[28.02.2026]] — кінець місяця"]
                        - ["discharge - admission", "`TimeSpan`"]
                        - ["admission + TimeSpan.FromDays(7)", "`DateTime`"]

check:
  usings: [System]
  context: |
    var dt = new DateTime(2026, 6, 11, 14, 30, 25);
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(new DateTime(2026, 6, 11).Kind, DateTimeKind.Unspecified); Eq(DateTime.Now.Kind, DateTimeKind.Local); Eq(DateTime.UtcNow.Kind, DateTimeKind.Utc);
    Eq(new DateTime(2026, 6, 11, 12, 0, 0, DateTimeKind.Local) == new DateTime(2026, 6, 11, 12, 0, 0, DateTimeKind.Utc), true);
    Eq(dt.DayOfWeek, DayOfWeek.Thursday); Eq(dt.DayOfYear, 162); Eq(dt.TimeOfDay, new TimeSpan(14, 30, 25));
    Eq(dt.Date, new DateTime(2026, 6, 11)); Eq(dt.AddDays(7), new DateTime(2026, 6, 18, 14, 30, 25));
    Eq(dt.AddHours(-2), new DateTime(2026, 6, 11, 12, 30, 25)); Eq(new DateTime(2026, 1, 31).AddMonths(1), new DateTime(2026, 2, 28));
    Eq(DateTime.SpecifyKind(dt, DateTimeKind.Utc).Ticks, dt.Ticks);
    TimeSpan stay = dt.AddDays(7) - dt; DateTime d2 = dt + TimeSpan.FromDays(7); Eq(stay.Days, 7); Eq(d2, dt.AddDays(7));

publish:
  dark: ../lectures/_assets/12-01/datetime-structure.png
  bw: ../lectures/_assets/12-01/book/datetime-structure.png
