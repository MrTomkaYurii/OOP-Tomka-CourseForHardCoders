# Лекція 6.1 «Делегати»
# Оригінал: lectures/_assets/06-01/Архив/callback-pattern.png
id: callback-pattern
title: "Зворотний виклик через делегат"
subtitle: "Patient повідомляє про списання, не знаючи, куди піде повідомлення — це вирішує зовнішній код"

types: [Patient, PatientHandler]

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "class Patient — не знає про Console"
            kind: box_accent
            check: skip
            code: |
              PatientHandler? _onSpend;

              public void RegisterHandler(PatientHandler h)   => _onSpend += h;
              public void UnregisterHandler(PatientHandler h) => _onSpend -= h;

              public void Spend(int amount)
              {
                  if (_balance >= amount)
                  {
                      _balance -= amount;
                      _onSpend?.Invoke($"Списано {amount} грн. …");
                  }
                  else _onSpend?.Invoke("Недостатньо коштів. …");
              }
        - box:
            title: "Зовнішній код — вирішує, що робити"
            check: skip
            code: |
              var patient = new Patient("Іван Петренко", 500);
              patient.RegisterHandler(PrintSimpleMessage);
              patient.RegisterHandler(PrintHighlightedMessage);
              patient.Spend(200);   // обидва обробники
              patient.UnregisterHandler(PrintHighlightedMessage);
              patient.Spend(100);   // лише перший
            notes: ["консоль, файл, GUI, SMS — різні обробники,", "клас `Patient` при цьому не змінюється"]
  - hchain:
      nodes:
        - {title: "Spend(200)", sub: ["подія в класі"]}
        - {title: "_onSpend?.Invoke(msg)", via: "викликає", kind: box_accent, sub: ["список виклику"]}
        - {title: "PrintSimpleMessage, PrintHighlightedMessage", via: "по черзі", sub: ["код ззовні"]}

publish:
  dark: ../lectures/_assets/06-01/callback-pattern.png
  bw: ../lectures/_assets/06-01/book/callback-pattern.png
