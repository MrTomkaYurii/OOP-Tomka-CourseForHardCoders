# Лекція 17.5 «Скасування async-операцій. CancellationToken»
# Оригінал: lectures/_assets/17-05/Архив/async-cancellation.png
id: async-cancellation
title: "Скасування async-операцій"
subtitle: "Токен проходить крізь увесь ланцюжок викликів аж до методів .NET; скасування повертається винятком OperationCanceledException"

types: [CancellationTokenSource, CancellationToken, Task, OperationCanceledException, TaskCanceledException, HttpClient]

body:
  - panel:
      heading: "Токен — останнім параметром на кожному рівні"
      children:
        - hchain:
            nodes:
              - { title: "UI / контролер", sub: ["`new CancellationTokenSource(500)`", "тайм-аут 500 мс"], kind: box_accent }
              - { title: "LoadCardAsync(id, ct)", code: true, sub: ["між кроками:", "`ct.ThrowIfCancellationRequested()`"], via: "ct" }
              - { title: "await Task.Delay(800, ct)", code: true, sub: ["або `http.GetAsync(url, ct)`:", "BCL скасовує сама"], via: "ct" }
        - text:
            text:
              - "Не передали токен у метод .NET — той допрацює до кінця, і скасування [[спізниться]] на весь його час."

  - row:
      gap: 24
      children:
        - panel:
            heading: "Що отримує викликач"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`await` скасованого методу",  "`OperationCanceledException`"]
                        - ["з `Task.Delay`, `HttpClient`", "`TaskCanceledException` — його нащадок"]
                        - ["стан задачі async-методу",    "`Canceled` — від [[будь-якого]] токена"]
                        - ["`Task.Run(work, ct)`",        "`Canceled` лише від свого `ct`, інакше `Faulted`"]
              - note:
                  kind: box_accent
                  text:
                    - "Ловіть `OperationCanceledException` — він"
                    - "покриває і `TaskCanceledException`."

        - panel:
            heading: "Кілька причин скасування"
            children:
              - box:
                  check: skip
                  code: |
                    using var linked = CancellationTokenSource
                        .CreateLinkedTokenSource(appStop, requestCt);
                    await LoadCardAsync(id, linked.Token);
                  notes:
                    - "спрацює і на зупинку програми, і на тайм-аут"
              - box:
                  check: skip
                  code: |
                    catch (OperationCanceledException)
                        when (!globalCt.IsCancellationRequested)
                    { /* тайм-аут спроби — повторити */ }
                  notes:
                    - "фільтр: ловимо лише своє скасування"

check:
  usings: [System, System.Threading, System.Threading.Tasks]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    async Task Load(CancellationToken ct) { ct.ThrowIfCancellationRequested(); await Task.Delay(800, ct); }
    using var cts = new CancellationTokenSource(50);
    var t = Load(cts.Token);
    try { await t; Eq(0, 1); } catch (OperationCanceledException e) { Eq(e is TaskCanceledException, true); }
    Eq(t.Status, TaskStatus.Canceled);
    var other = new CancellationTokenSource(); other.Cancel();
    async Task A(CancellationToken ct) { await Task.Delay(1); ct.ThrowIfCancellationRequested(); }
    var a = A(other.Token); try { await a; } catch (OperationCanceledException) { } Eq(a.Status, TaskStatus.Canceled);
    var r = Task.Run(() => other.Token.ThrowIfCancellationRequested()); try { await r; } catch (OperationCanceledException) { } Eq(r.Status, TaskStatus.Faulted);
    using var app = new CancellationTokenSource(); using var req = new CancellationTokenSource();
    using var linked = CancellationTokenSource.CreateLinkedTokenSource(app.Token, req.Token); req.Cancel(); Eq(linked.IsCancellationRequested, true);

publish:
  dark: ../lectures/_assets/17-05/async-cancellation.png
  bw: ../lectures/_assets/17-05/book/async-cancellation.png
