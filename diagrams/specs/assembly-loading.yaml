# Лекція 14.5 «Динамічне завантаження збірок та пізнє зв'язування»
# Оригінал: lectures/_assets/14-05/Архив/assembly-loading.png
id: assembly-loading
title: "Динамічне завантаження збірок і пізнє зв'язування"
subtitle: "Збірка невідома компілятору: тип знаходимо й створюємо під час виконання"

types: [PatientRecord, AssemblyLoadContext, IAnalysisPlugin]

body:
  - row:
      gap: 24
      children:
        - stack:
            gap: 24
            children:
              # ── 1. Assembly ─────────────────────────────────────────────
              - panel:
                  heading: "Клас Assembly"
                  children:
                    - kv:
                        check: "_ = {};"
                        groups:
                          - heading: "завантажити"
                            rows:
                              - ["Assembly.Load(name)",     "за ім'ям збірки"]
                              - ["Assembly.LoadFrom(path)", "з файлу; залежності — поруч"]
                              - ["Assembly.LoadFile(path)", "з файлу, окремий контекст"]
                          - heading: "отримати вже завантажену"
                            rows:
                              - ["Assembly.GetEntryAssembly()",     "стартова (`Program.cs`)"]
                              - ["Assembly.GetExecutingAssembly()", "де виконується цей код"]
                              - ["Assembly.GetCallingAssembly()",   "хто викликав цей метод"]
                          - heading: "дослідити"
                            rows:
                              - ["asm.FullName",          "ім'я, версія, культура, ключ"]
                              - ["asm.Location",          "шлях до `.dll` на диску"]
                              - ["asm.GetTypes()",        "усі типи, зокрема `internal`"]
                              - ["asm.GetExportedTypes()", "лише `public` — для плагінів"]
              # ── 2. AssemblyLoadContext ─────────────────────────────────
              - panel:
                  heading: "AssemblyLoadContext (.NET Core+)"
                  children:
                    - box:
                        code: |
                          var ctx = new AssemblyLoadContext("plugins",
                                                            isCollectible: true);
                          Assembly a = ctx.LoadFromAssemblyPath(path);
                          ctx.Unload(); // GC вивантажить, коли зникнуть посилання
                    - kv:
                        key_code: false
                        columns: ["спосіб", "контекст", "Unload", "залежності"]
                        groups:
                          - rows:
                              - ["`Assembly.LoadFrom`",          "Default",       "ні",              "шукає поруч"]
                              - ["`Assembly.LoadFile`",          "окремий",       "ні",              "не шукає"]
                              - ["`ctx.LoadFromAssemblyPath`",   "свій",          "якщо collectible", "`Load()` контексту"]
                              - ["`ctx.LoadFromStream`",         "свій",          "якщо collectible", "`Load()` контексту"]
                    - note:
                        kind: box_accent
                        text:
                          - "Той самий тип, завантажений у два контексти, — для CLR"
                          - "два різні типи: приведення між ними неможливе"

        # ── 3. Патерн Plugin ────────────────────────────────────────────────
        - panel:
            heading: "Патерн Plugin"
            children:
              - chain:
                  align: left
                  nodes:
                    - title: "1 · контракт у спільній збірці"
                      sub:
                        - "`IAnalysisPlugin` — в окремому проєкті,"
                        - "на який посилаються host і плагіни"
                    - title: "2 · завантажити .dll плагіна"
                      lines: |
                        var plc = new AssemblyLoadContext("p1", true);
                        Assembly pa = plc.LoadFromAssemblyPath(path);
                    - title: "3 · отримати public-типи"
                      lines: |
                        Type[] types = pa.GetExportedTypes();
                    - title: "4 · відібрати реалізації"
                      lines: |
                        bool ok = x.IsAssignableTo(typeof(IAnalysisPlugin))
                               && !x.IsAbstract;
                      sub: ["для кожного `x` з `types`"]
                    - title: "5 · створити екземпляр"
                      lines: |
                        object? obj = Activator.CreateInstance(x);
                    - title: "6 · працювати через інтерфейс"
                      kind: box_accent
                      lines: |
                        var plugin = (IAnalysisPlugin)obj!;
                        string report = plugin.Analyze();
                      sub: ["далі — звичайний виклик, без рефлексії"]

check:
  usings: [System, System.Reflection, System.Runtime.Loader, Med]
  context: |
    Assembly asm = typeof(PatientRecord).Assembly;
    string name = asm.FullName!;
    string path = asm.Location;
    Type x = typeof(Analyzer);
  asserts: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    Assert(ok && report == "OK", "плагін створено й викликано");
    Assert(a != asm && a.GetType("Med.PatientRecord") != typeof(PatientRecord), "різні ALC → різні типи");
    Assert(!Array.Exists(types, y => y.IsAssignableTo(typeof(IAnalysisPlugin))), "контракт не спільний → не підходить");
    Assert(Assembly.LoadFrom(path) == asm, "LoadFrom → Default");
    Assert(AssemblyLoadContext.GetLoadContext(Assembly.LoadFile(path)) != AssemblyLoadContext.Default, "LoadFile → окремий");
    Assert(Array.Exists(asm.GetTypes(), y => y.Name == "Hidden") && !Array.Exists(asm.GetExportedTypes(), y => y.Name == "Hidden"), "internal");
  types: |
    namespace Med
    {
        public class PatientRecord { }
        public interface IAnalysisPlugin { string Analyze(); }
        public class Analyzer : IAnalysisPlugin { public string Analyze() => "OK"; }
        internal class Hidden { }
    }

publish:
  dark: ../lectures/_assets/14-05/assembly-loading.png
  bw: ../lectures/_assets/14-05/book/assembly-loading.png
