# Лекція 6.5 «Делегати Action, Predicate та Func»
# Оригінал: lectures/_assets/06-05/Архив/action-predicate-func.png
id: action-predicate-func
title: "Вбудовані делегати: Action, Predicate, Func"
subtitle: "Замість власного delegate — готовий узагальнений тип; останній параметр Func — завжди результат"

types: [Action, Predicate, Func]

body:
  - row:
      gap: 16
      equal: true
      children:
        - box:
            title: "Action — нічого не повертає"
            check: skip
            code: |
              Action
              Action<T>
              Action<T1, …, T16>
            notes: ["0–16 параметрів"]
        - box:
            title: "Predicate<T> — умова"
            check: skip
            code: "bool Predicate<in T>(T obj)"
            notes: ["рівно 1 параметр → `bool`"]
        - box:
            title: "Func — повертає TResult"
            kind: box_accent
            check: skip
            code: |
              Func<TResult>
              Func<T, TResult>
              Func<T1, …, T16, TResult>
            notes: ["0–16 параметрів [[+]] результат"]
  - panel:
      heading: "Приклади з лекції (виконано)"
      children:
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "результат"]
            groups:
              - rows:
                  - ["isGlucoseNormal(5.4)",           "`true`"]
                  - ["isPulseNormal(112)",             "`false`"]
                  - ["classify(112)",                  "`\"Тахікардія\"`"]
                  - ["Math.Round(calcBMI(70, 1.75), 1)", "`22.9`"]
        - text:
            text: ["`Predicate<double>` і `Func<double, bool>` — [[різні]] типи: присвоїти один одному не можна, хоч лямбда підходить до обох."]

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    Predicate<double> isGlucoseNormal = g => g >= 3.9 && g <= 6.1;
    Predicate<int> isPulseNormal = p => p >= 60 && p <= 100;
    Func<int, string> classify = pulse => pulse > 100 ? "Тахікардія" : pulse < 60 ? "Брадикардія" : "Норма";
    Func<double, double, double> calcBMI = (weight, height) => weight / (height * height);

publish:
  dark: ../lectures/_assets/06-05/action-predicate-func.png
  bw: ../lectures/_assets/06-05/book/action-predicate-func.png
