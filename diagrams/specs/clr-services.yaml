# Лекція 1.3 «Керований та некерований код»
# Оригінал: lectures/_assets/01-03/Архив/clr-services.png
id: clr-services
title: "Служби, які CLR надає керованому коду"
subtitle: "Що отримує кожна C#-програма без жодного рядка додаткового коду"

types: [Patient]

body:
  - panel:
      heading: "Служби CLR"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["служба", "що робить", "як це видно в коді"]
            groups:
              - rows:
                  - ["[[JIT-компіляція]]",  "CIL → машинний код під час виконання",    "нічого писати не треба"]
                  - ["[[збирання сміття]]", "звільняє недосяжні об'єкти",             "`new Patient()` без `delete`"]
                  - ["безпека типів",        "хибне приведення — виняток, не пошкодження пам'яті", "`InvalidCastException`"]
                  - ["межі масивів",         "перевіряє кожен індекс",                 "`IndexOutOfRangeException`"]
                  - ["обробка винятків",     "єдина модель для всіх помилок",          "`try / catch / finally`"]
                  - ["метадані, рефлексія",  "опис типів доступний під час виконання", "`typeof(Patient).GetMethods()`"]
                  - ["interop",              "виклик нативних бібліотек",              "`[DllImport]`, `LibraryImport`"]
  - note:
      text:
        - "Керований код — той, що виконується під контролем цих служб."
        - "Блок `unsafe` з вказівниками частково виходить з-під перевірок"
        - "(межі, типи) — тому його застосовують лише там, де це виправдано."

publish:
  dark: ../lectures/_assets/01-03/clr-services.png
  bw: ../lectures/_assets/01-03/book/clr-services.png
