# Лекція 12.2 «Налаштування формату часу та дати»
# Оригінал: lectures/_assets/12-02/Архив/datetime-formatting.png
id: datetime-formatting
title: "Форматування й парсинг DateTime"
subtitle: "dt = new DateTime(2026, 6, 11, 14, 45, 20, 123) — результати для uk-UA та InvariantCulture"

types: [DateTime, CultureInfo, DateTimeStyles]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Стандартні — одна літера"
            children:
              - kv:
                  check: skip
                  columns: ["dt.ToString(…)", "uk-UA", "Invariant"]
                  groups:
                    - heading: "залежать від культури"
                      rows:
                        - ["\"d\"", "11.06.2026",                  "06/11/2026"]
                        - ["\"D\"", "четвер, 11 червня 2026 р.",   "Thursday, 11 June 2026"]
                        - ["\"t\"", "14:45",                       "14:45"]
                        - ["\"g\"", "11.06.2026 14:45",            "06/11/2026 14:45"]
                        - ["\"G\"", "11.06.2026 14:45:20",         "06/11/2026 14:45:20"]
                        - ["\"M\"", "11 червня",                   "June 11"]
                        - ["\"Y\"", "червень 2026 р.",             "2026 June"]
                    - heading: "однакові всюди (ISO 8601 / RFC)"
                      rows:
                        - ["\"s\"", "2026-06-11T14:45:20",         "без поясу"]
                        - ["\"O\"", "2026-06-11T14:45:20.1230000", "зсув (+03:00) — лише в Local"]
                        - ["\"u\"", "2026-06-11 14:45:20Z",        "[[не конвертує]] в UTC!"]
                        - ["\"R\"", "Thu, 11 Jun 2026 14:45:20 GMT", "[[не конвертує]] в UTC!"]
              - note:
                  text:
                    - "`u` і `R` лише дописують `Z`/`GMT`: спершу `dt.ToUniversalTime()`."

        - stack:
            gap: 24
            children:
              - panel:
                  heading: "Власні шаблони (uk-UA)"
                  children:
                    - kv:
                        check: skip
                        columns: ["формат", "результат"]
                        groups:
                          - rows:
                              - ["\"yyyy-MM-dd\"",      "2026-06-11"]
                              - ["\"dd.MM.yyyy HH:mm\"", "11.06.2026 14:45"]
                              - ["\"d MMMM\" / \"MMMM\"", "11 червня / червень"]
                              - ["\"MMM\" / \"ddd\" / \"dddd\"", "черв. / чт / четвер"]
                              - ["\"hh:mm tt\"",        "02:45 пп"]
                              - ["\"HH:mm:ss.fff\"",    "14:45:20.123"]
                              - ["\"%d\"",              "11 — без `%` це «коротка дата»"]
                    - note:
                        kind: box_accent
                        text:
                          - "`\"dd/MM/yyyy\"` у uk-UA → `11.06.2026`: `/` — це"
                          - "[[роздільник культури]]; буквально — `'/'` або Invariant"
              - panel:
                  heading: "Рядок → DateTime"
                  children:
                    - kv:
                        check: skip
                        key_code: false
                        columns: ["метод", "невдача"]
                        groups:
                          - rows:
                              - ["`Parse(s)` — формат за культурою",           "`FormatException`"]
                              - ["`TryParse(s, out d)`",                       "`false`"]
                              - ["`ParseExact(s, \"dd.MM.yyyy\", inv)`",       "`FormatException`"]
                              - ["`TryParseExact(…)` — [[рекомендовано]]",     "`false`; `29.02.2026` теж"]

check:
  usings: [System, System.Globalization]
  context: |
    var dt = new DateTime(2026, 6, 11, 14, 45, 20, 123);
    var ua = CultureInfo.GetCultureInfo("uk-UA"); var inv = CultureInfo.InvariantCulture;
    void Eq(string a, string b) { if (a != b) throw new Exception($"Схема бреше: [{a}] != [{b}]"); }
  asserts: |
    string U(string f) => dt.ToString(f, ua).Replace('\u00A0', ' ').Replace('\u202F', ' '); string I(string f) => dt.ToString(f, inv);
    Eq(U("d"), "11.06.2026"); Eq(I("d"), "06/11/2026"); Eq(U("D"), "четвер, 11 червня 2026 р."); Eq(I("D"), "Thursday, 11 June 2026");
    Eq(U("t"), "14:45"); Eq(U("g"), "11.06.2026 14:45"); Eq(I("g"), "06/11/2026 14:45"); Eq(U("G"), "11.06.2026 14:45:20"); Eq(I("G"), "06/11/2026 14:45:20");
    Eq(U("M"), "11 червня"); Eq(I("M"), "June 11"); Eq(U("Y"), "червень 2026 р."); Eq(I("Y"), "2026 June");
    Eq(U("s"), "2026-06-11T14:45:20"); Eq(U("O"), "2026-06-11T14:45:20.1230000"); Eq(U("u"), "2026-06-11 14:45:20Z"); Eq(U("R"), "Thu, 11 Jun 2026 14:45:20 GMT");
    Eq(U("yyyy-MM-dd"), "2026-06-11"); Eq(U("dd.MM.yyyy HH:mm"), "11.06.2026 14:45"); Eq(U("d MMMM"), "11 червня"); Eq(U("MMMM"), "червень");
    Eq(U("MMM"), "черв."); Eq(U("ddd"), "чт"); Eq(U("dddd"), "четвер"); Eq(U("hh:mm tt"), "02:45 пп"); Eq(U("HH:mm:ss.fff"), "14:45:20.123"); Eq(U("%d"), "11");
    Eq(U("dd/MM/yyyy"), "11.06.2026"); Eq(U("dd'/'MM'/'yyyy"), "11/06/2026");
    Eq(DateTime.TryParseExact("29.02.2026", "dd.MM.yyyy", inv, DateTimeStyles.None, out _).ToString(), "False");
    try { DateTime.ParseExact("2026-06-11", "dd.MM.yyyy", inv); Eq("", "ParseExact"); } catch (FormatException) { }

publish:
  dark: ../lectures/_assets/12-02/datetime-formatting.png
  bw: ../lectures/_assets/12-02/book/datetime-formatting.png
