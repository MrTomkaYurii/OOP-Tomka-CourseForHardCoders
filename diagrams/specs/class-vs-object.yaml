# Лекція 3.1 «Класи та об'єкти»
# Оригінал: lectures/_assets/03-01/Архив/class-vs-object.png
id: class-vs-object
title: "Клас — шаблон, об'єкт — екземпляр"
subtitle: "Один опис Patient і два незалежні об'єкти, кожен зі своїми значеннями полів"

types: [Patient]

body:
  - stack:
      gap: 24
      children:
        - box:
            title: "class Patient — опис типу"
            kind: box_accent
            check: skip
            code: |
              public string Name  = "Невідомий";
              public string Phone = "";
              public int    Age;

              public void   Display()      { … }
              public string GetShortInfo() { … }
            notes: ["пам'яті під поля не займає, доки немає `new`"]
        - row:
            gap: 16
            equal: true
            children:
              - box:
                  title: "patient1 = new Patient()"
                  check: skip
                  code: |
                    Name  = "Олена Коваль"
                    Phone = "050…"
                    Age   = 32
              - box:
                  title: "patient2 = new Patient()"
                  check: skip
                  code: |
                    Name  = "Михайло Бондар"
                    Phone = "067…"
                    Age   = 45
  - note:
      text:
        - "Неініціалізоване поле отримує значення за замовчуванням: `0`, `false`, `null`;"
        - "тому `Age` нового об'єкта — `0`, а `Name` — `\"Невідомий\"` з ініціалізатора."

check:
  usings: [System]
  asserts: |
    var p1 = new Patient(); var p2 = new Patient(); p1.Age = 32;
    if (p2.Age != 0 || p2.Name != "Невідомий" || ReferenceEquals(p1, p2)) throw new Exception("obj");
  types: |
    class Patient { public string Name = "Невідомий"; public string Phone = ""; public int Age; }

publish:
  dark: ../lectures/_assets/03-01/class-vs-object.png
  bw: ../lectures/_assets/03-01/book/class-vs-object.png
