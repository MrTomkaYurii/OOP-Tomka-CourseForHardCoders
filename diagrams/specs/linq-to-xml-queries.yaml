# Лекція 19.3 «XDocument та LINQ to XML»
# Оригінал: lectures/_assets/19-03/Архив/linq-to-xml-queries.png
id: linq-to-xml-queries
title: "LINQ to XML: навігація і запити"
subtitle: "Element/Elements — лише прямі діти; Descendants — на будь-якій глибині; результат — IEnumerable<XElement> для LINQ"

types: [XDocument, XElement, XAttribute, IEnumerable]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "doc"
            children:
              - box:
                  check: skip
                  code: |
                    <clinic>
                      <ward name="Кардіологія">
                        <patient id="1" status="stable">
                          <name>Ірина</name><age>29</age>
                        </patient>
                        <patient id="2" status="critical">
                          <name>Олег</name><age>45</age>
                        </patient>
                      </ward>
                      <ward name="Хірургія">
                        <patient id="3" status="stable">
                          <name>Марія</name><age>61</age>
                        </patient>
                      </ward>
                    </clinic>
              - kv:
                  check: skip
                  key_code: true
                  groups:
                    - rows:
                        - ["Element(n)",     "перший прямий дочірній"]
                        - ["Elements(n)",    "усі прямі дочірні"]
                        - ["Descendants(n)", "нащадки будь-якої глибини"]
                        - ["Ancestors(n)",   "предки — вгору"]
                        - ["Attribute(n)",   "`XAttribute` або `null`"]
        - panel:
            heading: "Вираз → результат"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - heading: "навігація"
                      rows:
                        - ["doc.Root!.Name.LocalName",                         "`\"clinic\"`"]
                        - ["doc.Root!.Elements(\"patient\").Count()",          "`0` — не прямі діти"]
                        - ["doc.Descendants(\"patient\").Count()",             "`3`"]
                    - check: skip
                      rows:
                        - ["(string?)doc.Root!.Element(\"ward\")!", ""]
                        - ["    .Attribute(\"name\")", "`\"Кардіологія\"`"]
                    - heading: "LINQ: `var ps = doc.Descendants(\"patient\");`"
                      rows:
                        - ["ps.Count(p => (string?)p.Attribute(\"status\") == \"critical\")", "`1`"]
                        - ["ps.Max(p => (int)p.Element(\"age\")!)", "`61`"]
                        - ["ps.First().Ancestors(\"ward\").Count()", "`1`"]
                    - check: skip
                      rows:
                        - ["string.Join(\",\", ps.Select(p => (string?)p.Element(\"name\")))", ""]
                        - ["", "`\"Ірина,Олег,Марія\"`"]
              - note:
                  text:
                    - "Приведення `(string?)`, `(int?)` замість `.Value`:"
                    - "відсутній вузол дає `null`, а не виняток"

check:
  usings: [System, System.Linq, System.Xml.Linq]
  context: |
    var doc = XDocument.Parse("""<clinic><ward name="Кардіологія"><patient id="1" status="stable"><name>Ірина</name><age>29</age></patient><patient id="2" status="critical"><name>Олег</name><age>45</age></patient></ward><ward name="Хірургія"><patient id="3" status="stable"><name>Марія</name><age>61</age></patient></ward></clinic>""");
    var ps = doc.Descendants("patient");
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq((string?)doc.Root!.Element("ward")!.Attribute("name"), "Кардіологія");
    Eq(string.Join(",", ps.Select(p => (string?)p.Element("name"))), "Ірина,Олег,Марія");
    Eq((string?)doc.Root!.Attribute("none"), (string?)null);
    try { _ = doc.Root!.Attribute("none")!.Value; Eq(0, 1); } catch (NullReferenceException) { }

publish:
  dark: ../lectures/_assets/19-03/linq-to-xml-queries.png
  bw: ../lectures/_assets/19-03/book/linq-to-xml-queries.png
