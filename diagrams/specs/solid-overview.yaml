# Лекція 20.1 «Вступ до SOLID»
# Оригінал: lectures/_assets/20-01/Архив/solid-overview.png
id: solid-overview
title: "Пʼять принципів SOLID"
subtitle: "Кожен принцип лікує свій симптом поганого дизайну; разом — менше звʼязаності, більше звʼязності"

types: []

body:
  - panel:
      heading: "Роберт Мартін, 1990-ті – 2002; акронім — Майкл Фезерс, ~2004"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["", "принцип", "суть", "лікує", "розділ"]
            groups:
              - rows:
                  - ["[[S]]", "Single Responsibility",  "одна причина для зміни класу",         "God Class, крихкість",          "20.2"]
                  - ["[[O]]", "Open/Closed",            "нове — додаванням класу, не правкою",   "`switch` по типах, жорсткість", "20.3"]
                  - ["[[L]]", "Liskov Substitution",    "підклас не порушує контракт базового",  "`if (x is Підклас)`, сюрпризи", "20.4"]
                  - ["[[I]]", "Interface Segregation",  "вузькі інтерфейси під клієнтів",        "`NotImplementedException`",     "20.5"]
                  - ["[[D]]", "Dependency Inversion",   "залежність від абстракцій, не класів",  "`new` усередині, нетестованість", "20.6"]
        - text:
            text:
              - "Це евристики, а не закони: застосовуйте там, де зміни [[справді очікуються]], інакше отримаєте зайві шари абстракцій."

  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Симптоми без SOLID"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["жорсткість",   "одна зміна тягне каскад інших"]
                        - ["крихкість",    "правка ламає непов'язане"]
                        - ["нерухомість",  "модуль не перевикористати"]
                        - ["вʼязкість",    "«як треба» важче, ніж «як-небудь»"]
        - panel:
            heading: "Корінь усіх чотирьох"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["висока звʼязаність", "класи знають нутрощі одне одного"]
                        - ["низька звʼязність",  "у класі змішано непов'язане"]
                        - ["SOLID",              "[[знижує]] першу, [[підвищує]] другу"]

publish:
  dark: ../lectures/_assets/20-01/solid-overview.png
  bw: ../lectures/_assets/20-01/book/solid-overview.png
