# Лекція 2.9 «Перетворення базових типів»
# Оригінал: lectures/_assets/02-09/Архив/type-conversion.png
id: type-conversion
title: "Розширювальні й звужувальні перетворення"
subtitle: "Розширення — неявне, звуження — лише через (тип); результати виконано на .NET 10"

types: []

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Розширення — неявно"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["Widen((byte)4)",    "`4`"]
                        - ["(long)int.MaxValue", "`2147483647L`"]
                    - heading: "але до float — з втратою точності"
                      rows:
                        - ["(int)(float)16777217", "`16777216`"]
        - panel:
            heading: "Звуження — явно (тип)"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["(int)36.9",          "`36`"]
                        - ["(int)-36.9",         "`-36`"]
                        - ["Narrow(633)",        "`(byte)121`"]
                        - ["(int)Math.Round(36.5)", "`36`"]
  - note:
      text:
        - "`(int)` відкидає дріб у бік нуля, не округлює; `Math.Round` за замовчуванням — до парного (36.5 → 36, 37.5 → 38)."
        - "`byte a = 4; byte b = a + 70;` — CS0266: арифметика над `byte` дає `int`."

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    int Widen(byte b) => b;
    byte Narrow(int x) => (byte)x;

publish:
  dark: ../lectures/_assets/02-09/type-conversion.png
  bw: ../lectures/_assets/02-09/book/type-conversion.png
