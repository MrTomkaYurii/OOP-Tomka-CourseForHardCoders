# Лекція 19.6 «XPath та вибір між JSON і XML»
# Оригінал: lectures/_assets/19-06/Архив/xpath-syntax.png
id: xpath-syntax
title: "XPath: адресація вузлів XML"
subtitle: "Шлях від кореня або з будь-якої глибини, предикати в [ ], атрибути через @; нумерація з 1"

types: [XmlDocument, XmlNodeList, XDocument, XPathNavigator]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "doc"
            children:
              - box:
                  check: skip
                  code: |
                    <clinic>
                      <patient id="1" ward="Терапія">
                        <name>Ірина</name><age>29</age>
                        <diagnosis severity="mild">J06</diagnosis>
                      </patient>
                      <patient id="2" ward="Кардіологія">
                        <name>Іван</name><age>45</age>
                        <diagnosis severity="critical">I21</diagnosis>
                      </patient>
                      <patient id="3" ward="Терапія">
                        <name>Марія</name><age>61</age>
                      </patient>
                    </clinic>
              - note:
                  text:
                    - "`doc.SelectNodes(xp)` / `SelectSingleNode(xp)`;"
                    - "для `XDocument` — `XPathSelectElements`"
        - panel:
            heading: "Вираз → що знайдено"
            children:
              - kv:
                  check: "Eq(N({}), {v});"
                  columns: ["XPath", "вузлів", "що це"]
                  groups:
                    - heading: "шлях"
                      rows:
                        - ["\"/clinic/patient\"",                    "`3`", "прямі діти кореня"]
                        - ["\"//diagnosis\"",                        "`2`", "на будь-якій глибині"]
                        - ["\"/clinic/patient[1]\"",                 "`1`", "Ірина — [[з 1]], не з 0"]
                        - ["\"/clinic/patient[last()]\"",            "`1`", "Марія"]
                    - heading: "предикати"
                      rows:
                        - ["\"//patient[@ward='Терапія']\"",         "`2`", "за атрибутом"]
                        - ["\"//patient[age > 40]\"",                "`2`", "за дочірнім елементом"]
                        - ["\"//patient[contains(name, 'Ів')]\"",    "`1`", "функція рядка"]
                        - ["\"//patient[not(diagnosis)]\"",          "`1`", "немає дитини"]
                        - ["\"//diagnosis[@severity='critical']/..\"", "`1`", "`..` — батько"]
                        - ["\"//patient/@id\"",                      "`3`", "самі атрибути"]
              - kv:
                  check: skip
                  columns: ["обчислення", "результат"]
                  groups:
                    - rows:
                        - ["nav.Evaluate(\"count(//patient)\")",            "`3.0` — `double`"]
                        - ["nav.Evaluate(\"sum(//age) div count(//age)\")", "`45.0` — XPath 1.0: `div`, не `/`"]

check:
  usings: [System, System.Xml, System.Xml.XPath]
  context: |
    var doc = new XmlDocument();
    doc.LoadXml("<clinic><patient id='1' ward='Терапія'><name>Ірина</name><age>29</age><diagnosis severity='mild'>J06</diagnosis></patient><patient id='2' ward='Кардіологія'><name>Іван</name><age>45</age><diagnosis severity='critical'>I21</diagnosis></patient><patient id='3' ward='Терапія'><name>Марія</name><age>61</age></patient></clinic>");
    int N(string xp) => doc.SelectNodes(xp)!.Count;
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(doc.SelectSingleNode("/clinic/patient[1]/name")!.InnerText, "Ірина"); Eq(doc.SelectSingleNode("/clinic/patient[last()]/name")!.InnerText, "Марія");
    var nav = doc.CreateNavigator()!; Eq((double)nav.Evaluate("count(//patient)"), 3.0); Eq((double)nav.Evaluate("sum(//age) div count(//age)"), 45.0);

publish:
  dark: ../lectures/_assets/19-06/xpath-syntax.png
  bw: ../lectures/_assets/19-06/book/xpath-syntax.png
