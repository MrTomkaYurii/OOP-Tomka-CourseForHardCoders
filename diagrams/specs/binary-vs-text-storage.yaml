# Лекція 18.5 «BinaryReader та BinaryWriter»
# Оригінал: lectures/_assets/18-05/Архив/binary-vs-text-storage.png
id: binary-vs-text-storage
title: "Текстове чи бінарне зберігання"
subtitle: "Ті самі значення: у тексті — символи, які треба розбирати; у бінарному файлі — байти у форматі типу"

types: [BinaryWriter, BinaryReader, StreamWriter, BitConverter, EndOfStreamException]

body:
  - panel:
      heading: "id = 1001, temp = 36.6, pulse = 72, critical = true"
      children:
        - cells:
            rows:
              - caption: "текст"
                cells: ["1", "0", "0", "1", ";", "3", "6", ".", "6", ";", "7", "2", ";", "T", "…"]
                kinds: [box, box, box, box, box_muted, box, box, box, box, box_muted, box, box, box_muted, box, box_muted]
              - caption: "бінарно"
                cells: ["E9", "03", "00", "00", "d", "d", "d", "d", "d", "d", "d", "d", "48", "00", "01"]
                kinds: [box_accent, box_accent, box_accent, box_accent, box, box, box, box, box, box, box, box, box_accent, box_accent, box]
        - text:
            text:
              - "Текст `\"1001;36.6;72;True\"` — 17 байтів (показано перші 15), при читанні — `Split` і `Parse`."
              - "Бінарно — 15 байтів: `int` 4 + `double` 8 + `short` 2 + `bool` 1; 1001 = 0x03E9 записано [[little-endian]]."

  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Текст"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["+", "читається людиною, редактором, git diff"]
                        - ["+", "переноситься між мовами й ОС"]
                        - ["−", "більший розмір, розбір рядків"]
                        - ["−", "культура: `36,6` чи `36.6`"]
                        - ["де", "JSON, CSV, XML, журнали, конфіги"]
        - panel:
            heading: "Бінарне"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["+", "компактно, без парсингу"]
                        - ["+", "фіксований запис → `Seek` за O(1)"]
                        - ["−", "без схеми не прочитати"]
                        - ["−", "порядок читання = порядку запису"]
                        - ["де", "сигнали ЕКГ, зображення, кеші"]

check:
  usings: [System, System.IO, System.Text]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var ms = new MemoryStream(); var w = new BinaryWriter(ms);
    w.Write(1001); w.Write(36.6); w.Write((short)72); w.Write(true);
    var b = ms.ToArray(); Eq(b.Length, 15); Eq(BitConverter.ToString(b, 0, 4), "E9-03-00-00"); Eq(BitConverter.ToString(b, 12, 3), "48-00-01");
    Eq(Encoding.UTF8.GetByteCount("1001;36.6;72;True"), 17);
    var r = new BinaryReader(new MemoryStream(b)); Eq(r.ReadInt32(), 1001); Eq(r.ReadDouble(), 36.6);
    try { new BinaryReader(new MemoryStream(new byte[2])).ReadInt32(); Eq(0, 1); } catch (EndOfStreamException) { }

publish:
  dark: ../lectures/_assets/18-05/binary-vs-text-storage.png
  bw: ../lectures/_assets/18-05/book/binary-vs-text-storage.png
