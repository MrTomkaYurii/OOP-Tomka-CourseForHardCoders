# Лекція 19.4 «XmlReader та XmlWriter»
# Оригінал: lectures/_assets/19-04/Архив/xmlwriter-flow.png
id: xmlwriter-flow
title: "XmlWriter: послідовний запис XML"
subtitle: "Кожен виклик дописує фрагмент у потік; дерево в памʼяті не будується"

types: [XmlWriter, XmlWriterSettings, StringBuilder, Encoding, InvalidOperationException]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Виклики"
            children:
              - box:
                  code: |
                    var set = new XmlWriterSettings { Indent = true };
                    using (var w = XmlWriter.Create(sb, set))
                    {
                        w.WriteStartDocument();
                        w.WriteStartElement("patient");
                        w.WriteAttributeString("id", "PT-1");
                        w.WriteElementString("name", "Петренко");
                        w.WriteStartElement("diagnosis");
                        w.WriteAttributeString("code", "I10");
                        w.WriteString("АТ < 140 & ЧСС");
                        w.WriteEndElement();
                        w.WriteEndElement();
                    }
        - panel:
            heading: "Результат у sb"
            children:
              - box:
                  kind: box_accent
                  check: skip
                  code: |
                    <?xml version="1.0" encoding="utf-16"?>
                    <patient id="PT-1">
                      <name>Петренко</name>
                      <diagnosis code="I10">АТ &lt; 140 &amp; ЧСС</diagnosis>
                    </patient>
                  notes:
                    - "`<` і `&` екрануються [[автоматично]];"
                    - "`encoding=\"utf-16\"` — бо пишемо в `string`;"
                    - "у файл — `utf-8` (за `Encoding` налаштувань)"
              - note:
                  text:
                    - "`WriteElementString(n, v)` = `WriteStartElement(n)`"
                    - "+ `WriteString(v)` + `WriteEndElement()`;"
                    - "`WriteEndElement` закриває [[останній відкритий]]"
                    - "елемент — імʼя не передається"

  - panel:
      heading: "Правила"
      children:
        - kv:
            check: skip
            key_code: false
            groups:
              - rows:
                  - ["незакриті елементи",          "`Dispose` [[сам дописує]] всі `</…>` — помилки немає"]
                  - ["два кореневі елементи",       "`InvalidOperationException` (за `ConformanceLevel.Document`)"]
                  - ["атрибут після вмісту елемента", "`InvalidOperationException` — атрибути пишуть одразу після `WriteStartElement`"]
                  - ["`WriteRaw(xml)`",             "без екранування — відповідальність за коректність на вас"]
                  - ["`Indent = true`",             "відступи для людини; без них — компактно"]

check:
  usings: [System, System.Text, System.Xml]
  context: |
    var sb = new StringBuilder();
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(sb.ToString().Replace("\r\n", "\n"), "<?xml version=\"1.0\" encoding=\"utf-16\"?>\n<patient id=\"PT-1\">\n  <name>Петренко</name>\n  <diagnosis code=\"I10\">АТ &lt; 140 &amp; ЧСС</diagnosis>\n</patient>");
    var s2 = new StringBuilder(); using (var w2 = XmlWriter.Create(s2, new XmlWriterSettings { OmitXmlDeclaration = true })) { w2.WriteStartElement("a"); w2.WriteStartElement("b"); } Eq(s2.ToString(), "<a><b /></a>");
    try { var s3 = new StringBuilder(); using var w3 = XmlWriter.Create(s3); w3.WriteElementString("a", "1"); w3.WriteElementString("b", "2"); Eq(0, 1); } catch (InvalidOperationException) { }
    try { var s4 = new StringBuilder(); using var w4 = XmlWriter.Create(s4); w4.WriteStartElement("a"); w4.WriteString("x"); w4.WriteAttributeString("k", "v"); Eq(0, 1); } catch (InvalidOperationException) { }

publish:
  dark: ../lectures/_assets/19-04/xmlwriter-flow.png
  bw: ../lectures/_assets/19-04/book/xmlwriter-flow.png
