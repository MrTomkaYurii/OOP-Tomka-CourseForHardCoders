# Лекція 13.2 «Клас Math»
# Оригінал: lectures/_assets/13-02/Архив/math-overview.png
id: math-overview
title: "Клас Math: огляд методів"
subtitle: "Статичний клас; усі значення праворуч перевірено виконанням коду"

body:
  # ── 1. Округлення ─────────────────────────────────────────────────────────
  - panel:
      heading: "Чотири способи округлення"
      children:
        - row:
            gap: 24
            children:
              - kv:
                  key_code: false
                  columns: ["x", "Floor", "Ceiling", "Truncate", "Round", "Round(…, AwayFromZero)"]
                  groups:
                    - rows:
                        - ["`2.5`",  "`2`",  "`3`",  "`2`",  "`[[2]]`",  "`3`"]
                        - ["`3.5`",  "`3`",  "`4`",  "`3`",  "`[[4]]`",  "`4`"]
                        - ["`-2.5`", "`-3`", "`-2`", "`-2`", "`[[-2]]`", "`-3`"]
                        - ["`3.7`",  "`3`",  "`4`",  "`3`",  "`4`",      "`4`"]
              - stack:
                  gap: 16
                  children:
                    - note:
                        kind: box_accent
                        text:
                          - "`Math.Round` за замовчуванням —"
                          - "банківське округлення: середина"
                          - "(.5) іде до [[парного]] числа"
                    - note:
                        text:
                          - "`Floor` — вниз, `Ceiling` — вгору,"
                          - "`Truncate` — відкинути дріб"

  - row:
      gap: 24
      children:
        # ── 2. Знак і межі ────────────────────────────────────────────────
        - panel:
            heading: "Знак, межі, константи"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  groups:
                    - rows:
                        - ["Math.Abs(-5)",          "`5`"]
                        - ["Math.Sign(-3.2)",       "`-1` (або 0, 1)"]
                        - ["Math.CopySign(3.0, -1)", "`-3` — знак другого"]
                        - ["Math.Min(4, 9)",        "`4`"]
                        - ["Math.Max(4, 9)",        "`9`"]
                        - ["Math.Clamp(15, 0, 10)", "`10` — обмежити в [0, 10]"]
                    - check: skip
                      rows:
                        - ["Math.PI",  "3.14159…"]
                        - ["Math.E",   "2.71828…"]
                        - ["Math.Tau", "2π = 6.28318… (.NET 5+)"]

        # ── 3. Степені й корені ───────────────────────────────────────────
        - panel:
            heading: "Степені, корені, логарифми"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  groups:
                    - rows:
                        - ["Math.Pow(2, 10)",     "`1024.0`"]
                        - ["Math.Sqrt(16)",       "`4.0`"]
                        - ["Math.Cbrt(-27)",      "`-3.0` — і для від'ємних"]
                        - ["Math.Log(Math.E)",    "`1.0` — натуральний"]
                        - ["Math.Log(8, 2)",      "`3.0` — за основою 2"]
                        - ["Math.Log10(1000)",    "`3.0`"]
                        - ["Math.Sin(Math.PI / 2)", "`1.0` — аргумент у радіанах"]
              - note:
                  text:
                    - "градуси → радіани: `deg * Math.PI / 180`"

        # ── 4. Особливі значення ──────────────────────────────────────────
        - panel:
            heading: "Особливі значення"
            children:
              - kv:
                  check: skip
                  groups:
                    - heading: "double — без винятків"
                      rows:
                        - ["0.0 / 0.0",       "`double.NaN`"]
                        - ["1.0 / 0.0",       "`double.PositiveInfinity`"]
                        - ["Math.Sqrt(-1)",   "`double.NaN`"]
                        - ["NaN == NaN",      "`[[false]]` → `double.IsNaN(x)`"]
                    - heading: "винятки"
                      rows:
                        - ["1 / 0  // int",          "`DivideByZeroException`"]
                        - ["Math.Abs(int.MinValue)", "`OverflowException`"]
                        - ["Math.Sign(double.NaN)",  "`ArithmeticException`"]

check:
  usings: [System]
  context: |
    void Eq(double a, double b) { if (Math.Abs(a - b) > 1e-12) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    double[] xs = [2.5, 3.5, -2.5, 3.7];
    double[,] exp = { { 2, 3, 2, 2, 3 }, { 3, 4, 3, 4, 4 }, { -3, -2, -2, -2, -3 }, { 3, 4, 3, 4, 4 } };
    for (int i = 0; i < xs.Length; i++)
    {
        double x = xs[i];
        double[] got = [Math.Floor(x), Math.Ceiling(x), Math.Truncate(x), Math.Round(x), Math.Round(x, MidpointRounding.AwayFromZero)];
        for (int j = 0; j < 5; j++) Assert(got[j] == exp[i, j], $"округлення {x} #{j}");
    }
    double zero = 0.0; int izero = 0;
    Assert(double.IsNaN(zero / zero) && double.IsPositiveInfinity(1.0 / zero) && double.IsNaN(Math.Sqrt(-1)), "NaN/Inf");
    Assert(double.NaN != double.NaN, "NaN == NaN false");
    try { _ = 1 / izero; Assert(false, "1/0"); } catch (DivideByZeroException) { }
    try { _ = Math.Abs(int.MinValue); Assert(false, "Abs"); } catch (OverflowException) { }
    try { _ = Math.Sign(double.NaN); Assert(false, "Sign NaN"); } catch (ArithmeticException) { }
    Assert(Math.Abs(Math.Tau - 2 * Math.PI) < 1e-15, "Tau");

publish:
  dark: ../lectures/_assets/13-02/math-overview.png
  bw: ../lectures/_assets/13-02/book/math-overview.png
