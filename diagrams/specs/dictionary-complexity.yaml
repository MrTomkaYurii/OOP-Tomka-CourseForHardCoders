# Лекція 10.5 «Словник Dictionary<K, V>»
# Оригінал: lectures/_assets/10-05/Архив/dictionary-complexity.png
id: dictionary-complexity
title: "Dictionary<K, V>, HashSet<T> і List<T>: складність"
subtitle: "Хеш-колекції шукають за ключем за O(1) у середньому; List — лише перебором"

types: [Dictionary, HashSet, List]

body:
  - panel:
      heading: "Порівняння операцій"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["операція", "Dictionary<K, V>", "HashSet<T>", "List<T>"]
            groups:
              - heading: "пошук"
                rows:
                  - ["за ключем / елементом", "`d[key]` [[O(1)*]]",       "`Contains` [[O(1)*]]", "`Find` O(n)"]
                  - ["чи є",                  "`ContainsKey` O(1)*",       "`Contains` O(1)*",     "`Contains` O(n)"]
                  - ["за значенням",          "`ContainsValue` O(n)",      "—",                    "`Contains` O(n)"]
                  - ["безпечне читання",      "`TryGetValue` O(1)*",       "`TryGetValue` O(1)*",  "—"]
              - heading: "зміна"
                rows:
                  - ["додати",                "`Add`/`TryAdd` O(1)*",      "`Add` O(1)*",          "`Add` O(1)*"]
                  - ["видалити",              "`Remove(key)` O(1)*",       "`Remove` O(1)*",       "`Remove` O(n)"]
                  - ["дублікати",             "ключ — ні",                  "ні, `Add` → `false`",  "так"]
              - heading: "решта"
                rows:
                  - ["`foreach`",             "O(n), пари `KeyValuePair`", "O(n)",                 "O(n)"]
                  - ["порядок обходу",        "[[не гарантовано]]",         "не гарантовано",       "порядок вставки"]
                  - ["`Count`",               "O(1)",                       "O(1)",                 "O(1)"]
        - row:
            gap: 16
            equal: true
            children:
              - note:
                  text:
                    - "* у середньому: амортизовано (розширення"
                    - "таблиці) і за умови рівномірних хешів"
              - note:
                  kind: box_accent
                  text:
                    - "Усі ключі з однаковим `GetHashCode` —"
                    - "один ланцюжок, пошук деградує до O(n)"

check:
  usings: [System, System.Collections.Generic]
  context: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
  asserts: |
    var hs = new HashSet<string> { "I10" }; Assert(!hs.Add("I10") && hs.TryGetValue("I10", out _), "HashSet");
    var d = new Dictionary<string, int> { ["a"] = 1 }; foreach (KeyValuePair<string, int> kv in d) Assert(kv.Value == 1, "KeyValuePair");

publish:
  dark: ../lectures/_assets/10-05/dictionary-complexity.png
  bw: ../lectures/_assets/10-05/book/dictionary-complexity.png
