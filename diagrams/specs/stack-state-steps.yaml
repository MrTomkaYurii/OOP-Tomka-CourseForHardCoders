# Лекція 10.4 «Stack<T>»
# Оригінал: lectures/_assets/10-04/Архив/stack-state-steps.png
id: stack-state-steps
title: "Stack<T>: стан після кожної операції"
subtitle: "Комірки — від дна (ліворуч) до вершини (праворуч); виділено вершину"

types: [Stack, List]

body:
  - panel:
      heading: "var log = new Stack<string>();"
      children:
        - cells:
            rows:
              - caption: "початок"
                cells: ["·", "·", "·"]
                kinds: [box_muted, box_muted, box_muted]
                top: ["дно", "", "вершина"]
                note: "Count = 0; Pop() кинув би InvalidOperationException"
              - caption: "Push(\"Аспірин\")"
                cells: ["Аспірин", "·", "·"]
                kinds: [box_accent, box_muted, box_muted]
                note: "Count = 1"
              - caption: "Push(\"Ібупрофен\")"
                cells: ["Аспірин", "Ібупрофен", "·"]
                kinds: [box, box_accent, box_muted]
                note: "Count = 2"
              - caption: "Push(\"Лізиноприл\")"
                cells: ["Аспірин", "Ібупрофен", "Лізиноприл"]
                kinds: [box, box, box_accent]
                note: "Count = 3"
              - caption: "Pop()"
                cells: ["Аспірин", "Ібупрофен", "·"]
                kinds: [box, box_accent, box_muted]
                note: "повертає \"Лізиноприл\", Count = 2"
              - caption: "Peek()"
                cells: ["Аспірин", "Ібупрофен", "·"]
                kinds: [box, box_accent, box_muted]
                note: "повертає \"Ібупрофен\", стек не змінюється"

  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "Обхід — від вершини до дна"
            code: |
              foreach (var m in log) { }   // Ібупрофен, Аспірин
              string[] arr = log.ToArray(); // так само
        - box:
            title: "Стек із колекції"
            code: |
              var s = new Stack<string>(new List<string> { "A", "B", "C" });
              string top = s.Peek();   // "C" — останній стає вершиною

check:
  usings: [System, System.Collections.Generic]
  context: |
    var log = new Stack<string>();
    log.Push("Аспірин"); log.Push("Ібупрофен"); log.Push("Лізиноприл");
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    Assert(log.Pop() == "Лізиноприл" && log.Peek() == "Ібупрофен" && log.Count == 2, "Pop/Peek");
  asserts: |
    Assert(arr[0] == "Ібупрофен" && arr[1] == "Аспірин", "ToArray від вершини");
    Assert(top == "C", "вершина з колекції");

publish:
  dark: ../lectures/_assets/10-04/stack-state-steps.png
  bw: ../lectures/_assets/10-04/book/stack-state-steps.png
