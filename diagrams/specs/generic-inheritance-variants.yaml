# Лекція 4.10 «Наслідування узагальнених типів»
# Оригінал: lectures/_assets/04-10/Архив/generic-inheritance-variants.png
id: generic-inheritance-variants
title: "Чотири варіанти успадкування від MedicalRecord<T>"
subtitle: "Похідний клас передає T, фіксує його, додає свій параметр — або все разом; класи й вивід із лекції"

types: [MedicalRecord, FlexibleRecord, InpatientRecord, TaggedRecord, AnnotatedRecord]

body:
  - box:
      title: "Базовий клас"
      kind: box_accent
      check: skip
      code: "abstract class MedicalRecord<T> { public T Id { get; } public string Description { get; set; } … }"
  - panel:
      heading: "Варіанти (вивід runnable-прикладів)"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["оголошення", "тип Id", "приклад виводу"]
            groups:
              - rows:
                  - ["`class FlexibleRecord<T> : MedicalRecord<T>`",               "будь-який `T`",   "«[P-002] Бронхіт | Амбулаторія»"]
                  - ["`class InpatientRecord : MedicalRecord<string>`",            "[[`string`]]",    "«[IP-001] Планова операція | Палата 12»"]
                  - ["`class TaggedRecord<T> : MedicalRecord<int>`",               "[[`int`]], T — для Tag", "«[1001] Гіпертонія | Тег: кардіологія»"]
                  - ["`class AnnotatedRecord<T, TNote> : MedicalRecord<T>`",       "`T`, + `TNote`",  "«[P-002] Бронхіт | Примітка: 3»"]
        - text:
            text: ["Обмеження базового (`where T : class`) похідний, що передає `T`, мусить повторити — інакше CS0452."]

check:
  usings: [System]
  asserts: |
    MedicalRecord<string> r = new InpatientRecord("IP-001", "Планова операція");
    if (typeof(TaggedRecord<string>).BaseType != typeof(MedicalRecord<int>)) throw new Exception("tagged");
    if (typeof(AnnotatedRecord<int, string>).BaseType != typeof(MedicalRecord<int>)) throw new Exception("annot");
  types: |
    abstract class MedicalRecord<T> { public T Id { get; } public string Description { get; set; } public MedicalRecord(T id, string d) { Id = id; Description = d; } }
    class FlexibleRecord<T> : MedicalRecord<T> { public FlexibleRecord(T id, string d) : base(id, d) { } }
    class InpatientRecord : MedicalRecord<string> { public InpatientRecord(string id, string d) : base(id, d) { } }
    class TaggedRecord<T> : MedicalRecord<int> { public T? Tag { get; set; } public TaggedRecord(int id, string d) : base(id, d) { } }
    class AnnotatedRecord<T, TNote> : MedicalRecord<T> { public TNote? Note { get; set; } public AnnotatedRecord(T id, string d) : base(id, d) { } }

publish:
  dark: ../lectures/_assets/04-10/generic-inheritance-variants.png
  bw: ../lectures/_assets/04-10/book/generic-inheritance-variants.png
