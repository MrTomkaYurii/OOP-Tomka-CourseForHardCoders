# Лекція 4.2 «Перетворення типів»
# Оригінал: lectures/_assets/04-02/Архив/type-hierarchy.png
id: type-hierarchy
title: "Ієрархія типів клінічної системи"
subtitle: "object → Person → Patient | Doctor; кожен рівень — тип, до якого можна неявно привести нижчий"

types: [Person, Patient, Doctor]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Ланцюг успадкування"
            children:
              - chain:
                  align: left
                  nodes:
                    - {title: "object (System.Object)", kind: box_muted, sub: ["неявний базовий для всіх"]}
                    - {title: "Person", kind: box_accent, sub: ["`Name`, `Age`, `Print()`"]}
                    - {title: "Patient · Doctor", sub: ["+ `Diagnosis` · + `Specialization`"]}
        - panel:
            heading: "Відношення is-a (виконано)"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["pat is Person",                      "`true`"]
                        - ["pat is object",                      "`true`"]
                        - ["per is Patient",                     "`false`"]
                        - ["typeof(Patient).BaseType == typeof(Person)", "`true`"]
                        - ["((object)pat).GetType().Name",       "`\"Patient\"`"]
              - text:
                  text: ["`GetType()` повертає [[реальний]] тип, а не тип змінної."]

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    Patient pat = new Patient("Іван Петренко", 45, "Гіпертонія");
    Person per = new Person("Сергій Бойко", 52);
  types: |
    class Person { public string Name { get; set; } = ""; public int Age { get; set; } public Person(string n, int a) { Name = n; Age = a; } public virtual string Print() => "Person"; }
    class Patient : Person { public string Diagnosis { get; set; } = ""; public Patient(string n, int a, string d) : base(n, a) => Diagnosis = d; public override string Print() => "Patient"; }
    class Doctor : Person { public string Specialization { get; set; } = ""; public Doctor(string n, int a, string s) : base(n, a) => Specialization = s; public override string Print() => "Doctor"; }

publish:
  dark: ../lectures/_assets/04-02/type-hierarchy.png
  bw: ../lectures/_assets/04-02/book/type-hierarchy.png
