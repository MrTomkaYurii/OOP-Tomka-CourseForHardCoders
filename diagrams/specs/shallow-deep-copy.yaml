# Лекція 7.6 «Копіювання об'єктів. Інтерфейс ICloneable»
# Оригінал: lectures/_assets/07-06/Архив/shallow-deep-copy.png
id: shallow-deep-copy
title: "Поверхневе і глибоке копіювання"
subtitle: "`patient2 = (Patient)patient1.Clone(); patient2.Diagnosis.Code = \"I10\";` — що побачить patient1?"

types: [Patient, DiagnosisRecord, ICloneable]

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Поверхневе: MemberwiseClone()"
            children:
              - box:
                  title: "Clone()"
                  check: skip
                  code: "public object Clone() => MemberwiseClone();"
              - hchain:
                  nodes:
                    - {title: "patient1", sub: ["Петренко"]}
                    - {title: "DiagnosisRecord", via: "Diagnosis", kind: box_accent, sub: ["[[один на двох]]"]}
                    - {title: "patient2", fwd: false, back: "Diagnosis", sub: ["Іваненко"]}
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["patient1", "Петренко, [[I10]] — змінився!"]
                        - ["patient2", "Іваненко, I10"]
        - panel:
            heading: "Глибоке: нові вкладені об'єкти"
            children:
              - box:
                  title: "Clone()"
                  check: skip
                  code: |
                    var copy = (Patient)MemberwiseClone();
                    copy.Diagnosis = new DiagnosisRecord(…);
              - hchain:
                  nodes:
                    - {title: "patient1", sub: ["Петренко"]}
                    - {title: "DiagnosisRecord", via: "Diagnosis", sub: ["J18.0"]}
              - hchain:
                  nodes:
                    - {title: "patient2", sub: ["Іваненко"]}
                    - {title: "DiagnosisRecord", via: "Diagnosis", kind: box_accent, sub: ["[[копія]]: I10"]}
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["patient1", "Петренко, J18.0 — незмінний"]
                        - ["patient2", "Іваненко, I10"]
  - note:
      text:
        - "`string` можна копіювати поверхнево — він незмінний."
        - "`ICloneable.Clone()` не каже, яке копіювання робить, і повертає `object` —"
        - "Microsoft не радить його в публічних API; для незмінних даних — `record` + `with` (8.10)."

check:
  usings: [System]
  asserts: |
    var p1 = new Patient("Петренко", new DiagnosisRecord("J18.0"));
    var p2 = (Patient)p1.Clone(); p2.Diagnosis.Code = "I10";
    if (p1.Diagnosis.Code != "I10") throw new Exception("shallow");
    var d1 = new Patient("Петренко", new DiagnosisRecord("J18.0"));
    var d2 = d1.DeepClone(); d2.Diagnosis.Code = "I10";
    if (d1.Diagnosis.Code != "J18.0") throw new Exception("deep");
  types: |
    class DiagnosisRecord { public string Code { get; set; } public DiagnosisRecord(string c) => Code = c; }
    class Patient : ICloneable
    {
        public string Name { get; set; } public DiagnosisRecord Diagnosis { get; set; }
        public Patient(string n, DiagnosisRecord d) { Name = n; Diagnosis = d; }
        public object Clone() => MemberwiseClone();
        public Patient DeepClone() { var c = (Patient)MemberwiseClone(); c.Diagnosis = new DiagnosisRecord(Diagnosis.Code); return c; }
    }

publish:
  dark: ../lectures/_assets/07-06/shallow-deep-copy.png
  bw: ../lectures/_assets/07-06/book/shallow-deep-copy.png
