# Лекція 2.18 «Повернення значення та оператор return»
# Оригінал: lectures/_assets/02-18/Архив/void-vs-nonvoid.png (підписи були набрані латиницею-транслітом)
id: void-vs-nonvoid
title: "void і методи, що повертають значення"
subtitle: "void-метод виконує дію; non-void — обчислює значення, яке використовує викликаючий код"

types: []

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "void — нічого не повертає"
            check: skip
            code: |
              void PrintDiagnosis(string diagnosis)
              {
                  Console.WriteLine($"Діагноз: {diagnosis}");
              }

              PrintDiagnosis("Пневмонія");   // лише виклик
            notes: ["`var x = PrintDiagnosis(…)` — CS0815"]
        - box:
            title: "string — повертає значення"
            kind: box_accent
            check: skip
            code: |
              string GetDiagnosis()
              {
                  string result = "Пневмонія";
                  return result;
              }

              string d = GetDiagnosis();      // d = "Пневмонія"
            notes: ["кожен шлях виконання мусить мати `return` — інакше CS0161"]
  - panel:
      heading: "Де можна використати виклик (перевірено компілятором)"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["використання", "void PrintDiagnosis", "string GetDiagnosis"]
            groups:
              - rows:
                  - ["окрема інструкція",     "✓",           "✓ (результат відкинуто)"]
                  - ["присвоєння `var x = …`", "[[CS0815]]",  "✓"]
                  - ["аргумент `WriteLine(…)`", "[[CS1503]]", "✓"]
                  - ["у виразі `\"Діагноз: \" + …`", "[[CS0019]]", "✓"]

check:
  usings: [System]
  asserts: |
    string GetDiagnosis() { string result = "Пневмонія"; return result; }
    if (GetDiagnosis() != "Пневмонія") throw new Exception("r");

publish:
  dark: ../lectures/_assets/02-18/void-vs-nonvoid.png
  bw: ../lectures/_assets/02-18/book/void-vs-nonvoid.png
