# Лекція 5.6 «Пошук блоку catch при обробці винятків»
# Оригінал: lectures/_assets/05-06/Архив/call-stack-search.png
id: call-stack-search
title: "Пошук catch у стеку викликів: дві фази"
subtitle: "ProcessAdmission → SaveRecord → ParseAge(\"abc\"); порядок рядків — з виводу runnable-прикладу"

types: [FormatException, NullReferenceException]

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Фаза 1 — пошук (вгору, нічого не виконується)"
            children:
              - chain:
                  align: left
                  nodes:
                    - {title: "ParseAge", sub: ["`try…finally` — catch немає"]}
                    - {title: "SaveRecord", via: "вгору", sub: ["`catch (NullReferenceException)` — не той тип"]}
                    - {title: "ProcessAdmission", via: "вгору", kind: box_accent, sub: ["`catch (FormatException)` — [[знайдено]]"]}
              - text:
                  text: ["Фільтри `when` виконуються саме тут — до будь-якого `finally`."]
        - panel:
            heading: "Фаза 2 — розкрутка (вниз → вгору)"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["№", "що виводиться"]
                  groups:
                    - rows:
                        - ["1", "`finally` у ParseAge"]
                        - ["2", "`finally` у SaveRecord"]
                        - ["3", "`catch` у ProcessAdmission"]
                        - ["4", "`finally` у ProcessAdmission"]
                        - ["5", "«Після try у ProcessAdmission»"]
                    - heading: "не виконується"
                      rows:
                        - ["—", "код після `try` у SaveRecord і ParseAge"]
  - note:
      text: ["Якщо catch немає ніде — процес аварійно завершується; чи встигнуть `finally`, залежить від середовища (на .NET 10 консоль — виконались після повідомлення)."]

check:
  usings: [System]
  asserts: |
    var log = new System.Collections.Generic.List<string>();
    try { try { try { int.Parse("abc"); } finally { log.Add("1"); } } catch (NullReferenceException) { log.Add("x"); } finally { log.Add("2"); } }
    catch (FormatException) when (Note(log)) { log.Add("3"); } finally { log.Add("4"); }
    if (string.Join("", log) != "f1234") throw new Exception(string.Join("", log));
    static bool Note(System.Collections.Generic.List<string> l) { l.Insert(0, "f"); return true; }

publish:
  dark: ../lectures/_assets/05-06/call-stack-search.png
  bw: ../lectures/_assets/05-06/book/call-stack-search.png
