# Лекція 3.1 «Класи та об'єкти»
# Оригінал: lectures/_assets/03-01/Архив/stack-heap.png
id: stack-heap
title: "Стек зберігає посилання, купа — самі об'єкти"
subtitle: "Локальні змінні методу у стеку; new Patient() створює об'єкт у купі і повертає посилання на нього"

types: [Patient]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Стек (кадр методу)"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["змінна", "тип", "що зберігає"]
                  groups:
                    - rows:
                        - ["`patient1`", "`Patient`", "посилання → об'єкт 1"]
                        - ["`patient2`", "`Patient`", "посилання → об'єкт 2"]
                        - ["`count`",    "`int`",     "саме значення `2`"]
              - text:
                  text: ["Кадр зникає, коли метод завершується."]
        - panel:
            heading: "Купа"
            children:
              - box:
                  title: "об'єкт 1 : Patient"
                  check: skip
                  code: |
                    Name = "Олена Коваль"
                    Age  = 32
              - box:
                  title: "об'єкт 2 : Patient"
                  check: skip
                  code: |
                    Name = "Михайло Бондар"
                    Age  = 45
              - text:
                  text: ["Живе, доки на нього є посилання;", "потім пам'ять звільняє збирач сміття."]
  - note:
      text: ["Спрощення: «стек» — для локальних змінних. Поле-`int` об'єкта лежить у купі разом з об'єктом, а змінна, захоплена лямбдою, — теж у купі."]

publish:
  dark: ../lectures/_assets/03-01/stack-heap.png
  bw: ../lectures/_assets/03-01/book/stack-heap.png
