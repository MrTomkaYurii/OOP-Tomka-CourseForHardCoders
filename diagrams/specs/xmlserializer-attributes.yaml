# Лекція 19.5 «XmlSerializer»
# Оригінал: lectures/_assets/19-05/Архив/xmlserializer-attributes.png
id: xmlserializer-attributes
title: "XmlSerializer: атрибути задають форму XML"
subtitle: "Кожна публічна властивість з get і set стає елементом; атрибути-анотації перейменовують, роблять атрибутом чи прибирають"

types: [XmlSerializer, XmlRoot, XmlAttribute, XmlElement, XmlIgnore, XmlArray, XmlArrayItem, XmlText, Patient, Diagnosis, List, StringWriter, XmlSerializerNamespaces]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Класи"
            children:
              - box:
                  check: skip
                  code: |
                    [XmlRoot("patient")]
                    public class Patient
                    {
                        [XmlAttribute("id")]
                        public string Id { get; set; } = "";

                        [XmlElement("fullName")]
                        public string Name { get; set; } = "";

                        [XmlArray("diagnoses")]
                        [XmlArrayItem("diagnosis")]
                        public List<Diagnosis> Diagnoses { get; set; } = new();

                        [XmlIgnore]
                        public string InternalNote { get; set; } = "";
                    }

                    public class Diagnosis
                    {
                        [XmlAttribute("code")] public string Code { get; set; } = "";
                        [XmlText] public string Title { get; set; } = "";
                    }
        - stack:
            gap: 24
            children:
              - panel:
                  heading: "Результат Serialize"
                  children:
                    - box:
                        kind: box_accent
                        check: skip
                        code: |
                          <patient id="PT-1">
                            <fullName>Петренко</fullName>
                            <diagnoses>
                              <diagnosis code="I10">Гіпертонія</diagnosis>
                            </diagnoses>
                          </patient>
                        notes:
                          - "`InternalNote` відсутній; `xmlns:xsi`/`xsd` прибрано"
                          - "через `XmlSerializerNamespaces` з `ns.Add(\"\", \"\")`"
              - panel:
                  heading: "Вимоги"
                  children:
                    - kv:
                        check: skip
                        key_code: false
                        groups:
                          - rows:
                              - ["клас",             "[[`public`]] + конструктор без параметрів"]
                              - ["властивість",      "публічні `get` і `set`; без `set` — пропускається"]
                              - ["`List<T>` без атрибутів", "`<Diagnoses><Diagnosis>…`"]
                              - ["похідні типи",     "`[XmlInclude(typeof(…))]` на базовому"]
                              - ["`new XmlSerializer(typeof(T))`", "дорогий — кешуйте екземпляр"]

check:
  usings: [System, System.IO, System.Collections.Generic, System.Xml.Serialization]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var p = new Patient { Id = "PT-1", Name = "Петренко", InternalNote = "x", Diagnoses = { new Diagnosis { Code = "I10", Title = "Гіпертонія" } } };
    var ns = new XmlSerializerNamespaces(); ns.Add("", "");
    var sw = new StringWriter(); new XmlSerializer(typeof(Patient)).Serialize(sw, p, ns);
    string xml = sw.ToString().Replace("\r\n", "\n"); xml = xml.Substring(xml.IndexOf('\n') + 1);
    Eq(xml, "<patient id=\"PT-1\">\n  <fullName>Петренко</fullName>\n  <diagnoses>\n    <diagnosis code=\"I10\">Гіпертонія</diagnosis>\n  </diagnoses>\n</patient>");
    var back = (Patient)new XmlSerializer(typeof(Patient)).Deserialize(new StringReader(sw.ToString()))!; Eq(back.Diagnoses[0].Code, "I10"); Eq(back.InternalNote, "");
    var sw2 = new StringWriter(); new XmlSerializer(typeof(Plain)).Serialize(sw2, new Plain(), ns); Eq(sw2.ToString().Contains("<Diagnoses><Diagnosis") || sw2.ToString().Contains("<Diagnoses>\n    <Diagnosis") || sw2.ToString().Contains("<Diagnoses>\r\n    <Diagnosis"), true); Eq(sw2.ToString().Contains("ReadOnly"), false);
    try { new XmlSerializer(typeof(Hidden)); Eq(0, 1); } catch (InvalidOperationException) { }
  types: |
    [XmlRoot("patient")]
    public class Patient
    {
        [XmlAttribute("id")] public string Id { get; set; } = "";
        [XmlElement("fullName")] public string Name { get; set; } = "";
        [XmlArray("diagnoses")] [XmlArrayItem("diagnosis")] public List<Diagnosis> Diagnoses { get; set; } = new();
        [XmlIgnore] public string InternalNote { get; set; } = "";
    }
    public class Diagnosis { [XmlAttribute("code")] public string Code { get; set; } = ""; [XmlText] public string Title { get; set; } = ""; }
    public class Plain { public List<Diagnosis> Diagnoses { get; set; } = new() { new Diagnosis() }; public string ReadOnly => "r"; }
    class Hidden { }

publish:
  dark: ../lectures/_assets/19-05/xmlserializer-attributes.png
  bw: ../lectures/_assets/19-05/book/xmlserializer-attributes.png
