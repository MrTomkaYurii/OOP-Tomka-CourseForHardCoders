# Лекція 2.24 «Перерахування (enum)»
# Оригінал: lectures/_assets/02-24/Архив/enum-vs-string.png
id: enum-vs-string
title: "enum проти рядка: безпека типів"
subtitle: "Помилку в рядку знайде лише виконання; помилку в enum — компілятор (перевірено)"

types: [PatientStatus]

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "рядок / «магічне число»"
            check: skip
            code: |
              string status = "admited";      // описка
              if (status == "admitted") { … } // мовчки false

              int code = 2;
              if (code == 2) { … }            // що таке 2?
            notes: ["компілюється; помилка — лише під час виконання", "IDE не знає допустимих значень"]
        - box:
            title: "enum"
            kind: box_accent
            check: skip
            code: |
              PatientStatus s = PatientStatus.Admited;  // CS0117
              PatientStatus t = 2;                      // CS0266
              PatientStatus u = 0;                      // ✓ лише літерал 0

              if (s == PatientStatus.Admitted) { … }    // зміст видно
            notes: ["описка — помилка компіляції", "IDE підказує всі константи"]
  - panel:
      heading: "Хто знайде помилку"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["ситуація", "рядок / int", "enum"]
            groups:
              - rows:
                  - ["описка в назві",              "виконання (мовчки)",  "компілятор — [[CS0117]]"]
                  - ["присвоїти довільне число",     "компілюється",       "компілятор — [[CS0266]]"]
                  - ["явне приведення `(PatientStatus)99`", "—",           "компілюється — перевірка `Enum.IsDefined`"]
                  - ["перелік допустимих значень",  "лише в документації", "у типі; IDE підказує"]

check:
  usings: [System]
  types: |
    enum PatientStatus { Registered, Admitted, UnderTreatment, Discharged, Critical }

publish:
  dark: ../lectures/_assets/02-24/enum-vs-string.png
  bw: ../lectures/_assets/02-24/book/enum-vs-string.png
