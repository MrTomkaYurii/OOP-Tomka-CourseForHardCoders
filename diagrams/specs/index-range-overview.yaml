# Лекція 13.6 «Індекси та діапазони (Index та Range)»
# Оригінал: lectures/_assets/13-06/Архив/index-range-overview.png
id: index-range-overview
title: "Index і Range: індекс від кінця та діапазони"
subtitle: "^n — n-й елемент з кінця; a..b — від a включно до b виключно"

types: [Index, Range]

body:
  # ── 1. Наочно ───────────────────────────────────────────────────────────
  - panel:
      heading: "string[] wards — 8 палат"
      children:
        - cells:
            rows:
              - caption: "wards[2..5]"
                cells: [P1, P2, P3, P4, P5, P6, P7, P8]
                kinds: [box, box, box_accent, box_accent, box_accent, box, box, box]
                top: ["0", "1", "2", "3", "4", "5", "6", "7"]
                note: "індекси 2, 3, 4 — кінець 5 не входить"
              - caption: "wards[^3..^1]"
                cells: [P1, P2, P3, P4, P5, P6, P7, P8]
                kinds: [box, box, box, box, box, box_accent, box_accent, box]
                bottom: ["^8", "^7", "^6", "^5", "^4", "^3", "^2", "^1"]
                note: "^0 — позиція за останнім = Length"

  - row:
      gap: 24
      children:
        # ── 2. Index ──────────────────────────────────────────────────────
        - panel:
            heading: "Index — оператор ^"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  groups:
                    - heading: "вираз → результат"
                      rows:
                        - ["wards[^1]",          "`\"P8\"` — останній"]
                        - ["wards[^2]",          "`\"P7\"` — передостанній"]
                        - ["wards[wards.Length - 1]", "`\"P8\"` — те саме до C# 8"]
                    - heading: "тип Index"
                      check: skip
                      rows:
                        - ["Index last = ^1;", "індекс можна зберегти"]
                        - ["last.IsFromEnd",   "`true` — рахується з кінця"]
                        - ["last.GetOffset(8)", "`7` — звичайний індекс"]
              - note:
                  kind: box_accent
                  text:
                    - "`wards[^0]` → `IndexOutOfRangeException`:"
                    - "`^0` вказує за межу масиву"

        # ── 3. Range ──────────────────────────────────────────────────────
        - panel:
            heading: "Range — оператор .."
            children:
              - kv:
                  check: "Seq({}, \"{v}\");"
                  groups:
                    - heading: "вираз → елементи"
                      rows:
                        - ["wards[2..5]",   "`P3, P4, P5`"]
                        - ["wards[..3]",    "`P1, P2, P3` — перші 3"]
                        - ["wards[^3..]",   "`P6, P7, P8` — останні 3"]
                        - ["wards[1..^1]",  "`P2 … P7` — без крайніх"]
                    - heading: "тип Range"
                      check: skip
                      rows:
                        - ["Range mid = 1..^1;",          "діапазон можна зберегти"]
                        - ["mid.GetOffsetAndLength(8)",   "`(1, 6)` — початок і довжина"]

        # ── 4. Хто підтримує ──────────────────────────────────────────────
        - panel:
            heading: "Де працює"
            children:
              - kv:
                  key_code: false
                  columns: ["тип", "^1", "a..b повертає"]
                  groups:
                    - rows:
                        - ["`T[]`",              "так", "новий масив (копія)"]
                        - ["`string`",           "так", "новий рядок (копія)"]
                        - ["`Span<T>`",          "так", "зріз [[без копії]]"]
                        - ["`List<T>`",          "так", "новий `List<T>` (.NET 8+)"]
                        - ["`IList<T>`",         "так", "не підтримує"]
              - note:
                  text:
                    - "зріз масиву — копія: зміни в ньому"
                    - "не впливають на оригінал; потрібно"
                    - "без копії — `wards.AsSpan()[2..5]`"

check:
  usings: [System, System.Collections.Generic]
  context: |
    string[] wards = ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8"];
    void Eq(object a, object b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    void Seq(string[] a, string expected)
    {
        string exp = expected.Replace(" ", "");
        if (exp.Contains('…')) { string[] p = exp.Split('…'); exp = p[0].TrimEnd(',') + ",P3,P4,P5,P6," + p[1].TrimStart(','); }
        if (string.Join(",", a) != exp) throw new Exception($"Схема бреше: {string.Join(",", a)} != {exp}");
    }
  asserts: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    Index last = ^1;
    Assert(last.IsFromEnd && last.GetOffset(8) == 7, "Index");
    Range mid = 1..^1;
    Assert(mid.GetOffsetAndLength(8) == (1, 6), "GetOffsetAndLength");
    try { _ = wards[^0]; Assert(false, "^0"); } catch (IndexOutOfRangeException) { }
    var copy = wards[2..5]; copy[0] = "X"; Assert(wards[2] == "P3", "масив — копія");
    var sp = wards.AsSpan()[2..5]; sp[0] = "X"; Assert(wards[2] == "X", "Span — без копії");
    var list = new List<int> { 1, 2, 3, 4 }; var ls = list[1..3]; ls[0] = 9; Assert(list[1] == 2 && list[^1] == 4, "List: копія, ^1");
    IList<int> il = list; Assert(il[^1] == 4, "IList ^1");
    Assert("Петренко"[2..5] == "тре", "string");

publish:
  dark: ../lectures/_assets/13-06/index-range-overview.png
  bw: ../lectures/_assets/13-06/book/index-range-overview.png
