# Лекція 9.3 «Патерни кортежів»
# Оригінал: lectures/_assets/09-03/Архив/tuple-pattern-matrix.png
id: tuple-pattern-matrix
title: "Патерн кортежів: рішення за двома вимірами"
subtitle: "(specialty, shift) switch — arm-и перевіряються згори вниз, перший збіг виграє"

types: []

body:
  - stack:
      gap: 24
      children:
        - box:
            title: "Arm-и з лекції"
            kind: box_accent
            check: skip
            code: |
              (specialty, shift) switch
              {
                  ("Кардіологія", "День") => "Плановий прийом + ЕКГ",
                  ("Кардіологія", "Ніч")  => "Термінова допомога — чергово",
                  ("Хірургія",    "День") => "Операційний зал — за розкладом",
                  ("Хірургія",    "Ніч")  => "Ургентна хірургія",
                  ("Неврологія",  [[_]])    => "Неврологічний огляд",
                  ([[_]],             "День") => "Денний прийом (стандарт)",
                  [[_]]                       => "Позаплановий прийом"
              }
            notes: ["`_` у позиції — будь-яке значення; `_` замість кортежу — будь-яка пара"]
        - panel:
            heading: "Що повертає"
            children:
              - kv:
                  check: "Eq(Protocol{}, {v});"
                  columns: ["(specialty, shift)", "arm"]
                  groups:
                    - rows:
                        - ["(\"Кардіологія\", \"Ніч\")",       "`\"Термінова допомога — чергово\"`"]
                        - ["(\"Неврологія\", \"Позапланова\")", "`\"Неврологічний огляд\"`"]
                        - ["(\"Педіатрія\", \"День\")",         "`\"Денний прийом (стандарт)\"`"]
                        - ["(\"Педіатрія\", \"Ніч\")",          "`\"Позаплановий прийом\"`"]
              - text:
                  text:
                    - "Компілятор [[не створює]] `ValueTuple`: елементи порівнюються напряму (перевірено в IL)."
                    - "Без останнього `_` — попередження CS8509, а в runtime — `SwitchExpressionException`."

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    string Protocol(string specialty, string shift) => (specialty, shift) switch
    {
        ("Кардіологія", "День") => "Плановий прийом + ЕКГ",
        ("Кардіологія", "Ніч")  => "Термінова допомога — чергово",
        ("Хірургія",    "День") => "Операційний зал — за розкладом",
        ("Хірургія",    "Ніч")  => "Ургентна хірургія",
        ("Неврологія",  _)      => "Неврологічний огляд",
        (_,             "День") => "Денний прийом (стандарт)",
        _                       => "Позаплановий прийом"
    };

publish:
  dark: ../lectures/_assets/09-03/tuple-pattern-matrix.png
  bw: ../lectures/_assets/09-03/book/tuple-pattern-matrix.png
