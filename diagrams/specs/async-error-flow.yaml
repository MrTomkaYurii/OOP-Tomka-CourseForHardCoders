# Лекція 17.4 «Обробка помилок в async-методах»
# Оригінал: lectures/_assets/17-04/Архив/async-error-flow.png
id: async-error-flow
title: "Куди потрапляє виняток з async-методу"
subtitle: "У async Task виняток зберігається в задачі й вилітає в точці await; в async void його нікуди покласти"

types: [Task, AggregateException, SynchronizationContext, TaskScheduler, UnobservedTaskExceptionEventArgs]

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "async Task — виняток чекає на await"
            children:
              - chain:
                  align: left
                  nodes:
                    - { title: "1 · throw", lines: "throw new InvalidOperationException(\"ЛІС недоступна\");", lines_check: skip }
                    - { title: "2 · задача Faulted", sub: ["виняток лежить у `task.Exception`"], via: "зберігається" }
                    - { title: "3 · await task", kind: box_accent, sub: ["кидає [[сам виняток]], не `AggregateException`;", "`try/catch` навколо `await` його ловить"], via: "await" }
        - panel:
            heading: "async void — задачі немає"
            children:
              - chain:
                  align: left
                  nodes:
                    - { title: "1 · throw", lines: "throw new InvalidOperationException(\"ЛІС недоступна\");", lines_check: skip }
                    - { title: "2 · SynchronizationContext", sub: ["того потоку, де метод стартував"], via: "кидається в" }
                    - { title: "3 · наслідок", kind: box_muted, sub: ["UI: глобальний обробник програми;", "консоль, ASP.NET Core: [[процес падає]]"], via: "далі" }

  - panel:
      heading: "Інші правила"
      children:
        - kv:
            check: skip
            key_code: false
            groups:
              - rows:
                  - ["задача без `await`",                  "виняток «мовчить»; згодом — подія `TaskScheduler.UnobservedTaskException` (процес не падає з .NET 4.5)"]
                  - ["`await Task.WhenAll(…)`",              "перший виняток; усі — у `whenAll.Exception.InnerExceptions`"]
                  - ["`.Result` / `.Wait()`",               "`AggregateException`; у WPF / WinForms — [[дедлок]] на UI-потоці"]
                  - ["`await` у `catch` і `finally`",       "дозволено з C# 6 — асинхронне логування й очищення"]
                  - ["`ConfigureAwait(false)`",             "у бібліотеці: продовження не повертається в контекст UI"]

check:
  usings: [System, System.Threading.Tasks]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    async Task Fail() { await Task.Delay(10); throw new InvalidOperationException("ЛІС недоступна"); }
    var t = Fail();
    try { await t; Eq(0, 1); } catch (InvalidOperationException e) { Eq(e.Message, "ЛІС недоступна"); }
    Eq(t.IsFaulted, true); Eq(t.Exception is AggregateException, true);
    try { t.Wait(); } catch (AggregateException) { }
    try { try { await Fail(); } catch { await Task.Delay(1); throw; } } catch (InvalidOperationException) { } finally { await Task.Delay(1); }

publish:
  dark: ../lectures/_assets/17-04/async-error-flow.png
  bw: ../lectures/_assets/17-04/book/async-error-flow.png
