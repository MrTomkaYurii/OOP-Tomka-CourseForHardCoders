# Лекція 2.24 «Перерахування (enum)»
# Оригінал: lectures/_assets/02-24/Архив/enum-structure.png
id: enum-structure
title: "Структура enum"
subtitle: "Іменовані константи поверх цілого типу (int за замовчуванням); значення — з 0, кожне наступне +1"

types: [PatientStatus, BloodType]

body:
  - row:
      gap: 24
      children:
        - box:
            title: "Оголошення"
            kind: box_accent
            check: skip
            code: |
              enum PatientStatus     // : int
              {
                  Registered,        // 0
                  Admitted,          // 1
                  UnderTreatment,    // 2
                  Discharged,        // 3
                  Critical           // 4
              }

              enum BloodType : byte  // інший базовий тип
              { O_Positive, O_Negative, A_Positive /* … */ }
        - panel:
            heading: "Перетворення (виконано)"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["(int)PatientStatus.Admitted",            "`1`"]
                        - ["PatientStatus.Critical.ToString()",      "`\"Critical\"`"]
                        - ["((PatientStatus)2).ToString()",          "`\"UnderTreatment\"`"]
                        - ["((PatientStatus)99).ToString()",         "`\"99\"`"]
                        - ["Enum.IsDefined((PatientStatus)99)",      "`false`"]
                        - ["(byte)BloodType.A_Positive",             "`(byte)2`"]
              - note:
                  text:
                    - "`(PatientStatus)99` — без винятку: значення без імені."
                    - "Дані ззовні перевіряйте через `Enum.IsDefined`."

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  types: |
    enum PatientStatus { Registered, Admitted, UnderTreatment, Discharged, Critical }
    enum BloodType : byte { O_Positive, O_Negative, A_Positive, A_Negative, B_Positive, B_Negative, AB_Positive, AB_Negative }

publish:
  dark: ../lectures/_assets/02-24/enum-structure.png
  bw: ../lectures/_assets/02-24/book/enum-structure.png
