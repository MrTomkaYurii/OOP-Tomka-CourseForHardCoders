# Лекція 18.6 «System.Text.Json»
# Оригінал: lectures/_assets/18-06/Архив/json-attributes.png
id: json-attributes
title: "Атрибути System.Text.Json"
subtitle: "Атрибут налаштовує одну властивість; JsonSerializerOptions — усю серіалізацію"

types: [JsonSerializer, JsonPropertyName, JsonIgnore, JsonInclude, JsonPropertyOrder, JsonRequired, JsonConverter, JsonExtensionData, JsonStringEnumConverter, JsonIgnoreCondition, JsonElement, JsonException, LabResult, Dictionary]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Клас"
            children:
              - box:
                  check: skip
                  code: |
                    public class LabResult
                    {
                        [JsonPropertyName("patient_id")]
                        [JsonPropertyOrder(-1)]
                        public int PatientId { get; set; }

                        [JsonRequired]
                        public string Test { get; set; } = "";

                        [JsonIgnore(Condition =
                            JsonIgnoreCondition.WhenWritingNull)]
                        public double? Value { get; set; }

                        [JsonIgnore]
                        public string InternalNotes { get; set; } = "";

                        [JsonInclude]
                        public string Lab = "Central";

                        [JsonExtensionData]
                        public Dictionary<string, JsonElement>? Extra { get; set; }
                    }
        - panel:
            heading: "Результат Serialize"
            children:
              - box:
                  kind: box_accent
                  check: skip
                  code: |
                    {"patient_id":1001,"Test":"HbA1c","Lab":"Central"}
                  notes:
                    - "для `new LabResult { PatientId = 1001, Test = \"HbA1c\" }`:"
                    - "`Value` = `null` — пропущено; `InternalNotes` — ніколи"
              - kv:
                  check: skip
                  key_code: false
                  columns: ["атрибут", "дія"]
                  groups:
                    - rows:
                        - ["`[JsonPropertyName]`",  "інше імʼя в JSON"]
                        - ["`[JsonPropertyOrder]`", "порядок; менше — раніше"]
                        - ["`[JsonIgnore]`",        "ніколи; з `Condition` — умовно"]
                        - ["`[JsonInclude]`",       "поле або `private set` — у JSON"]
                        - ["`[JsonRequired]`",      "немає в JSON → [[`JsonException`]]"]
                        - ["`[JsonExtensionData]`", "невідомі поля — у словник"]
                        - ["`[JsonConverter(…)]`",  "свій формат типу (19.1)"]
              - note:
                  text:
                    - "Атрибут [[сильніший]] за `PropertyNamingPolicy`:"
                    - "`patient_id` лишиться і при `CamelCase`"

check:
  usings: [System, System.Collections.Generic, System.Text.Json, System.Text.Json.Serialization]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var r = new LabResult { PatientId = 1001, Test = "HbA1c", InternalNotes = "x" };
    Eq(JsonSerializer.Serialize(r), """{"patient_id":1001,"Test":"HbA1c","Lab":"Central"}""");
    var cc = new JsonSerializerOptions { PropertyNamingPolicy = JsonNamingPolicy.CamelCase };
    Eq(JsonSerializer.Serialize(r, cc), """{"patient_id":1001,"test":"HbA1c","lab":"Central"}""");
    try { JsonSerializer.Deserialize<LabResult>("""{"patient_id":1}"""); Eq(0, 1); } catch (JsonException) { }
    var d = JsonSerializer.Deserialize<LabResult>("""{"Test":"A","Unit":"%"}""")!; Eq(d.Extra!["Unit"].GetString(), "%");
  types: |
    public class LabResult
    {
        [JsonPropertyName("patient_id")] [JsonPropertyOrder(-1)] public int PatientId { get; set; }
        [JsonRequired] public string Test { get; set; } = "";
        [JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingNull)] public double? Value { get; set; }
        [JsonIgnore] public string InternalNotes { get; set; } = "";
        [JsonInclude] public string Lab = "Central";
        [JsonExtensionData] public Dictionary<string, JsonElement>? Extra { get; set; }
    }

publish:
  dark: ../lectures/_assets/18-06/json-attributes.png
  bw: ../lectures/_assets/18-06/book/json-attributes.png
