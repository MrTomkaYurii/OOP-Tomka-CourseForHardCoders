# Лекція 5.4 «Генерація винятку та оператор throw»
# Оригінал: lectures/_assets/05-04/Архив/throw-forms.png
id: throw-forms
title: "Оператор throw: створити, перекинути, загорнути"
subtitle: "throw; зберігає оригінальний стек, throw ex; — переписує його; InnerException зберігає причину"

types: [ArgumentException, ArgumentOutOfRangeException, ArgumentNullException, FormatException, InvalidOperationException, Exception]

body:
  - row:
      gap: 16
      equal: true
      children:
        - box:
            title: "throw new — новий виняток"
            check: skip
            code: |
              if (age < 0 || age > 150)
                  throw new ArgumentOutOfRangeException(
                      nameof(age), $"Вік {age} …");
            notes: ["будь-де; з C# 7 — і як вираз:", "`x ?? throw new …`"]
        - box:
            title: "throw; — перекинути той самий"
            kind: box_accent
            check: skip
            code: |
              catch (FormatException ex)
              {
                  Log(ex);
                  throw;
              }
            notes: ["лише всередині `catch` (інакше CS0156)"]
        - box:
            title: "загорнути з причиною"
            check: skip
            code: |
              catch (FormatException ex)
              {
                  throw new InvalidOperationException(
                      $"Некоректний вік: «{raw}»", ex);
              }
            notes: ["`ex` стає `InnerException`"]
  - panel:
      heading: "Що бачить зовнішній catch (виконано)"
      children:
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "результат"]
            groups:
              - rows:
                  - ["Rethrow.Plain().Contains(\"Inner\")",       "`true`"]
                  - ["Rethrow.WithEx().Contains(\"Inner\")",      "`false`"]
                  - ["Rethrow.Wrapped().InnerException is FormatException", "`true`"]
        - text:
            text: ["`throw;` — у стеку лишається метод, де виняток виник;", "`throw ex;` — стек [[починається]] з місця перекидання."]

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  types: |
    static class Rethrow
    {
        [System.Runtime.CompilerServices.MethodImpl(System.Runtime.CompilerServices.MethodImplOptions.NoInlining)]
        static void Inner() => int.Parse("abc");
        public static string Plain() { try { try { Inner(); } catch (FormatException) { throw; } } catch (Exception e) { return e.StackTrace ?? ""; } return ""; }
        public static string WithEx() { try { try { Inner(); } catch (FormatException ex) { throw ex; } } catch (Exception e) { return e.StackTrace ?? ""; } return ""; }
        public static Exception Wrapped() { try { try { Inner(); } catch (FormatException ex) { throw new InvalidOperationException("wrap", ex); } } catch (Exception e) { return e; } return new Exception(); }
    }

publish:
  dark: ../lectures/_assets/05-04/throw-forms.png
  bw: ../lectures/_assets/05-04/book/throw-forms.png
