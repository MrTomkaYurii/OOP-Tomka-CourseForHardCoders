# Лекція 2.11 «Умовні вирази»
# Оригінал: lectures/_assets/02-11/Архив/conditional-ops.png
id: conditional-ops
title: "Оператори порівняння та логічні оператори"
subtitle: "Усі повертають bool; && і || не обчислюють правий операнд, якщо результат уже відомий"

types: []

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Порівняння (age = 45)"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["age == 18",  "`false`"]
                        - ["age != 0",   "`true`"]
                        - ["age < 60",   "`true`"]
                        - ["age >= 18",  "`true`"]
                        - ["age <= 110", "`true`"]
        - panel:
            heading: "Логічні"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["оператор", "true коли", "правий операнд"]
                  groups:
                    - rows:
                        - ["`a && b`", "обидва `true`", "[[пропущено]], якщо `a` — `false`"]
                        - ["`a || b`", "хоч один `true`", "[[пропущено]], якщо `a` — `true`"]
                        - ["`a & b`",  "обидва `true`", "обчислюється завжди"]
                        - ["`a | b`",  "хоч один `true`", "обчислюється завжди"]
                        - ["`a ^ b`",  "операнди різні", "обчислюється завжди"]
                        - ["`!a`",     "`a` — `false`", "—"]
  - note:
      text:
        - "Пріоритет: `!` → `< > <= >=` → `== !=` → `&` → `^` → `|` → `&&` → `||`."
        - "Скорочене обчислення дозволяє безпечно писати `p != null && p.Age > 18`."

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    int age = 45;
  asserts: |
    int calls = 0; bool T() { calls++; return true; }
    _ = false && T(); _ = true || T(); if (calls != 0) throw new Exception("short");
    _ = false & T(); _ = true | T(); if (calls != 2) throw new Exception("full");

publish:
  dark: ../lectures/_assets/02-11/conditional-ops.png
  bw: ../lectures/_assets/02-11/book/conditional-ops.png
