# Лекція 4.9 «Обмеження узагальнень»
# Оригінал: lectures/_assets/04-09/Архив/constraints-overview.png
id: constraints-overview
title: "Обмеження узагальнень: where T : …"
subtitle: "Обмеження дає компілятору знання про T — і дозволяє звертатися до його членів"

types: [Notification, Patient]

body:
  - panel:
      heading: "Види обмежень"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["обмеження", "T має бути", "дозволяє"]
            groups:
              - rows:
                  - ["`where T : Notification`", "цей клас або похідний",      "`message.Text`"]
                  - ["`where T : IComparable<T>`", "реалізувати інтерфейс",    "`a.CompareTo(b)`"]
                  - ["`where T : class`",        "посилальним типом",          "`T? x = null`, `as`"]
                  - ["`where T : struct`",       "значимим, не `Nullable<>`",  "`T?` = `Nullable<T>`"]
                  - ["`where T : notnull`",      "не-nullable (C# 8)",         "попередження компілятора"]
                  - ["`where T : unmanaged`",    "структурою без посилань (C# 7.3)", "`sizeof(T)`, `T*`"]
                  - ["`where T : new()`",        "з публічним конструктором без параметрів", "`new T()`"]
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "Порядок у списку"
            check: skip
            code: |
              where T : Patient,        // ① клас / class / struct
                        IComparable<T>, // ② інтерфейси
                        new()           // ③ завжди останнє
        - panel:
            heading: "Помилки (перевірено)"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`struct, new()`", "CS0451 — `new()` зайве"]
                        - ["`new(), class`", "CS0401 — `new()` не останнє"]
                        - ["`message.Text` без обмеження", "CS1061"]

publish:
  dark: ../lectures/_assets/04-09/constraints-overview.png
  bw: ../lectures/_assets/04-09/book/constraints-overview.png
