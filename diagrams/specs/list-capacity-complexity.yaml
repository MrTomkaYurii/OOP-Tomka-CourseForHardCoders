# Лекція 10.1 «Список List<T>»
# Оригінал: lectures/_assets/10-01/Архив/list-capacity-complexity.png
id: list-capacity-complexity
title: "List<T>: динамічний масив — Count і Capacity"
subtitle: "Усередині — звичайний масив T[]; коли він заповнений, Add створює вдвічі більший і копіює елементи"

types: [List, Patient]

body:
  # ── 1. Розширення буфера ──────────────────────────────────────────────────
  - panel:
      heading: "Що відбувається при Add"
      children:
        - cells:
            rows:
              - caption: "Count 3, Capacity 4"
                cells: [P1, P2, P3, "·"]
                kinds: [box_accent, box_accent, box_accent, box_muted]
                top: ["0", "1", "2", "3"]
                note: "є вільний слот — Add(P4) просто записує, O(1)"
              - caption: "Count 4, Capacity 4"
                cells: [P1, P2, P3, P4]
                kinds: [box_accent, box_accent, box_accent, box_accent]
                note: "буфер повний — наступний Add розширює масив"
              - caption: "Add(P5) → Capacity 8"
                cells: [P1, P2, P3, P4, P5, "·", "·", "·"]
                kinds: [box_accent, box_accent, box_accent, box_accent, box_accent, box_muted, box_muted, box_muted]
                top: ["0", "1", "2", "3", "4", "5", "6", "7"]
                note: "новий масив ×2, копія 4 елементів — O(n)"
        - text:
            text:
              - "Перевиділень за n додавань — лише log₂(n), тому Add у середньому [[амортизовано O(1)]]; старий масив забирає GC."

  - row:
      gap: 24
      children:
        # ── 2. Складність ─────────────────────────────────────────────────
        - panel:
            heading: "Складність операцій"
            children:
              - kv:
                  check: skip
                  columns: ["операція", "складність", "чому"]
                  groups:
                    - rows:
                        - ["list[i]",          "O(1)",       "прямий доступ до масиву"]
                        - ["Add(item)",        "[[O(1)*]]",  "* амортизовано; при розширенні O(n)"]
                        - ["Insert(i, item)",  "O(n)",       "зсув елементів праворуч від i"]
                        - ["RemoveAt(i)",      "O(n)",       "зсув елементів ліворуч"]
                        - ["Remove(item)",     "O(n)",       "лінійний пошук + зсув"]
                        - ["Contains(item)",   "O(n)",       "лінійний пошук"]
                        - ["BinarySearch(item)", "O(log n)", "лише у відсортованому списку"]
                        - ["Sort()",           "O(n log n)", "IntroSort, [[нестабільне]]"]

        # ── 3. Ємність ────────────────────────────────────────────────────
        - panel:
            heading: "Керування ємністю"
            children:
              - kv:
                  check: skip
                  columns: ["код", "Capacity"]
                  groups:
                    - rows:
                        - ["new List<Patient>()",    "`0` — масиву ще немає"]
                        - ["перший Add",             "`4`"]
                        - ["далі при заповненні",    "`8` → `16` → `32` …"]
                        - ["new List<Patient>(500)", "`500` — одразу, Count = `0`"]
                        - ["list.TrimExcess()",      "≈ Count — віддати зайве"]
              - note:
                  kind: box_accent
                  text:
                    - "Знаєте кількість наперед — задайте її"
                    - "в конструкторі: жодного перевиділення"

check:
  usings: [System, System.Collections.Generic]
  context: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
  asserts: |
    var l = new List<string>(); Assert(l.Capacity == 0, "порожній — 0");
    l.Add("P1"); Assert(l.Capacity == 4, "перший Add — 4");
    l.Add("P2"); l.Add("P3"); l.Add("P4"); Assert(l.Count == 4 && l.Capacity == 4, "4/4");
    l.Add("P5"); Assert(l.Capacity == 8, "×2");
    for (int i = 0; i < 4; i++) l.Add("x"); Assert(l.Capacity == 16, "16");
    var b = new List<string>(500); Assert(b.Capacity == 500 && b.Count == 0, "500");
    l.TrimExcess(); Assert(l.Capacity == l.Count, "TrimExcess");
    var keys = new List<(int k, int i)>(); for (int i = 0; i < 40; i++) keys.Add((i % 2, i));
    keys.Sort((a, c) => a.k.CompareTo(c.k));
    bool stable = true; for (int i = 1; i < keys.Count; i++) if (keys[i].k == keys[i-1].k && keys[i].i < keys[i-1].i) stable = false;
    Assert(!stable, "Sort нестабільний");

publish:
  dark: ../lectures/_assets/10-01/list-capacity-complexity.png
  bw: ../lectures/_assets/10-01/book/list-capacity-complexity.png
