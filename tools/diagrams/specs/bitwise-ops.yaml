# Лекція 2.7 «Порозрядні операції»
# Оригінал: lectures/_assets/02-07/Архив/bitwise-ops.png
id: bitwise-ops
title: "Порозрядні операції"
subtitle: "Діють на кожен біт окремо; приклади з лекції — 4 (0100) і 5 (0101), результати виконано"

types: []

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Логічні над бітами"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат", "біти"]
                  groups:
                    - rows:
                        - ["4 & 5",  "`4`",   "0100 & 0101 = 0100"]
                        - ["4 | 5",  "`5`",   "0100 | 0101 = 0101"]
                        - ["4 ^ 5",  "`1`",   "0100 ^ 0101 = 0001"]
                        - ["~12",    "`-13`", "інверсія всіх 32 бітів"]
                        - ["(45 ^ 102) ^ 102", "`45`", "XOR двічі — оригінал"]
        - panel:
            heading: "Зсуви"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат", "суть"]
                  groups:
                    - rows:
                        - ["3 << 2",      "`12`", "× 2²"]
                        - ["22 >> 2",     "`5`",  "÷ 2², дріб відкинуто"]
                        - ["-16 >> 2",    "`-4`", "зліва — копія знака"]
                        - ["-16 >>> 28",  "`15`", "C# 11: зліва нулі"]
  - note:
      text:
        - "Для `int` зсув береться за модулем 32: `1 << 33` дорівнює `2`."
        - "Для `bool` `&`, `|`, `^` — логічні операції без скороченого обчислення."

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    int s = 33; if ((1 << s) != 2) throw new Exception("mod32");

publish:
  dark: ../../lectures/_assets/02-07/bitwise-ops.png
  bw: ../../lectures/_assets/02-07/book/bitwise-ops.png
