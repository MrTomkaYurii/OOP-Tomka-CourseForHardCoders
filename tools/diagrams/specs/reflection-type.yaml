# Лекція 14.1 «Введення у рефлексію. Клас System.Type»
# Оригінал: lectures/_assets/14-01/Архив/reflection-type.png (PIL, 960×540)
id: reflection-type
title: "Рефлексія: метадані CLR і клас System.Type"
subtitle: "Компілятор зберігає у збірці опис усіх типів — рефлексія читає його під час виконання"

types: [PatientRecord]     # додаткові імена, які підсвічуються як типи

body:
  - row:
      gap: 24
      children:
        # ── 1. Модель метаданих ───────────────────────────────────────────
        - panel:
            heading: "Модель метаданих CLR"
            children:
              - chain:
                  nodes:
                    - title: "Assembly"
                      code: true
                      sub: "збірка .dll / .exe: метадані + IL"
                    - title: "Module"
                      code: true
                      sub: "модуль; зазвичай один на збірку"
                      via: "GetModules()"
                      check: "_ = asm.{};"
                    - title: "Type"
                      code: true
                      kind: box_accent
                      sub: "клас · struct · інтерфейс · enum · делегат"
                      via: "GetTypes()"
                      check: "_ = mod.{};"
              - flow:
                  caption: "члени типу (`t` — об'єкт `Type`):"
                  check: "_ = {};"
                  rows:
                    - { left: "t.GetMethods()",      right: "MethodInfo[]" }
                    - { left: "t.GetConstructors()", right: "ConstructorInfo[]" }
                    - { left: "t.GetFields()",       right: "FieldInfo[]" }
                    - { left: "t.GetProperties()",   right: "PropertyInfo[]" }
                    - { left: "t.GetEvents()",       right: "EventInfo[]" }
              - note:
                  text:
                    - "`MethodInfo`, `FieldInfo`, … і сам `Type` —"
                    - "нащадки абстрактного класу `MemberInfo`"

        # ── 2. Три способи ────────────────────────────────────────────────
        - panel:
            heading: "Три способи отримати Type"
            children:
              - box:
                  title: "1 · `typeof(T)`"
                  tag: "компіляція"
                  code: |
                    Type t1 = typeof(PatientRecord);
                  notes:
                    - "ім'я типу перевіряє компілятор —"
                    - "помилку видно ще до запуску"
              - box:
                  title: "2 · `obj.GetType()`"
                  tag: "виконання"
                  code: |
                    object obj = new PatientRecord();
                    Type t2 = obj.GetType(); // PatientRecord
                  notes:
                    - "фактичний тип об'єкта, а не тип змінної;"
                    - "для `null` — `NullReferenceException`"
              - box:
                  title: "3 · `Type.GetType(name)`"
                  tag: "виконання"
                  code: |
                    Type? t3 = Type.GetType("Med.PatientRecord");
                    // null, якщо тип не знайдено
                  notes:
                    - "потрібне повне ім'я з простором імен;"
                    - "з іншої збірки: `\"Med.PatientRecord, MedLib\"`"
              - note:
                  text:
                    - "`t1 == t2 && t2 == t3` → `true`: для кожного"
                    - "типу CLR тримає єдиний об'єкт `Type`"
              - box:
                  kind: box_muted
                  title: "Ціна гнучкості"
                  notes:
                    - "`MethodInfo.Invoke` у 10–100 разів повільніший"
                    - "за прямий виклик: рефлексію — при старті,"
                    - "результати — кешувати, не в гарячому циклі"

        # ── 3. Властивості ────────────────────────────────────────────────
        - panel:
            heading: "Властивості Type"
            children:
              - kv:
                  check: "_ = {};"
                  groups:
                    - heading: "ідентифікація"
                      rows:
                        - ["t.Name",      "`\"PatientRecord\"`"]
                        - ["t.FullName",  "`\"Med.PatientRecord\"`"]
                        - ["t.Namespace", "`\"Med\"`"]
                        - ["t.Assembly",  "збірка, де оголошено тип"]
                        - ["t.BaseType",  "базовий тип або `null`"]
                    - heading: "класифікація: `true`, якщо тип —"
                      rows:
                        - ["t.IsClass",       "клас (зокрема делегат)"]
                        - ["t.IsValueType",   "`struct` або `enum`"]
                        - ["t.IsInterface",   "інтерфейс"]
                        - ["t.IsAbstract",    "абстрактний клас або інтерфейс"]
                        - ["t.IsSealed",      "`sealed` (зокрема `struct`)"]
                        - ["t.IsGenericType", "`List<int>`, `Dictionary<K,V>`…"]
                        - ["t.IsArray",       "масив, напр. `int[]`"]
                        - ["t.IsEnum",        "`enum`"]
                        - ["t.IsPublic",      "`public` верхнього рівня"]

  # ── 4. Застосування ─────────────────────────────────────────────────────
  - panel:
      heading: "Де рефлексія працює «під капотом»"
      children:
        - row:
            gap: 16
            equal: true
            children:
              - box: { title: "DI-контейнери",      text: ["аналізують конструктори,", "підставляють залежності"] }
              - box: { title: "ORM (EF Core)",      text: ["зіставляють властивості", "з колонками таблиць"] }
              - box: { title: "Серіалізація",       text: ["`System.Text.Json` читає", "і записує властивості"] }
              - box: { title: "Тестові фреймворки", text: ["знаходять методи з `[Fact]`", "і викликають їх"] }
              - box: { title: "Плагіни",            text: ["шукають у збірках типи", "з потрібним інтерфейсом"] }

# ── Перевірка: увесь код зі схеми компілюється і робить те, що написано ──
check:
  usings: [System, System.Reflection, Med]
  context: |
    Type t = typeof(Med.PatientRecord);
    Assembly asm = t.Assembly;
    Module mod = t.Module;
  asserts: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    Assert(t1 == t2 && t2 == t3, "t1 == t2 == t3");
    Assert(t.Name == "PatientRecord" && t.FullName == "Med.PatientRecord" && t.Namespace == "Med", "Name/FullName/Namespace");
    Assert(Type.GetType("Med.Nope") is null, "Type.GetType повертає null");
    Assert(asm.GetModules().Length == 1, "один модуль на збірку");
    foreach (Type m in new[] { typeof(MethodInfo), typeof(ConstructorInfo), typeof(FieldInfo), typeof(PropertyInfo), typeof(EventInfo), typeof(Type) })
        Assert(typeof(MemberInfo).IsAssignableFrom(m) && typeof(MemberInfo).IsAbstract, m.Name + " : MemberInfo");
    Assert(typeof(Action).IsClass && typeof(DayOfWeek).IsValueType && typeof(IDisposable).IsAbstract, "IsClass/IsValueType/IsAbstract");
    Assert(typeof(System.Collections.Generic.List<int>).IsGenericType && typeof(int[]).IsArray, "IsGenericType/IsArray");
    Assert(typeof(DayOfWeek).IsSealed && typeof(Med.PatientRecord).IsPublic, "IsSealed/IsPublic");
    Assert(typeof(object).BaseType is null, "BaseType object == null");
    try { object? none = null; none!.GetType(); Assert(false, "GetType на null"); } catch (NullReferenceException) { }
  types: |
    namespace Med { public class PatientRecord { } }

