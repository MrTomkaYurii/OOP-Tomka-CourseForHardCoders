# Лекція 8.8 «Анонімні типи»
# Оригінал: lectures/_assets/08-08/Архив/anonymous-type-generated.png
id: anonymous-type-generated
title: "Анонімний тип: що генерує компілятор"
subtitle: "internal sealed generic-клас з недоступним іменем, readonly-властивостями і структурною рівністю Equals"

types: []

body:
  - row:
      gap: 24
      children:
        - box:
            title: "Код програміста"
            kind: box_accent
            check: skip
            code: |
              var patient = new
              {
                  Name = "Іван Петренко",
                  Age  = 45
              };
        - box:
            title: "Згенерований клас (спрощено)"
            check: skip
            code: |
              [CompilerGenerated]
              internal sealed class <>f__AnonymousType0<TName, TAge>
              {
                  public TName Name { get; }   // лише get
                  public TAge  Age  { get; }
                  public override bool   Equals(object o) => …;  // за значеннями
                  public override int    GetHashCode()    => …;
                  public override string ToString()       => …;
              }
  - panel:
      heading: "Поведінка (виконано на .NET 10)"
      children:
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "результат", "чому"]
            groups:
              - rows:
                  - ["patient.Equals(same)",                 "`true`",  "`Equals` порівнює значення"]
                  - ["patient == same",                      "`false`", "`==` [[не перевизначено]] — посилання"]
                  - ["patient.GetType() == same.GetType()",  "`true`",  "той самий набір і порядок — один тип"]
                  - ["patient.ToString()",                   "`\"{ Name = Іван Петренко, Age = 45 }\"`", "згенерований `ToString`"]
                  - ["(patient with { Age = 46 }).Age",      "`46`",    "`with` для анонімних — з C# 10"]
        - text:
            text: ["`patient.Age = 46` — помилка CS0200: властивості лише для читання."]

check:
  usings: [System]
  context: |
    var patient = new { Name = "Іван Петренко", Age = 45 };
    var same = new { Name = "Іван Петренко", Age = 45 };
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var t = patient.GetType();
    if (!t.IsSealed || t.IsPublic || !t.IsGenericType || !t.Name.StartsWith("<>f__AnonymousType")) throw new Exception(t.Name);

publish:
  dark: ../../lectures/_assets/08-08/anonymous-type-generated.png
  bw: ../../lectures/_assets/08-08/book/anonymous-type-generated.png
