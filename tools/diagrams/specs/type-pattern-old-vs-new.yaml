# Лекція 9.1 «Патерн типів»
# Оригінал: lectures/_assets/09-01/Архив/type-pattern-old-vs-new.png
id: type-pattern-old-vs-new
title: "Патерн типів: перевірка, приведення і змінна — одним виразом"
subtitle: "Стара форма повторює тип двічі або тягне nullable-змінну; is Doctor doc робить усе разом (C# 7)"

types: [MedicalStaff, Doctor, Nurse]

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "До C# 7: is + явний cast"
            kind: box_muted
            check: skip
            code: |
              if (staff is Doctor)
              {
                  Doctor doc = [[(Doctor)staff]];
                  doc.PrescribeMeds();
              }
            notes: ["тип записано двічі — розійдуться при рефакторингу"]
        - box:
            title: "До C# 7: as + перевірка на null"
            kind: box_muted
            check: skip
            code: |
              Doctor doc = staff as Doctor;
              if ([[doc != null]])
                  doc.PrescribeMeds();
            notes: ["`as` працює лише з посилальними", "та nullable-типами"]
  - row:
      gap: 24
      children:
        - box:
            title: "C# 7+: патерн оголошення"
            kind: box_accent
            check: skip
            code: |
              if (staff is [[Doctor doc]])
              {
                  doc.PrescribeMeds();
              }
            notes: ["у гілці `doc` — гарантовано `Doctor`, не `null`"]
        - panel:
            heading: "Що гарантує компілятор (.NET 10)"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["ситуація", "результат"]
                  groups:
                    - rows:
                        - ["`if (!(s is Doctor doc)) return;`", "`doc` видима [[після]] `if`, присвоєна"]
                        - ["`doc` у гілці `else`", "[[не присвоєна]] — CS0165"]
                        - ["`case MedicalStaff` перед `case Doctor`", "[[помилка]] CS8120"]
                        - ["`switch` без `_`", "попередження CS8509"]

publish:
  dark: ../../lectures/_assets/09-01/type-pattern-old-vs-new.png
  bw: ../../lectures/_assets/09-01/book/type-pattern-old-vs-new.png
