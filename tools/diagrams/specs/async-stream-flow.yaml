# Лекція 17.6 «Асинхронні потоки. IAsyncEnumerable<T>»
# Оригінал: lectures/_assets/17-06/Архив/async-stream-flow.png
id: async-stream-flow
title: "IAsyncEnumerable<T>: елементи по мірі готовності"
subtitle: "П'ять записів по 50 мс: Task<List<T>> віддає все через 250 мс, асинхронний потік — перший запис через 50 мс"

types: [Task, List, IAsyncEnumerable, IAsyncEnumerator, CancellationToken, EnumeratorCancellationAttribute]

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Task<List<string>> — чекаємо все"
            children:
              - cells:
                  rows:
                    - caption: "завантаження"
                      cells: ["#1", "#2", "#3", "#4", "#5"]
                      kinds: [box, box, box, box, box]
                      top: ["50", "100", "150", "200", "250"]
                    - caption: "обробка"
                      cells: ["", "", "", "", "все"]
                      kinds: [box_muted, box_muted, box_muted, box_muted, box_accent]
              - text:
                  text:
                    - "Перший результат — через [[250 мс]];"
                    - "у пам'яті весь список одразу."
        - panel:
            heading: "IAsyncEnumerable<string> — по одному"
            children:
              - cells:
                  rows:
                    - caption: "yield return"
                      cells: ["#1", "#2", "#3", "#4", "#5"]
                      kinds: [box, box, box, box, box]
                      top: ["50", "100", "150", "200", "250"]
                    - caption: "await foreach"
                      cells: ["#1", "#2", "#3", "#4", "#5"]
                      kinds: [box_accent, box_accent, box_accent, box_accent, box_accent]
              - text:
                  text:
                    - "Перший результат — через [[50 мс]];"
                    - "у пам'яті — лише поточний елемент."

  - row:
      gap: 24
      children:
        - panel:
            heading: "Генератор і споживач"
            children:
              - box:
                  code: |
                    async IAsyncEnumerable<string> LoadRecordsAsync(
                        [EnumeratorCancellation] CancellationToken ct = default)
                    {
                        for (int i = 1; i <= 5; i++)
                        {
                            await Task.Delay(50, ct);
                            yield return $"Запис #{i}";
                        }
                    }
              - box:
                  check: skip
                  code: |
                    await foreach (var r in LoadRecordsAsync().WithCancellation(ct))
                        Show(r);
        - panel:
            heading: "Як це працює"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`await foreach`",   "`GetAsyncEnumerator`, `MoveNextAsync`, `Current`"]
                        - ["темп",              "генератор [[чекає]] на споживача:"]
                        - ["",                  "наступний `MoveNextAsync` — після тіла циклу"]
                        - ["без `[EnumeratorCancellation]`", "токен з `WithCancellation` не дійде (попередження CS8425)"]
                        - ["незалежний темп",   "`Channel<T>` — буфер між продюсером і споживачем"]
                        - ["EF Core",           "`query.AsAsyncEnumerable()`"]
                    - heading: "завершення"
                      rows:
                        - ["`break` у `await foreach`", "`DisposeAsync` — виконуються `finally` генератора"]
                        - ["`yield break`",     "дострокове завершення потоку"]
                        - ["з .NET 10",         "LINQ для потоків: `Where`, `Select`… (`System.Linq.AsyncEnumerable`)"]

check:
  usings: [System, System.Linq, System.Collections.Generic, System.Runtime.CompilerServices, System.Threading, System.Threading.Tasks]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var sw = System.Diagnostics.Stopwatch.StartNew(); long first = -1; int n = 0;
    await foreach (var r in LoadRecordsAsync()) { if (first < 0) first = sw.ElapsedMilliseconds; n++; }
    Eq(n, 5); Eq(first < 200, true);
    using var cts = new CancellationTokenSource(120); int got = 0;
    try { await foreach (var r in LoadRecordsAsync().WithCancellation(cts.Token)) got++; Eq(0, 1); } catch (OperationCanceledException) { }
    Eq(got < 5, true);
    int crit = 0; await foreach (var r in LoadRecordsAsync().Where(x => x.EndsWith("5"))) crit++; Eq(crit, 1);
    Eq(typeof(System.Linq.AsyncEnumerable).Assembly.GetName().Name, "System.Linq.AsyncEnumerable");

publish:
  dark: ../../lectures/_assets/17-06/async-stream-flow.png
  bw: ../../lectures/_assets/17-06/book/async-stream-flow.png
