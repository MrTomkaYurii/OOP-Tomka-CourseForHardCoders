# Лекція 7.3 «Явна реалізація інтерфейсів»
# Оригінал: lectures/_assets/07-03/Архив/explicit-vs-implicit.png
id: explicit-vs-implicit
title: "Явна реалізація: метод належить інтерфейсу, а не класу"
subtitle: "Два інтерфейси з однаковим RunProcedure() — кожен отримує власну реалізацію"

types: [IDiagnosable, ITreatment, Patient]

body:
  - row:
      gap: 24
      children:
        - box:
            title: "Явна реалізація (без public, з префіксом)"
            kind: box_accent
            check: skip
            code: |
              class Patient : IDiagnosable, ITreatment
              {
                  void IDiagnosable.RunProcedure()
                      => Console.WriteLine($"{Name}: МРТ, аналізи");
                  void ITreatment.RunProcedure()
                      => Console.WriteLine($"{Name}: ін'єкція, крапельниця");
              }
        - box:
            title: "Неявна — один метод на обидва"
            kind: box_muted
            check: skip
            code: |
              class Patient : IDiagnosable, ITreatment
              {
                  public void RunProcedure()
                      => Console.WriteLine("загальна процедура");
              }
            notes: ["обидва інтерфейси викличуть [[той самий]] метод"]
  - panel:
      heading: "Виклик залежить від типу змінної (явна реалізація)"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["виклик", "результат"]
            groups:
              - rows:
                  - ["`((IDiagnosable)p).RunProcedure()`", "діагностична процедура"]
                  - ["`((ITreatment)p).RunProcedure()`",   "лікувальна процедура"]
                  - ["`p.RunProcedure()`",                 "[[CS1061]] — у класу такого члена немає"]
              - heading: "непублічний член інтерфейсу (C# 8+), напр. `protected internal void M();`"
                rows:
                  - ["`public void M()` у класі",   "неявна реалізація — працює"]
                  - ["`internal void M()` у класі", "[[CS0737]] — реалізація має бути `public`"]
                  - ["`void I.M()`",                "явна — працює завжди"]

check:
  usings: [System]
  asserts: |
    var p = new Patient("Тетяна Руденко");
    if (((IDiagnosable)p).RunProcedure() != "D" || ((ITreatment)p).RunProcedure() != "T") throw new Exception("explicit");
    IMon m = new Mon(); if (m.Show() != "M") throw new Exception("nonpublic");
  types: |
    interface IDiagnosable { string RunProcedure(); }
    interface ITreatment { string RunProcedure(); }
    class Patient : IDiagnosable, ITreatment { public string Name { get; } public Patient(string n) => Name = n; string IDiagnosable.RunProcedure() => "D"; string ITreatment.RunProcedure() => "T"; }
    interface IMon { protected internal string M(); string Show() => M(); }
    class Mon : IMon { public string M() => "M"; }

publish:
  dark: ../../lectures/_assets/07-03/explicit-vs-implicit.png
  bw: ../../lectures/_assets/07-03/book/explicit-vs-implicit.png
