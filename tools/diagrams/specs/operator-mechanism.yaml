# Лекція 8.1 «Визначення операторів»
# Оригінал: lectures/_assets/08-01/Архив/operator-mechanism.png
id: operator-mechanism
title: "Перевантаження оператора: вираз → статичний метод"
subtitle: "Компілятор перетворює t1 + 0.8 на виклик op_Addition; ім'я методу видно в IL і через рефлексію"

types: [BodyTemperature]

body:
  - box:
      title: "Визначення в класі BodyTemperature"
      kind: box_accent
      check: skip
      code: |
        public static BodyTemperature operator +(BodyTemperature t, double delta)
            => new BodyTemperature(t.Celsius + delta);
        public static double operator -(BodyTemperature t1, BodyTemperature t2)
            => t1.Celsius - t2.Celsius;
      notes: ["`public static` обов'язкові; хоча б один параметр — тип, у якому оголошено оператор"]
  - panel:
      heading: "Що бачить компілятор (morning = 36.6, evening = 37.8)"
      children:
        - kv:
            check: skip
            columns: ["код", "викликається", "результат"]
            groups:
              - rows:
                  - ["morning + 0.8",     "`BodyTemperature.op_Addition(morning, 0.8)`",       "`BodyTemperature` 37.4"]
                  - ["evening - morning", "`BodyTemperature.op_Subtraction(evening, morning)`", "`double` 1.2"]
                  - ["evening > morning", "`BodyTemperature.op_GreaterThan(evening, morning)`", "`bool` true"]
                  - ["0.8 + morning",     "немає `op_Addition(double, BodyTemperature)`",      "[[помилка]] CS0019"]
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Обмеження"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["парами", "`<` `>`, `<=` `>=`, `==` `!=`, `true` `false`"]
                        - ["не можна", "`=`, `.`, `?:`, `?.`, `&&`, `||`, `??`"]
                        - ["`==`", "+ `Equals` і `GetHashCode` (CS0660/0661)"]
        - panel:
            heading: "Нове в C# 14 (.NET 10)"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`+=`, `-=` …", "можна оголосити [[окремо]]: `void operator +=(…)`"]
                        - ["`++`, `--`", "екземплярні: змінюють об'єкт на місці"]
                        - ["без них", "`a += b` — як і раніше, через `+`"]

check:
  usings: [System, System.Linq, System.Reflection]
  asserts: |
    var morning = new BodyTemperature(36.6); var evening = new BodyTemperature(37.8);
    if (Math.Abs((morning + 0.8).Celsius - 37.4) > 1e-9) throw new Exception("+");
    if (Math.Abs((evening - morning) - 1.2) > 1e-9) throw new Exception("-");
    var names = typeof(BodyTemperature).GetMethods().Where(m => m.IsSpecialName).Select(m => m.Name).ToArray();
    foreach (var n in new[] { "op_Addition", "op_Subtraction", "op_GreaterThan" }) if (!names.Contains(n)) throw new Exception(n);
  types: |
    class BodyTemperature
    {
        public double Celsius { get; }
        public BodyTemperature(double c) => Celsius = c;
        public static BodyTemperature operator +(BodyTemperature t, double d) => new BodyTemperature(t.Celsius + d);
        public static double operator -(BodyTemperature a, BodyTemperature b) => a.Celsius - b.Celsius;
        public static bool operator >(BodyTemperature a, BodyTemperature b) => a.Celsius > b.Celsius;
        public static bool operator <(BodyTemperature a, BodyTemperature b) => a.Celsius < b.Celsius;
    }

publish:
  dark: ../../lectures/_assets/08-01/operator-mechanism.png
  bw: ../../lectures/_assets/08-01/book/operator-mechanism.png
