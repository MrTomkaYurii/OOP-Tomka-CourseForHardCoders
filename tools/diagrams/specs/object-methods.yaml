# Лекція 4.7 «Клас System.Object та його методи»
# Оригінал: lectures/_assets/04-07/Архив/object-methods.png
id: object-methods
title: "System.Object: що отримує кожен тип"
subtitle: "Публічні методи екземпляра і що з них можна перевизначити (перевірено рефлексією)"

types: [Patient]

body:
  - panel:
      heading: "Методи System.Object"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["метод", "повертає", "перевизначення", "за замовчуванням"]
            groups:
              - heading: "public virtual"
                rows:
                  - ["`ToString()`",          "`string`", "так", "повне ім'я типу"]
                  - ["`Equals(object? obj)`", "`bool`",   "так", "рівність [[посилань]]"]
                  - ["`GetHashCode()`",       "`int`",    "так", "пов'язаний з об'єктом"]
              - heading: "не віртуальні"
                rows:
                  - ["`GetType()`",           "`Type`",   "[[ні]]", "реальний тип"]
                  - ["`static Equals(a, b)`", "`bool`",   "ні", "з перевіркою `null`"]
                  - ["`static ReferenceEquals(a, b)`", "`bool`", "ні", "завжди посилання"]
              - heading: "protected"
                rows:
                  - ["`MemberwiseClone()`",   "`object`", "ні", "поверхнева копія"]
                  - ["`Finalize()`",          "—",        "лише як `~Patient()`", "фіналізатор"]
  - note:
      text: ["Перевизначили `Equals` — перевизначте й `GetHashCode` (CS0659): рівні об'єкти мусять мати рівні хеш-коди, інакше `Dictionary`/`HashSet` їх загубить."]

check:
  usings: [System, System.Linq, System.Reflection]
  asserts: |
    var virt = typeof(object).GetMethods(BindingFlags.Public | BindingFlags.Instance).Where(m => m.IsVirtual).Select(m => m.Name).OrderBy(n => n).ToArray();
    if (string.Join(",", virt) != "Equals,GetHashCode,ToString") throw new Exception(string.Join(",", virt));
    if (typeof(object).GetMethod("GetType")!.IsVirtual) throw new Exception("GetType");

publish:
  dark: ../../lectures/_assets/04-07/object-methods.png
  bw: ../../lectures/_assets/04-07/book/object-methods.png
