# Лекція 18.4 «StreamReader та StreamWriter»
# Оригінал: lectures/_assets/18-04/Архив/encoding-comparison.png
id: encoding-comparison
title: "Кодування тексту: ASCII, UTF-8, UTF-16"
subtitle: "Скільки байтів займає символ і що станеться з кирилицею; string у .NET усередині — UTF-16"

types: [Encoding, StreamWriter, StreamReader, File, UTF8Encoding]

body:
  - panel:
      heading: "Байтів на символ — Encoding.X.GetByteCount(s)"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["символ", "ASCII", "UTF-8", "UTF-16 (Unicode)", "s.Length"]
            groups:
              - rows:
                  - ["`\"A\"` (U+0041)",    "1",               "1",          "2",          "1"]
                  - ["`\"Ж\"` (U+0416)",    "[[`?`]] — втрачено", "2",       "2",          "1"]
                  - ["емодзі (U+1F60A)",  "`??`",            "4",          "4 (сурогатна пара)", "[[2]]"]
        - text:
            text:
              - "ASCII — 128 символів; кирилицю `Encoding.ASCII` мовчки замінює на `?`. UTF-8 — змінна довжина 1–4 байти, сумісна з ASCII."

  - row:
      gap: 24
      children:
        - panel:
            heading: "BOM — мітка кодування на початку файлу"
            children:
              - kv:
                  check: skip
                  columns: ["запис `\"Ж\"`", "байтів у файлі"]
                  groups:
                    - rows:
                        - ["new StreamWriter(path)",                 "`2` — UTF-8 без BOM"]
                        - ["new StreamWriter(path, false, Encoding.UTF8)", "[[`5`]] — `EF BB BF` + 2"]
                        - ["File.WriteAllText(path, s)",             "`2`"]
                        - ["new UTF8Encoding(false)",                "явно без BOM"]
              - note:
                  text:
                    - "`Encoding.UTF8` [[має]] преамбулу — BOM пишеться,"
                    - "якщо передати його явно"
        - panel:
            heading: "Вибір"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["нові файли, JSON, веб", "UTF-8 (за замовчуванням)"]
                        - ["UTF-16",               "`string` і `char` усередині .NET, Windows API"]
                        - ["Windows-1251",         "старі файли; у .NET — пакет `CodePages`"]
                        - ["читання",              "`StreamReader` визначає кодування за BOM"]

check:
  usings: [System, System.IO, System.Text]
  context: |
    var p = Path.GetTempFileName();
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(Encoding.ASCII.GetString(Encoding.ASCII.GetBytes("Ж")), "?"); Eq(Encoding.UTF8.GetByteCount("Ж"), 2); Eq(Encoding.Unicode.GetByteCount("A"), 2);
    Eq(Encoding.UTF8.GetByteCount("😊"), 4); Eq(Encoding.Unicode.GetByteCount("😊"), 4); Eq("😊".Length, 2);
    using (var w = new StreamWriter(p)) w.Write("Ж"); Eq(new FileInfo(p).Length, 2L);
    using (var w = new StreamWriter(p, false, Encoding.UTF8)) w.Write("Ж"); Eq(new FileInfo(p).Length, 5L);
    File.WriteAllText(p, "Ж"); Eq(new FileInfo(p).Length, 2L);
    using (var w = new StreamWriter(p, false, new UTF8Encoding(false))) w.Write("Ж"); Eq(new FileInfo(p).Length, 2L);
    using (var w = new StreamWriter(p, false, Encoding.Unicode)) w.Write("A");
    using (var r = new StreamReader(p)) { r.ReadToEnd(); Eq(r.CurrentEncoding.WebName, "utf-16"); }
    try { Encoding.GetEncoding(1251); Eq(0, 1); } catch (NotSupportedException) { }
    File.Delete(p);

publish:
  dark: ../../lectures/_assets/18-04/encoding-comparison.png
  bw: ../../lectures/_assets/18-04/book/encoding-comparison.png
