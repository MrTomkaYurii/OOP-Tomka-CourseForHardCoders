# Лекція 6.2 «Лямбди»
# Оригінал: lectures/_assets/06-02/Архив/lambda-vs-methods.png
id: lambda-vs-methods
title: "Іменований метод, анонімний метод, лямбда"
subtitle: "Три способи дати делегату тіло; компілятор перетворює всі три на метод, а захоплення — на клас-оточення"

types: [PatientHandler]

body:
  - row:
      gap: 16
      equal: true
      children:
        - box:
            title: "Іменований метод"
            check: skip
            code: |
              void Alert(string msg)
                  => Console.WriteLine(msg);
              PatientHandler h = Alert;
        - box:
            title: "Анонімний метод (C# 2)"
            check: skip
            code: |
              PatientHandler h =
                  delegate (string msg)
                  { Console.WriteLine(msg); };
        - box:
            title: "Лямбда (C# 3)"
            kind: box_accent
            check: skip
            code: |
              PatientHandler h =
                  msg => Console.WriteLine(msg);
  - panel:
      heading: "Чим відрізняються"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["", "іменований", "анонімний", "лямбда"]
            groups:
              - rows:
                  - ["має ім'я, рекурсія",        "так",      "ні",  "ні (лише через змінну)"]
                  - ["повторне використання",     "так",      "через змінну делегата", "через змінну делегата"]
                  - ["захоплює локальні змінні",  "ні (локальна функція — так)", "так", "так"]
                  - ["можна опустити параметри",  "ні",       "[[так]]: `delegate { … }`", "ні"]
                  - ["тіло-вираз",                "`=>` (C# 6)", "ні", "так"]
                  - ["`static` — без захоплення", "—",        "так (C# 9)", "так (C# 9)"]
                  - ["тип без делегата (`var`)",  "так (C# 10)", "ні", "так (C# 10)"]

publish:
  dark: ../../lectures/_assets/06-02/lambda-vs-methods.png
  bw: ../../lectures/_assets/06-02/book/lambda-vs-methods.png
