# Лекція 16.1 «Клас Task. Основи TPL»
# Оригінал: lectures/_assets/16-01/Архив/task-lifecycle.png
id: task-lifecycle
title: "Стани завдання (TaskStatus)"
subtitle: "Від створення до одного з трьох кінцевих станів: RanToCompletion, Faulted або Canceled"

types: [Task, TaskStatus, CancellationToken, OperationCanceledException, AggregateException]

body:
  - panel:
      heading: "Шлях завдання"
      children:
        - hchain:
            nodes:
              - { title: "Created", sub: ["`new Task(work)`"] }
              - { title: "WaitingToRun", sub: ["у черзі пулу"], via: "Start()" }
              - { title: "Running", sub: ["на потоці пулу"], kind: box_accent, via: "є вільний потік" }
              - { title: "RanToCompletion", sub: ["`IsCompletedSuccessfully`"], via: "кінець методу" }
        - text:
            text:
              - "`Task.Run(() => …)` одразу дає `WaitingToRun` — стан `Created` бачать лише задачі з конструктора."

  - row:
      gap: 24
      children:
        - panel:
            heading: "Інші кінцеві стани"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["стан", "коли"]
                  groups:
                    - rows:
                        - ["`Faulted`",  "необроблений виняток; `Wait`/`Result` → `AggregateException`"]
                        - ["`Canceled`", "код кинув `OperationCanceledException` (`ThrowIfCancellationRequested`)"]
                        - ["",           "або токен скасовано ще [[до старту]]"]
              - note:
                  kind: box_accent
                  text:
                    - "`cts.Cancel()` сам задачу не зупиняє: якщо код не перевіряє токен,"
                    - "вона допрацює до кінця і стане `RanToCompletion`."

        - panel:
            heading: "WaitingForActivation"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`t.ContinueWith(…)`",     "чекає на `t`"]
                        - ["`Task.Run(async () => …)`", "проміжна задача-обгортка"]
                        - ["`async`-метод",           "(розд. 17) чекає на `await`"]
              - text:
                  text:
                    - "Такі задачі не ставляться в чергу —"
                    - "їх «активує» подія завершення іншої."

check:
  usings: [System, System.Threading, System.Threading.Tasks]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var gate = new ManualResetEventSlim();
    var t1 = new Task(() => gate.Wait()); Eq(t1.Status, TaskStatus.Created);
    var r = Task.Run(() => gate.Wait()); Eq(r.Status == TaskStatus.WaitingToRun || r.Status == TaskStatus.Running, true);
    Eq(r.ContinueWith(_ => { }).Status, TaskStatus.WaitingForActivation);
    Eq(Task.Run(async () => await Task.Delay(50)).Status, TaskStatus.WaitingForActivation);
    Thread.Sleep(50); Eq(r.Status, TaskStatus.Running); gate.Set(); r.Wait(); Eq(r.Status, TaskStatus.RanToCompletion);
    var cts = new CancellationTokenSource(); var k = Task.Run(() => Thread.Sleep(150), cts.Token); Thread.Sleep(30); cts.Cancel();
    try { k.Wait(); } catch { } Eq(k.Status, TaskStatus.RanToCompletion);
    var cts2 = new CancellationTokenSource(); var k2 = Task.Run(() => { Thread.Sleep(150); cts2.Token.ThrowIfCancellationRequested(); }, cts2.Token);
    Thread.Sleep(30); cts2.Cancel(); try { k2.Wait(); } catch (AggregateException) { } Eq(k2.Status, TaskStatus.Canceled);
    var cts3 = new CancellationTokenSource(); cts3.Cancel(); var pre = Task.Run(() => { }, cts3.Token); try { pre.Wait(); } catch { } Eq(pre.Status, TaskStatus.Canceled);
    var f = Task.Run(() => throw new InvalidOperationException()); try { f.Wait(); } catch (AggregateException) { } Eq(f.Status, TaskStatus.Faulted);

publish:
  dark: ../../lectures/_assets/16-01/task-lifecycle.png
  bw: ../../lectures/_assets/16-01/book/task-lifecycle.png
