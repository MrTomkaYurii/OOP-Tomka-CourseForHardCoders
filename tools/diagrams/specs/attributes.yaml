# Лекція 14.6 «Атрибути у .NET»
# Оригінал: lectures/_assets/14-06/Архив/attributes.png
id: attributes
title: "Атрибути: оголосити, обмежити, прочитати"
subtitle: "Атрибут — клас-нащадок System.Attribute; його дані зберігаються в метаданих збірки"

types: [PatientRecord, ValidationRangeAttribute, ValidationRange, AttributeUsage, AttributeTargets]

body:
  - row:
      gap: 24
      children:
        # ── 1. Вбудовані ──────────────────────────────────────────────────
        - panel:
            heading: "Вбудовані атрибути"
            children:
              - kv:
                  groups:
                    - heading: "мова і компілятор"
                      rows:
                        - ["[Obsolete]",          "застарілий API: попередження"]
                        - ["[Flags]",             "`enum` як бітова маска"]
                        - ["[CallerMemberName]",  "ім'я того, хто викликав"]
                        - ["[CompilerGenerated]", "код від компілятора"]
                        - ["[AttributeUsage]",    "де можна застосувати атрибут"]
                    - heading: "фреймворки читають рефлексією"
                      rows:
                        - ["[Required]",         "обов'язкове значення"]
                        - ["[JsonPropertyName]", "ім'я ключа в JSON"]
                        - ["[DllImport]",        "виклик нативної функції"]
                        - ["[Serializable]",     "лише стара бінарна серіалізація"]
                        - ["[NonSerialized]",    "поле, яке вона пропускає"]
              - kv:
                  groups:
                    - heading: "[AttributeUsage]"
                      rows:
                        - ["AttributeTargets", "де дозволено: `Class`, `Method`…"]
                        - ["AllowMultiple",    "кілька на елементі; типово `false`"]
                        - ["Inherited",        "бачать нащадки; типово `true`"]

        # ── 2. Власний атрибут ────────────────────────────────────────────
        - panel:
            heading: "Власний атрибут"
            children:
              - box:
                  title: "оголошення"
                  code: |
                    [AttributeUsage(AttributeTargets.Property,
                        AllowMultiple = false, Inherited = true)]
                    public sealed class ValidationRangeAttribute
                        : Attribute
                    {
                        public double Min { get; }
                        public double Max { get; }
                        public string? Message { get; set; }
                        public ValidationRangeAttribute(double min,
                            double max) => (Min, Max) = (min, max);
                    }
                  check: skip
              - box:
                  title: "застосування"
                  code: |
                    [ValidationRange(10, 60, Message = "ІМТ?")]
                    public double Bmi { get; set; }
                  check: skip
                  notes:
                    - "`10, 60` — позиційні → конструктор;"
                    - "`Message =` — іменований → властивість"
              - note:
                  text:
                    - "суфікс `Attribute` при застосуванні опускають:"
                    - "`[ValidationRange]` = `[ValidationRangeAttribute]`,"
                    - "`[Obsolete]` = `[ObsoleteAttribute]`"
        # ── 3. Читання ────────────────────────────────────────────────────
        - panel:
            heading: "Читання через рефлексію"
            children:
              - kv:
                  groups:
                    - heading: "API однаковий для Type, MethodInfo, PropertyInfo, …"
                      rows:
                        - ["IsDefined(type, inherit)",   "чи є — найшвидше"]
                        - ["GetCustomAttribute<A>()",    "один або `null`"]
                        - ["GetCustomAttributes<A>()",   "усі атрибути типу `A`"]
                        - ["GetCustomAttributesData()",  "опис без створення об'єкта"]
              - box:
                  title: "валідатор"
                  kind: box_accent
                  code: |
                    PropertyInfo bmi = t.GetProperty("Bmi")!;
                    var r = bmi.GetCustomAttribute<ValidationRangeAttribute>();
                    double v = (double)bmi.GetValue(p)!;
                    bool valid = r is null || (v >= r.Min && v <= r.Max);
              - note:
                  kind: box_accent
                  text:
                    - "Пастки `inherit`:"
                    - "· для `PropertyInfo` і `EventInfo` параметр `inherit` ігнорується —"
                    - "  `Attribute.GetCustomAttributes(prop, true)`;"
                    - "· атрибути інтерфейсу не переходять на клас, що його реалізує"
              - kv:
                  key_code: false
                  groups:
                    - heading: "хто читає атрибути"
                      rows:
                        - ["валідація",    "`[Required]`, `[Range]`, `[MaxLength]`"]
                        - ["ORM (EF Core)", "`[Table]`, `[Column]`, `[Key]`"]
                        - ["JSON",          "`[JsonIgnore]`, `[JsonPropertyName]`"]
                        - ["тести (xUnit)", "`[Fact]`, `[Theory]`"]
                        - ["ASP.NET Core",  "`[HttpGet]`, `[Authorize]`"]

check:
  usings: [System, System.Reflection, Med]
  context: |
    Type t = typeof(PatientRecord);
    var p = new PatientRecord { Bmi = 72 };
  asserts: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    Assert(r is not null && r.Min == 10 && r.Max == 60 && r.Message == "ІМТ?" && !valid, "валідатор");
    var u = typeof(ValidationRangeAttribute).GetCustomAttribute<AttributeUsageAttribute>()!;
    Assert(u.ValidOn == AttributeTargets.Property && !u.AllowMultiple && u.Inherited, "AttributeUsage");
    var dflt = new AttributeUsageAttribute(AttributeTargets.All);
    Assert(!dflt.AllowMultiple && dflt.Inherited, "типові AllowMultiple/Inherited");
    Assert(bmi.IsDefined(typeof(ValidationRangeAttribute), false), "IsDefined");
    Assert(bmi.GetCustomAttributesData()[0].ConstructorArguments.Count == 2, "AttributesData");
    var dp = typeof(Derived).GetProperty("Bmi")!;
    Assert(dp.GetCustomAttributes(typeof(ValidationRangeAttribute), true).Length == 0, "inherit ігнорується для PropertyInfo");
    Assert(Attribute.GetCustomAttributes(dp, typeof(ValidationRangeAttribute), true).Length == 1, "Attribute.GetCustomAttributes");
    Assert(!typeof(Impl).IsDefined(typeof(MarkAttribute), true), "інтерфейс не передає атрибути");
    Assert(typeof(ObsoleteAttribute).Name == "ObsoleteAttribute", "суфікс");
    _ = typeof(System.ComponentModel.DataAnnotations.RequiredAttribute);
    _ = typeof(System.Text.Json.Serialization.JsonPropertyNameAttribute);
    _ = typeof(System.Runtime.InteropServices.DllImportAttribute);
    _ = typeof(System.Runtime.CompilerServices.CallerMemberNameAttribute);
    _ = typeof(System.Runtime.CompilerServices.CompilerGeneratedAttribute);
    _ = typeof(FlagsAttribute); _ = typeof(SerializableAttribute); _ = typeof(NonSerializedAttribute);
  types: |
    namespace Med
    {
        [AttributeUsage(AttributeTargets.Property,
            AllowMultiple = false, Inherited = true)]
        public sealed class ValidationRangeAttribute
            : Attribute
        {
            public double Min { get; }
            public double Max { get; }
            public string? Message { get; set; }
            public ValidationRangeAttribute(double min,
                double max) => (Min, Max) = (min, max);
        }
        public class PatientRecord
        {
            [ValidationRange(10, 60, Message = "ІМТ?")]
            public virtual double Bmi { get; set; }
        }
        public class Derived : PatientRecord { public override double Bmi { get; set; } }
        public class MarkAttribute : Attribute { }
        [Mark] public interface IMarked { }
        public class Impl : IMarked { }
    }

publish:
  dark: ../../lectures/_assets/14-06/attributes.png
  bw: ../../lectures/_assets/14-06/book/attributes.png
