# Лекція 12.5 «DateTimeOffset та часові пояси»
# Оригінал: lectures/_assets/12-05/Архив/parsing-and-datetimeoffset.png
id: parsing-and-datetimeoffset
title: "Парсинг, DateTimeOffset і часові пояси"
subtitle: "Рядок → дата без сюрпризів; момент часу разом зі зсувом від UTC; конвертація між поясами"

types: [DateTime, DateTimeOffset, TimeZoneInfo, TimeSpan, CultureInfo, DateTimeStyles]

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Рядок → DateTime"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["метод", "невдалий рядок", "коли"]
                  groups:
                    - rows:
                        - ["`Parse(s)`",               "`FormatException`", "внутрішні дані"]
                        - ["`TryParse(s, out d)`",     "`false`, `d = MinValue`", "гнучкий ввід"]
                        - ["`ParseExact(s, fmts, inv)`", "`FormatException`", "відомий формат"]
                        - ["`TryParseExact(…)`",       "`false`",          "[[форми, файли]]"]
              - box:
                  title: "Масив форматів — HL7 / FHIR"
                  code: |
                    string[] fmts = { "yyyyMMdd", "yyyy-MM-dd" };
                    DateTime d = DateTime.ParseExact("20260611", fmts,
                        CultureInfo.InvariantCulture, DateTimeStyles.None);

        - panel:
            heading: "DateTimeOffset = момент + зсув"
            children:
              - hchain:
                  nodes:
                    - { title: "14:30 +03:00", sub: ["Київ, літо"], kind: box_accent }
                    - { title: "11:30 +00:00", sub: ["Лондон / UTC"], via: "той самий момент" }
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["kyiv == london",          "`true` — порівнюються UTC"]
                        - ["kyiv.EqualsExact(london)", "`false` — зсуви різні"]
                        - ["kyiv.Offset",             "`TimeSpan.FromHours(3)`"]
                        - ["kyiv.UtcDateTime.Hour",   "`11`"]
                        - ["DateTimeOffset.UtcNow.Offset", "`TimeSpan.Zero`"]
              - note:
                  text:
                    - "`new DateTimeOffset(utcDateTime, +3 год)` → `ArgumentException`:"
                    - "для `Kind = Utc` зсув може бути лише 00:00"

  - row:
      gap: 24
      children:
        - panel:
            heading: "TimeZoneInfo: правила поясу, включно з літнім часом"
            children:
              - kv:
                  check: skip
                  columns: ["вираз", "результат"]
                  groups:
                    - rows:
                        - ["FindSystemTimeZoneById(\"Europe/Kyiv\")", "IANA-ID (Linux, macOS, .NET 6+ і Windows)"]
                        - ["kyivTz.GetUtcOffset(1 липня)",  "`+03:00` — літній час"]
                        - ["kyivTz.GetUtcOffset(1 грудня)", "`+02:00`"]
                        - ["ConvertTimeFromUtc(11:30 UTC, kyivTz)", "14:30"]
              - note:
                  kind: box_accent
                  text:
                    - "Старий ID `\"Europe/Kiev\"` і Windows-ID `\"FLE Standard Time\"` на Linux можуть кинути `TimeZoneNotFoundException`"
                    - "(новий tzdata знає лише `Europe/Kyiv`) — беріть IANA-ID або `TryFindSystemTimeZoneById`."

        - panel:
            heading: "Що зберігати"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["БД, журнали, API",  "`DateTime.UtcNow` або `DateTimeOffset`"]
                        - ["подія з місцем",    "`DateTimeOffset.Now` — зберігає зсув"]
                        - ["показ користувачу", "UTC → пояс користувача в UI"]
                        - ["дата без часу",     "`DateOnly` — пояс не потрібен"]
                        - ["час прийому щодня", "`TimeOnly` + пояс клініки"]
                        - ["ніколи",            "`DateTime.Now` у базу"]

check:
  usings: [System, System.Globalization]
  context: |
    var kyiv = new DateTimeOffset(2026, 6, 11, 14, 30, 0, TimeSpan.FromHours(3));
    var london = new DateTimeOffset(2026, 6, 11, 11, 30, 0, TimeSpan.Zero);
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(d, new DateTime(2026, 6, 11));
    var kyivTz = TimeZoneInfo.FindSystemTimeZoneById("Europe/Kyiv");
    Eq(kyivTz.GetUtcOffset(new DateTime(2026, 7, 1)), TimeSpan.FromHours(3)); Eq(kyivTz.GetUtcOffset(new DateTime(2026, 12, 1)), TimeSpan.FromHours(2));
    Eq(TimeZoneInfo.ConvertTimeFromUtc(new DateTime(2026, 6, 11, 11, 30, 0, DateTimeKind.Utc), kyivTz).Hour, 14);
    try { _ = new DateTimeOffset(new DateTime(2026, 6, 11, 11, 30, 0, DateTimeKind.Utc), TimeSpan.FromHours(3)); Eq(0, 1); } catch (ArgumentException) { }
    Eq(DateTime.TryParse("abc", out var bad), false); Eq(bad, DateTime.MinValue);
    try { DateTime.ParseExact("11.06.2026", fmts, CultureInfo.InvariantCulture, DateTimeStyles.None); Eq(0, 1); } catch (FormatException) { }

publish:
  dark: ../../lectures/_assets/12-05/parsing-and-datetimeoffset.png
  bw: ../../lectures/_assets/12-05/book/parsing-and-datetimeoffset.png
