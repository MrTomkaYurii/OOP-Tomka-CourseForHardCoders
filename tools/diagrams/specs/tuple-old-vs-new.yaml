# Лекція 8.9 «Кортежі»
# Оригінал: lectures/_assets/08-09/Архив/tuple-old-vs-new.png
id: tuple-old-vs-new
title: "System.Tuple і ValueTuple"
subtitle: "Клас .NET 4.0 проти структури C# 7; імена полів — лише аліаси компілятора"

types: [Tuple, ValueTuple]

body:
  - panel:
      heading: "Порівняння (рядки з кодом виконано)"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["", "System.Tuple<T1, T2>", "(string Name, int Age)"]
            groups:
              - rows:
                  - ["вид типу",   "клас — reference type",            "структура — value type"]
                  - ["де живе",    "завжди купа",                       "там, де змінна: стек, поле, елемент масиву"]
                  - ["створення",  "`Tuple.Create(\"Іван\", 45)`",     "`(\"Іван\", 45)`"]
                  - ["доступ",     "`Item1`, `Item2` — властивості",   "`Name`, `Age` або `Item1` — поля"]
                  - ["зміна",      "лише читання",                      "[[поля змінювані]]"]
                  - ["> 7 елементів", "вкладення через `TRest`",       "так само `TRest` — компілятор ховає"]
              - heading: "рівність"
                rows:
                  - ["`Equals`",   "за значеннями: `true`",             "за значеннями: `true`"]
                  - ["`==`",       "[[посилання]]: `false`",            "поелементно (C# 7.3): `true`"]
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "Код C#"
            check: skip
            code: |
              (string Name, int Age) p = ("Іван", 45);
              Console.WriteLine(p.Name);
        - box:
            title: "У скомпільованому IL"
            kind: box_muted
            check: skip
            code: |
              ValueTuple<string, int> p = new("Іван", 45);
              Console.WriteLine(p.Item1);

check:
  usings: [System]
  asserts: |
    var x1 = Tuple.Create("Іван", 45); var x2 = Tuple.Create("Іван", 45);
    if (!x1.Equals(x2) || x1 == x2) throw new Exception("Tuple");
    var v1 = (Name: "Іван", Age: 45); var v2 = ("Іван", 45);
    if (!(v1 == v2) || !v1.Equals(v2)) throw new Exception("ValueTuple");
    if (!typeof((string, int)).IsValueType || typeof(Tuple<string, int>).IsValueType) throw new Exception("kind");
    var big = (1, 2, 3, 4, 5, 6, 7, 8, 9);
    if (big.GetType().GetGenericArguments().Length != 8) throw new Exception("TRest");
    v1.Age = 46;

publish:
  dark: ../../lectures/_assets/08-09/tuple-old-vs-new.png
  bw: ../../lectures/_assets/08-09/book/tuple-old-vs-new.png
