# Лекція 2.21 «Рекурсивні функції»
# Оригінал: lectures/_assets/02-21/Архив/recursion-call-stack.png
id: recursion-call-stack
title: "Стек викликів: Factorial(4)"
subtitle: "Кожен виклик — новий кадр стека зі своїм n; повернення йде у зворотному порядку"

types: []

body:
  - box:
      title: "Рекурсивний метод"
      kind: box_accent
      check: skip
      code: |
        int Factorial(int n)
        {
            if (n <= 1) return 1;          // базовий випадок
            return n * Factorial(n - 1);   // рекурсивний крок
        }
      notes: ["без базового випадку — `StackOverflowException`, який неможливо перехопити `catch`: процес завершується"]
  - hchain:
      equal: true
      nodes:
        - {title: "Factorial(4)", code: true, sub: ["4 * Factorial(3)"]}
        - {title: "Factorial(3)", code: true, via: "виклик", back: "6", sub: ["3 * Factorial(2)"]}
        - {title: "Factorial(2)", code: true, via: "виклик", back: "2", sub: ["2 * Factorial(1)"]}
        - {title: "Factorial(1)", code: true, kind: box_accent, via: "виклик", back: "1", sub: ["базовий випадок → 1"]}
  - note:
      text: ["Вправо — виклики: кожен додає кадр стека зі своїм `n`. Вліво — повернення: кадри знімаються, результат 4 · 6 = [[24]]."]

check:
  usings: [System]
  asserts: |
    int F(int n) { if (n <= 1) return 1; return n * F(n - 1); }
    if (F(4) != 24 || F(3) != 6 || F(2) != 2) throw new Exception("fact");

publish:
  dark: ../../lectures/_assets/02-21/recursion-call-stack.png
  bw: ../../lectures/_assets/02-21/book/recursion-call-stack.png
