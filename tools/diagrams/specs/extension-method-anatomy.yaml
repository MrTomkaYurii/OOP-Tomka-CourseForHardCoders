# Лекція 8.6 «Методи розширення»
# Оригінал: lectures/_assets/08-06/Архив/extension-method-anatomy.png
id: extension-method-anatomy
title: "Методи розширення: виклик через крапку → статичний метод"
subtitle: "Класичний синтаксис з this-параметром і extension-блок C# 14 компілюються в те саме"

types: [TemperatureExtensions]

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "Класичний (C# 3)"
            kind: box_accent
            check: skip
            code: |
              public static class TemperatureExtensions
              {
                  public static bool IsFever(this double celsius)
                      => celsius >= 37.5;
              }
            notes: ["клас `static`, не вкладений і не generic;", "`this` — лише перед першим параметром"]
        - box:
            title: "extension-блок (C# 14, .NET 10)"
            check: skip
            code: |
              public static class TemperatureExtensions
              {
                  extension(double celsius)
                  {
                      public bool IsFever() => celsius >= 37.5;
                      public bool IsNormalRange => celsius is >= 36 and <= 37;
                  }
              }
            notes: ["додає ще й [[властивості]] та статичні члени"]
  - panel:
      heading: "Як компілятор транслює виклик"
      children:
        - hchain:
            nodes:
              - {title: "temp.IsFever()", kind: box_accent, sub: ["виглядає як метод `double`"]}
              - {title: "TemperatureExtensions.IsFever(temp)", via: "компілятор", sub: ["звичайний статичний виклик"]}
        - kv:
            check: skip
            key_code: false
            groups:
              - rows:
                  - ["видимість", "простір імен класу підключено через `using`"]
                  - ["конфлікт", "власний метод типу з тією ж сигнатурою [[завжди перемагає]]"]
                  - ["`null`", "`s.IsFever()` при `s == null` — метод [[викличеться]]; перевірку робить сам метод"]

check:
  usings: [System]
  asserts: |
    if (!38.0.IsFever() || TemperatureExtensions.IsFever(36.6)) throw new Exception("ext");
  types: |
    public static class TemperatureExtensions { public static bool IsFever(this double celsius) => celsius >= 37.5; }

publish:
  dark: ../../lectures/_assets/08-06/extension-method-anatomy.png
  bw: ../../lectures/_assets/08-06/book/extension-method-anatomy.png
