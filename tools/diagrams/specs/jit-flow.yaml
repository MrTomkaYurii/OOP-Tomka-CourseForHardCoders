# Лекція 1.4 «JIT-компіляція»
# Оригінал: lectures/_assets/01-04/Архив/jit-flow.png
id: jit-flow
title: "Як JIT компілює методи під час виконання"
subtitle: "Компілюються лише викликані методи; гарячі — перекомпілюються з оптимізаціями (багаторівнева компіляція)"

types: []

body:
  - row:
      gap: 24
      children:
        - chain:
            align: left
            nodes:
              - {title: "1 · запуск", sub: ["CLR завантажує збірку; методи — ще CIL", "(код бібліотек .NET уже готовий: ReadyToRun)"]}
              - {title: "2 · перший виклик методу", via: "", sub: ["виклик іде через заглушку → JIT"]}
              - {title: "3 · JIT, рівень 0", via: "", kind: box_accent, sub: ["швидка компіляція без оптимізацій", "машинний код кешується в пам'яті"]}
              - {title: "4 · повторні виклики", via: "", sub: ["одразу машинний код, без JIT"]}
              - {title: "5 · гарячий метод → рівень 1", via: "≈ 30 викликів", sub: ["перекомпіляція у фоні з оптимізаціями", "і профілем виконання (Dynamic PGO)"]}
        - note:
            text:
              - "Методи, які не викликались,"
              - "не компілюються зовсім."
              - ""
              - "Рівень 0 — швидкий старт;"
              - "рівень 1 — швидкий код"
              - "там, де це окупається."
              - ""
              - "Довгий цикл у методі, що"
              - "викликався раз, теж"
              - "оптимізується: OSR"
              - "(заміна коду «на льоту»)."

