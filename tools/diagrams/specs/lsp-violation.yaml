# Лекція 20.4 «LSP — принцип підстановки Ліскової»
# Оригінал: lectures/_assets/20-04/Архив/lsp-violation.png
id: lsp-violation
title: "Порушення LSP: підклас, що відмовляється від контракту"
subtitle: "ProcessRecord чесно працює з MedicalRecord — і падає, коли йому підставили ReadOnlyRecord"

types: [MedicalRecord, ActiveDiagnosis, ReadOnlyRecord, InvalidOperationException]

body:
  - box:
      title: "Базовий клас — контракт: «AddDiagnosis додає діагноз»"
      kind: box_accent
      check: skip
      code: |
        abstract class MedicalRecord
        {
            public virtual void AddDiagnosis(string code) => _diagnoses.Add(code);
            public virtual string GetSummary() => …;
        }
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "ActiveDiagnosis — дотримується"
            check: skip
            code: |
              class ActiveDiagnosis : MedicalRecord
              {
                  // AddDiagnosis успадковано без змін
                  public override string GetSummary() =>
                      base.GetSummary() + " | Основний: …";
              }
            notes: ["розширює поведінку, не звужуючи її"]
        - box:
            title: "ReadOnlyRecord — порушує"
            check: skip
            code: |
              class ReadOnlyRecord : MedicalRecord
              {
                  public override void AddDiagnosis(string code)
                      => throw new [[InvalidOperationException]](
                             "…тільки для читання");
              }
            notes: ["посилює передумову до «не викликай мене»"]
  - panel:
      heading: "Клієнт: void ProcessRecord(MedicalRecord record, string diagCode)"
      children:
        - kv:
            check: skip
            columns: ["виклик", "результат"]
            groups:
              - rows:
                  - ["ProcessRecord(new ActiveDiagnosis(1, 101, \"J06.9\"), \"I10\")", "діагноз додано, тепер їх `2`"]
                  - ["ProcessRecord(new ReadOnlyRecord(2, 102), \"E11.9\")",          "[[`InvalidOperationException`]] — у runtime"]
        - text:
            text:
              - "Компілятор мовчить: за типом `ReadOnlyRecord` [[є]] `MedicalRecord`. Помилку побачить лише користувач."

check:
  usings: [System, System.Collections.Generic]
  asserts: |
    var a = new ActiveDiagnosis(1, 101, "J06.9"); a.AddDiagnosis("I10");
    if (a.Count != 2) throw new Exception("count");
    bool thrown = false;
    try { MedicalRecord r = new ReadOnlyRecord(2, 102); r.AddDiagnosis("E11.9"); }
    catch (InvalidOperationException) { thrown = true; }
    if (!thrown) throw new Exception("no throw");
  types: |
    abstract class MedicalRecord { protected List<string> _diagnoses = new(); public int Count => _diagnoses.Count; public virtual void AddDiagnosis(string code) => _diagnoses.Add(code); }
    class ActiveDiagnosis : MedicalRecord { public ActiveDiagnosis(int id, int p, string c) { _diagnoses.Add(c); } }
    class ReadOnlyRecord : MedicalRecord { public ReadOnlyRecord(int id, int p) { } public override void AddDiagnosis(string code) => throw new InvalidOperationException("Цей запис у режимі тільки для читання"); }

publish:
  dark: ../../lectures/_assets/20-04/lsp-violation.png
  bw: ../../lectures/_assets/20-04/book/lsp-violation.png
