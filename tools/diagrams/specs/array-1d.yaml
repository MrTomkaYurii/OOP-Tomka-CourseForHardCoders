# Лекція 2.14 «Масиви»
# Оригінал: lectures/_assets/02-14/Архив/array-1d.png
id: array-1d
title: "Одновимірний масив"
subtitle: "int[] ages = { 45, 32, 67, 28, 55 }; — індекси з нуля, ^1 — останній елемент (C# 8)"

types: [IndexOutOfRangeException]

body:
  - panel:
      heading: "ages"
      children:
        - cells:
            rows:
              - caption: "ages"
                cells: ["45", "32", "67", "28", "55"]
                kinds: [box_accent, box, box, box, box_accent]
                top: ["[0]", "[1]", "[2]", "[3]", "[4]"]
                bottom: ["[^5]", "[^4]", "[^3]", "[^2]", "[^1]"]
                note: "ages.Length = 5"
  - panel:
      heading: "Доступ (виконано)"
      children:
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "результат"]
            groups:
              - rows:
                  - ["ages[0]",              "`45`"]
                  - ["ages[^1]",             "`55`"]
                  - ["ages[ages.Length - 1]", "`55`"]
                  - ["ages[1..3].Length",    "`2`"]
                  - ["Out(ages, 5)",         "`\"IndexOutOfRangeException\"`"]
        - text:
            text: ["Масив — посилальний тип: елементи лежать у купі; розмір фіксується при створенні."]

check:
  usings: [System]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
    int[] ages = { 45, 32, 67, 28, 55 };
    string Out(int[] a, int i) { try { return a[i].ToString(); } catch (Exception e) { return e.GetType().Name; } }

publish:
  dark: ../../lectures/_assets/02-14/array-1d.png
  bw: ../../lectures/_assets/02-14/book/array-1d.png
