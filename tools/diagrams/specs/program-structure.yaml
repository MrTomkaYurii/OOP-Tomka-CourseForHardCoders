# Лекція 2.1 «Структура програми»
# Оригінал: lectures/_assets/02-01/Архив/program-structure.png
id: program-structure
title: "Структура програми C#"
subtitle: "Той самий код у двох формах: класична з Main і інструкції верхнього рівня (C# 9 / .NET 5+)"

types: [Program, Console]

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "Класична форма"
            check: skip
            code: |
              using System;           // ① using

              namespace Clinic        // ② простір імен
              {
                  class Program       // ③ клас
                  {
                      // ④ точка входу
                      static void Main(string[] args)
                      {
                          Console.WriteLine("Привіт!");
                      }
                  }
              }
        - box:
            title: "Інструкції верхнього рівня"
            kind: box_accent
            check: skip
            code: |
              Console.WriteLine("Привіт!");
            notes: ["`using System` додає `ImplicitUsings`;", "клас і `Main` генерує компілятор"]
  - panel:
      heading: "Що є що"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["елемент", "роль"]
            groups:
              - rows:
                  - ["`using`", "дає доступ до типів простору імен без повного імені"]
                  - ["`namespace`", "групує типи, запобігає конфліктам імен"]
                  - ["`class`", "містить дані й методи; кожен метод — у якомусь типі"]
                  - ["`static void Main`", "з нього починається виконання; може повертати `int` чи `Task`"]
                  - ["`.csproj`", "`OutputType`, `TargetFramework` (`net10.0`), `ImplicitUsings`, `Nullable`"]

publish:
  dark: ../../lectures/_assets/02-01/program-structure.png
  bw: ../../lectures/_assets/02-01/book/program-structure.png
