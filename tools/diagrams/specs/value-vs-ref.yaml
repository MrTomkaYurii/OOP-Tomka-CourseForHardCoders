# Лекція 2.19 «Передача параметрів за посиланням та значенням»
# Оригінал: lectures/_assets/02-19/Архив/value-vs-ref.png
id: value-vs-ref
title: "Передача за значенням і за посиланням"
subtitle: "Без модифікатора метод отримує копію; з ref — другу назву тієї самої змінної"

types: []

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "за значенням (за замовчуванням)"
            children:
              - box:
                  title: "void RegisterPulse(int pulse)"
                  check: skip
                  code: "pulse = pulse + 10;   // змінює копію"
              - cells:
                  rows:
                    - caption: "patientPulse"
                      cells: ["72"]
                    - caption: "pulse (копія)"
                      cells: ["82"]
                      kinds: [box_muted]
              - text:
                  text: ["після виклику `patientPulse` = [[72]]"]
        - panel:
            heading: "за посиланням (ref)"
            children:
              - box:
                  title: "Normalize(ref int systolic, ref int diastolic)"
                  check: skip
                  code: |
                    if (systolic > 140) systolic = 140;
                    if (diastolic > 90) diastolic = 90;
              - cells:
                  rows:
                    - caption: "sys = systolic"
                      cells: ["165 → 140"]
                      kinds: [box_accent]
                    - caption: "dia = diastolic"
                      cells: ["98 → 90"]
                      kinds: [box_accent]
              - text:
                  text: ["після виклику `sys` = [[140]], `dia` = [[90]]", "`ref` пишемо й при виклику: `Normalize(ref sys, ref dia)`"]

check:
  usings: [System]
  asserts: |
    int p = 72; void RegisterPulse(int pulse) { pulse = pulse + 10; } RegisterPulse(p); if (p != 72) throw new Exception("val");
    int sys = 165, dia = 98; void N(ref int s, ref int d) { if (s > 140) s = 140; if (d > 90) d = 90; } N(ref sys, ref dia);
    if (sys != 140 || dia != 90) throw new Exception("ref");

publish:
  dark: ../../lectures/_assets/02-19/value-vs-ref.png
  bw: ../../lectures/_assets/02-19/book/value-vs-ref.png
