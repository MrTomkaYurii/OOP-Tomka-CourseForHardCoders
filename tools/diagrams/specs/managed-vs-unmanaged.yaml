# Лекція 1.3 «Керований та некерований код»
# Оригінал: lectures/_assets/01-03/Архив/managed-vs-unmanaged.png
id: managed-vs-unmanaged
title: "Керований і некерований код"
subtitle: "Різниця не в «краще/гірше», а в тому, хто відповідає за пам'ять і безпеку"

types: [Patient]

body:
  - row:
      gap: 24
      equal: true
      children:
        - box:
            title: "керований — C#, F#, VB"
            kind: box_accent
            check: skip
            code: |
              var p = new Patient("Іван", 45);
              // ... використання ...
              // delete не існує: GC прибере
              // об'єкт, коли він стане недосяжним
        - box:
            title: "некерований — C, C++, Rust"
            check: skip
            code: |
              Patient* p = new Patient("Ivan", 45);
              // ... використання ...
              delete p;   // забули — витік,
                          // двічі — пошкодження пам'яті
  - panel:
      heading: "Порівняння"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["", "керований", "некерований"]
            groups:
              - rows:
                  - ["компілюється в",   "CIL (+ JIT або AOT)",                  "машинний код одразу"]
                  - ["пам'ять",          "GC",                                   "вручну: `malloc/free`, `new/delete`, RAII"]
                  - ["помилки пам'яті",  "виняток (межі, приведення, `null`)",   "невизначена поведінка"]
                  - ["продуктивність",   "висока; JIT/GC мають накладні витрати", "максимальний контроль"]
                  - ["типові сфери",     "застосунки, веб, API, сервіси",         "ОС, драйвери, рушії, вбудовані системи"]

publish:
  dark: ../../lectures/_assets/01-03/managed-vs-unmanaged.png
  bw: ../../lectures/_assets/01-03/book/managed-vs-unmanaged.png
