# Лекція 2.7 «Порозрядні операції»
# Оригінал: lectures/_assets/02-07/Архив/twos-complement.png
id: twos-complement
title: "Додатковий код: як зберігаються від'ємні числа"
subtitle: "8-бітний приклад (sbyte); старший біт — знаковий, −x = ~x + 1"

types: []

body:
  - panel:
      heading: "Біти sbyte (перевірено Convert.ToString(x, 2))"
      children:
        - cells:
            rows:
              - caption: "12"
                cells: ["0", "0", "0", "0", "1", "1", "0", "0"]
                kinds: [box_accent, box, box, box, box, box, box, box]
                top: ["7", "6", "5", "4", "3", "2", "1", "0"]
              - caption: "~12 = −13"
                cells: ["1", "1", "1", "1", "0", "0", "1", "1"]
                kinds: [box_accent, box, box, box, box, box, box, box]
              - caption: "~12 + 1 = −12"
                cells: ["1", "1", "1", "1", "0", "1", "0", "0"]
                kinds: [box_accent, box, box, box, box, box, box, box]
              - caption: "−1"
                cells: ["1", "1", "1", "1", "1", "1", "1", "1"]
                kinds: [box_accent, box, box, box, box, box, box, box]
  - note:
      text: ["Біт 7 (виділено) — знак: `0` — невід'ємне, `1` — від'ємне. Діапазон `sbyte`: −128 … 127; для `int` те саме на 32 бітах."]

check:
  usings: [System]
  asserts: |
    string B(sbyte v) => Convert.ToString((byte)v, 2).PadLeft(8, '0');
    if (B(12) != "00001100" || B(-13) != "11110011" || B(-12) != "11110100" || B(-1) != "11111111") throw new Exception("bits");
    if ((sbyte)~12 != -13) throw new Exception("not");

publish:
  dark: ../../lectures/_assets/02-07/twos-complement.png
  bw: ../../lectures/_assets/02-07/book/twos-complement.png
