# Лекція 2.4 «Типи даних»
# Оригінал: lectures/_assets/02-04/Архив/data-types.png
id: data-types
title: "Вбудовані типи даних C#"
subtitle: "Розмір, діапазон і системний тип .NET — значення перевірено через MinValue/MaxValue і sizeof"

types: []

body:
  - row:
      gap: 24
      children:
        - panel:
            heading: "Цілі"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["тип", "байт", "діапазон", ".NET"]
                  groups:
                    - rows:
                        - ["`sbyte`",  "1", "−128 … 127",      "`SByte`"]
                        - ["`byte`",   "1", "0 … 255",         "`Byte`"]
                        - ["`short`",  "2", "−32 768 … 32 767", "`Int16`"]
                        - ["`ushort`", "2", "0 … 65 535",      "`UInt16`"]
                        - ["`int`",    "4", "±2,1 · 10⁹",      "`Int32`"]
                        - ["`uint`",   "4", "0 … 4,3 · 10⁹",   "`UInt32`"]
                        - ["`long`",   "8", "±9,2 · 10¹⁸",     "`Int64`"]
                        - ["`ulong`",  "8", "0 … 1,8 · 10¹⁹",  "`UInt64`"]
        - stack:
            gap: 24
            children:
              - panel:
                  heading: "Дробові"
                  children:
                    - kv:
                        check: skip
                        key_code: false
                        columns: ["тип", "байт", "точність"]
                        groups:
                          - rows:
                              - ["`float`",   "4",  "~6–9 цифр"]
                              - ["`double`",  "8",  "~15–17 цифр"]
                              - ["`decimal`", "16", "28–29 цифр, десяткова"]
              - panel:
                  heading: "Інші"
                  children:
                    - kv:
                        check: skip
                        key_code: false
                        columns: ["тип", "що зберігає"]
                        groups:
                          - rows:
                              - ["`bool`",   "`true` / `false`"]
                              - ["`char`",   "UTF-16 код, 2 байти"]
                              - ["`string`", "послідовність `char` (посилання)"]
                              - ["`object`", "посилання на що завгодно"]

check:
  usings: [System]
  asserts: |
    if (sizeof(decimal) != 16 || sizeof(char) != 2 || sizeof(bool) != 1) throw new Exception("size");
    if (short.MinValue != -32768 || ushort.MaxValue != 65535 || sbyte.MinValue != -128) throw new Exception("range");

publish:
  dark: ../../lectures/_assets/02-04/data-types.png
  bw: ../../lectures/_assets/02-04/book/data-types.png
