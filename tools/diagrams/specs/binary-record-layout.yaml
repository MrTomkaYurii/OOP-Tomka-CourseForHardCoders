# Лекція 18.5 «BinaryReader та BinaryWriter»
# Оригінал: lectures/_assets/18-05/Архив/binary-record-layout.png
id: binary-record-layout
title: "Бінарний запис фіксованого розміру"
subtitle: "Кожен запис займає рівно 46 байтів — тому i-й запис починається з i × 46, і до нього можна перейти Seek без читання попередніх"

types: [BinaryWriter, BinaryReader, Encoding, SeekOrigin]

body:
  - panel:
      heading: "Один запис vitals_index.bin — 46 байтів"
      children:
        - cells:
            rows:
              - caption: "поле"
                cells: ["Id", "Name", "Glucose", "Pulse"]
                kinds: [box, box_accent, box, box]
                top: ["0", "4", "36", "44"]
                bottom: ["int · 4", "byte[32] UTF-8", "double · 8", "short · 2"]
        - text:
            text:
              - "Імʼя — рівно 32 байти: UTF-8 байти імені, решта нулі. Ширину задають у [[байтах]], а не в символах — кирилиця займає по 2 байти."

  - row:
      gap: 24
      children:
        - panel:
            heading: "Файл: записи один за одним"
            children:
              - cells:
                  rows:
                    - caption: "індекс"
                      cells: ["0", "1", "2", "3", "4"]
                      kinds: [box, box, box, box_accent, box]
                      top: ["0", "46", "92", "138", "184"]
                      note: "зсув = i × 46"
              - box:
                  check: skip
                  code: |
                    br.BaseStream.Seek(3 * RecordSize, SeekOrigin.Begin);
                    int id = br.ReadInt32();
                    string name = Encoding.UTF8.GetString(br.ReadBytes(32)).TrimEnd('\0');
              - note:
                  text:
                    - "Кількість записів = `Length / 46`; читання не з межі запису дає [[сміття]], а не виняток."
        - panel:
            heading: "Розміри в BinaryWriter"
            children:
              - kv:
                  check: skip
                  columns: ["Write(x)", "байтів"]
                  groups:
                    - rows:
                        - ["bool, byte",      "1"]
                        - ["short / int / long", "2 / 4 / 8"]
                        - ["float / double",  "4 / 8"]
                        - ["decimal",         "16"]
                        - ["char",            "[[1–3]] — за кодуванням"]
                        - ["string",          "довжина (7-біт) + UTF-8"]
              - note:
                  text:
                    - "`string` змінної довжини — для"
                    - "фіксованого запису не годиться"

check:
  usings: [System, System.IO, System.Text]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var ms = new MemoryStream(); var w = new BinaryWriter(ms);
    void Rec(int id, string n, double g, short p) { w.Write(id); var nb = new byte[32]; var e = Encoding.UTF8.GetBytes(n); Array.Copy(e, nb, Math.Min(e.Length, 32)); w.Write(nb); w.Write(g); w.Write(p); }
    Rec(1001, "Коваль М.А.", 5.1, 72); Eq(ms.Length, 46L);
    Rec(1002, "Бойко О.П.", 8.7, 145); Rec(1003, "Мороз В.І.", 4.8, 68); Rec(1004, "Петренко І.О.", 12.4, 110);
    var br = new BinaryReader(new MemoryStream(ms.ToArray()));
    br.BaseStream.Seek(3 * 46, SeekOrigin.Begin); Eq(br.ReadInt32(), 1004); Eq(Encoding.UTF8.GetString(br.ReadBytes(32)).TrimEnd('\0'), "Петренко І.О."); Eq(br.ReadDouble(), 12.4);
    var m2 = new MemoryStream(); var w2 = new BinaryWriter(m2); w2.Write('A'); Eq(m2.Length, 1L); w2.Write('Ж'); Eq(m2.Length, 3L); w2.Write(1m); Eq(m2.Length, 19L);
    var m3 = new MemoryStream(); new BinaryWriter(m3).Write("Петренко"); Eq(m3.Length, 17L);

publish:
  dark: ../../lectures/_assets/18-05/binary-record-layout.png
  bw: ../../lectures/_assets/18-05/book/binary-record-layout.png
