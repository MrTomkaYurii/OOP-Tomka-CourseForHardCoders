# Лекція 17.1 «async та await. Асинхронні методи»
# Оригінал: lectures/_assets/17-01/Архив/async-await-flow.png
id: async-await-flow
title: "async/await: що відбувається з потоком"
subtitle: "Синхронний код тримає потік під час очікування; await повертає керування, а продовження виконується пізніше"

types: [Task, Thread, Patient, SynchronizationContext]

body:
  - panel:
      heading: "Синхронно: var card = db.LoadCard(id);"
      children:
        - hchain:
            equal: true
            nodes:
              - { title: "потік #1", sub: ["код до запиту"] }
              - { title: "потік #1 [[заблоковано]]", sub: ["200 мс чекає базу"], kind: box_muted, via: "запит" }
              - { title: "потік #1", sub: ["код після запиту"], via: "відповідь" }

  - panel:
      heading: "Асинхронно: var card = await db.LoadCardAsync(id);"
      children:
        - hchain:
            equal: true
            nodes:
              - { title: "потік #1", sub: ["код до `await` —", "синхронно, як звичайно"] }
              - { title: "метод повертає Task", sub: ["потік #1 вільний:", "пул / цикл UI"], kind: box_accent, via: "await" }
              - { title: "I/O без потоку", sub: ["чекає драйвер мережі,", "диска чи таймер"], kind: box_muted }
              - { title: "продовження", sub: ["потік пулу (#1 чи інший)", "або UI-потік"], via: "готово" }

  - row:
      gap: 24
      children:
        - panel:
            heading: "Правила"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`await` уже завершеної задачі",   "[[без паузи]] — далі синхронно в тому самому потоці"]
                        - ["консоль, ASP.NET Core",          "продовження на будь-якому потоці пулу"]
                        - ["WPF / WinForms / MAUI",          "повертається в UI-потік (`SynchronizationContext`)"]
                        - ["`async` без жодного `await`",    "попередження CS1998 — метод виконається синхронно"]
                        - ["`Task.Delay(100)`",              "таймер, потік вільний; `Thread.Sleep(100)` — блокує"]
        - panel:
            heading: "Під капотом"
            children:
              - box:
                  notes:
                    - "Компілятор перетворює метод на машину"
                    - "станів: кожен `await` — точка, де метод"
                    - "зберігає локальні змінні в полях і"
                    - "реєструє продовження в задачі."
                    - "У Release-збірці машина — [[`struct`]]: доки"
                    - "немає справжньої паузи, вона в купу"
                    - "не потрапляє."

check:
  usings: [System, System.Threading, System.Threading.Tasks]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    int caller = Environment.CurrentManagedThreadId; int before = -1, afterDone = -1;
    async Task Probe() { before = Environment.CurrentManagedThreadId; await Task.CompletedTask; afterDone = Environment.CurrentManagedThreadId; await Task.Delay(50); }
    var t = Probe(); Eq(before, caller); Eq(afterDone, caller); Eq(t.IsCompleted, false); await t;
    var sw = System.Diagnostics.Stopwatch.StartNew(); var d = Task.Delay(100); Eq(sw.ElapsedMilliseconds < 50, true); await d;

publish:
  dark: ../../lectures/_assets/17-01/async-await-flow.png
  bw: ../../lectures/_assets/17-01/book/async-await-flow.png
