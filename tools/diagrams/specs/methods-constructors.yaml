# Лекція 14.3 «Дослідження методів та конструкторів за допомогою рефлексії»
# Оригінал: lectures/_assets/14-03/Архив/methods-constructors.png
id: methods-constructors
title: "MethodInfo і ConstructorInfo: дослідити й викликати"
subtitle: "GetParameters() описує сигнатуру, Invoke() викликає метод під час виконання"

types: [PatientRecord]

body:
  - row:
      gap: 24
      children:
        # ── 1. MethodInfo + ParameterInfo ─────────────────────────────────
        - stack:
            gap: 24
            children:
              - panel:
                  heading: "MethodInfo — опис методу"
                  children:
                    - kv:
                        check: "_ = m!.{};"
                        groups:
                          - heading: "сигнатура та модифікатори"
                            rows:
                              - ["Name",            "`\"SetBmi\"`"]
                              - ["ReturnType",      "`typeof(void)` для `void`"]
                              - ["IsStatic",        "статичний метод"]
                              - ["IsVirtual",       "`virtual` або `override`"]
                              - ["IsAbstract",      "`abstract` (тоді й `IsVirtual`)"]
                              - ["IsGenericMethod", "узагальнений метод `M<T>()`"]
                              - ["IsSpecialName",   "`get_`/`set_`/`add_` від компілятора"]
                          - heading: "доступ: `true`, якщо метод —"
                            rows:
                              - ["IsPublic",   "`public`"]
                              - ["IsPrivate",  "`private`"]
                              - ["IsFamily",   "`protected`"]
                              - ["IsAssembly", "`internal`"]
              - panel:
                  heading: "ParameterInfo — параметр"
                  children:
                    - kv:
                        check: "_ = ps[0].{};"
                        groups:
                          - rows:
                              - ["Name",          "`\"bmi\"`"]
                              - ["ParameterType", "`Int32&` — для `ref`/`out`/`in`"]
                              - ["Position",      "індекс у сигнатурі, від 0"]
                              - ["DefaultValue",  "значення або `DBNull.Value`"]
                              - ["IsOut",         "`out`-параметр"]

        # ── 2. Invoke ─────────────────────────────────────────────────────
        - stack:
            gap: 24
            children:
              - panel:
                  heading: "Виклик через Invoke"
                  children:
                    - chain:
                        align: left
                        nodes:
                          - title: "1 · отримати тип"
                            lines: |
                              Type t = typeof(PatientRecord);
                          - title: "2 · знайти метод за ім'ям"
                            lines: |
                              MethodInfo? m = t.GetMethod("SetBmi");
                          - title: "3 · перевірити сигнатуру"
                            lines: |
                              ParameterInfo[] ps = m!.GetParameters();
                          - title: "4 · викликати"
                            kind: box_accent
                            lines: |
                              object? res = m.Invoke(p, [24.5]);
                            sub: ["для `static`-методу `obj` = `null`"]
                          - title: "5 · розібрати результат"
                            sub: ["`void` → `null`; значущий тип → упакований `object`"]
        # ── 3. Створення об'єкта ──────────────────────────────────────────
        - stack:
            gap: 24
            children:
              - panel:
                  heading: "Створення об'єкта"
                  children:
                    - box:
                        title: "ConstructorInfo.Invoke"
                        code: |
                          ConstructorInfo? c =
                              t.GetConstructor([typeof(string)]);
                          object p1 = c!.Invoke(["P001"]);
                        notes: ["точний вибір перевантаження"]
                    - box:
                        title: "Activator.CreateInstance"
                        code: |
                          object? p2 =
                              Activator.CreateInstance(t, "P002");
                        notes:
                          - "конструктор підбирається за аргументами;"
                          - "приватний без параметрів —"
                          - "`CreateInstance(t, nonPublic: true)`"
                    - kv:
                        groups:
                          - heading: "два види конструкторів"
                            rows:
                              - [".ctor",  "екземпляра: `GetConstructors()`"]
                              - [".cctor", "статичний: `t.TypeInitializer`;"]
                              - ["",       "запускає CLR перед першим"]
                              - ["",       "використанням типу"]
              - panel:
                  heading: "Винятки Invoke"
                  children:
                    - kv:
                        groups:
                          - rows:
                              - ["TargetInvocationException",     "метод кинув виняток —"]
                              - ["",                              "причина в `.InnerException`"]
                              - ["TargetParameterCountException", "не та кількість аргументів"]
                              - ["ArgumentException",             "аргумент не того типу"]

  # ── 4. Ціна виклику ───────────────────────────────────────────────────────
  - panel:
      heading: "Ціна динамічного виклику"
      children:
        - row:
            gap: 16
            equal: true
            children:
              - box: { title: "Прямий виклик",       text: ["`p.SetBmi(24.5)` — базова", "лінія; JIT може вбудувати"] }
              - box: { title: "MethodInfo.Invoke",   text: ["у 10–100 разів повільніше:", "масив аргументів, пакування"] }
              - box: { title: "Кешуйте MethodInfo",  text: ["`GetMethod` шукає за ім'ям —", "робіть це один раз"] }
              - box: { title: "CreateDelegate",      text: ["`Action<double>` з `MethodInfo`", "— майже як прямий виклик"] }

check:
  usings: [System, System.Reflection, Med]
  context: |
    var p = new PatientRecord("P000");
  asserts: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
    Assert(m!.Name == "SetBmi" && m.ReturnType == typeof(void) && res is null, "void → null");
    Assert(ps[0].Name == "bmi" && ps[0].Position == 0 && ps[0].DefaultValue is DBNull, "ParameterInfo");
    Assert(p.Bmi == 24.5, "Invoke змінив об'єкт");
    Assert(typeof(PatientRecord).GetMethod("Load")!.GetParameters()[0].ParameterType.Name == "Int32&", "out → Int32&");
    Assert(t.GetMethod("get_Id")!.IsSpecialName, "IsSpecialName");
    try { t.GetMethod("Fail")!.Invoke(p, null); Assert(false, "TIE"); }
    catch (TargetInvocationException e) { Assert(e.InnerException is InvalidOperationException, "InnerException"); }
    try { m.Invoke(p, null); Assert(false, "count"); } catch (TargetParameterCountException) { }
    try { m.Invoke(p, ["x"]); Assert(false, "type"); } catch (ArgumentException) { }
    Assert(((PatientRecord)p1).Id == "P001" && ((PatientRecord)p2!).Id == "P002", "ctor/Activator");
    Assert(t.TypeInitializer?.Name == ".cctor" && t.GetConstructors()[0].Name == ".ctor", ".ctor/.cctor");
    Assert(Activator.CreateInstance(typeof(Hidden), nonPublic: true) is Hidden, "nonPublic");
    try { Activator.CreateInstance(typeof(Hidden)); Assert(false, "private ctor"); } catch (MissingMethodException) { }
    var del = m.CreateDelegate<Action<double>>(p); del(30); Assert(p.Bmi == 30, "CreateDelegate");
  types: |
    namespace Med
    {
        public class PatientRecord
        {
            static PatientRecord() { }
            public PatientRecord(string id) => Id = id;
            public string Id { get; }
            public double Bmi { get; private set; }
            public void SetBmi(double bmi) => Bmi = bmi;
            public void Load(out int n) => n = 1;
            public void Fail() => throw new InvalidOperationException();
        }
        public class Hidden { private Hidden() { } }
    }

publish:
  dark: ../../lectures/_assets/14-03/methods-constructors.png
  bw: ../../lectures/_assets/14-03/book/methods-constructors.png
