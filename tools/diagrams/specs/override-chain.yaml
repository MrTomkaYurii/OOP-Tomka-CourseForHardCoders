# Лекція 4.3 «Віртуальні методи та властивості»
# Оригінал: lectures/_assets/04-03/Архив/override-chain.png
id: override-chain
title: "Ланцюжок перевизначень із base.Print()"
subtitle: "Person p = new Inpatient(…); p.Print() — кожен рівень додає свій рядок і передає керування вгору"

types: [Person, Patient, Inpatient]

body:
  - row:
      gap: 24
      equal: true
      children:
        - panel:
            heading: "Оголошення"
            children:
              - chain:
                  align: left
                  nodes:
                    - {title: "Person", sub: ["`public virtual void Print()`"]}
                    - {title: "Patient : Person", sub: ["`public override void Print()` → `base.Print()`"]}
                    - {title: "Inpatient : Patient", kind: box_accent, sub: ["`public override void Print()` → `base.Print()`"]}
        - panel:
            heading: "Вивід runnable-прикладу"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["рядок", "надрукував"]
                  groups:
                    - rows:
                        - ["«Особа: Іван Петренко»",  "`Person.Print()`"]
                        - ["«  Діагноз: Гіпертонія»", "`Patient.Print()`"]
                        - ["«  Палата: Палата 12»",   "`Inpatient.Print()`"]
              - text:
                  text:
                    - "Виклик почався з `Inpatient.Print()`, але `base.Print()`"
                    - "стоїть [[першим]] рядком — тому вивід іде від бази."
                    - "`sealed override` забороняє перевизначати далі."

check:
  usings: [System]
  asserts: |
    Person p = new Inpatient(); var log = p.Print();
    if (log != "Person|Patient|Inpatient") throw new Exception(log);
  types: |
    class Person { public virtual string Print() => "Person"; }
    class Patient : Person { public override string Print() => base.Print() + "|Patient"; }
    class Inpatient : Patient { public override string Print() => base.Print() + "|Inpatient"; }

publish:
  dark: ../../lectures/_assets/04-03/override-chain.png
  bw: ../../lectures/_assets/04-03/book/override-chain.png
