# Лекція 16.3 «Продовження завдань. ContinueWith»
# Оригінал: lectures/_assets/16-03/Архив/continuation-chain.png
id: continuation-chain
title: "ContinueWith: ланцюг завдань"
subtitle: "Продовження стартує, коли попереднє завдання завершилось, і отримує його як параметр; ContinueWith не блокує"

types: [Task, TaskContinuationOptions, AggregateException, TaskCanceledException]

body:
  - panel:
      heading: "Маршрут пацієнта: результат кожного кроку йде далі"
      children:
        - hchain:
            align: left
            nodes:
              - title: "1 · анамнез"
                lines: |
                  Task<string> history =
                      Task.Run(() => "P-042");
              - title: "2 · діагноз"
                via: "ContinueWith"
                lines: |
                  Task<string> diagnosis =
                      history.ContinueWith(
                          prev => prev.Result + ":I10");
              - title: "3 · призначення"
                kind: box_accent
                via: "ContinueWith"
                lines: |
                  Task<string> plan =
                      diagnosis.ContinueWith(
                          prev => "Лізиноприл для " + prev.Result);
        - text:
            text:
              - "`prev` — попереднє завдання: його `Status`, `Exception`, `Result`. До `prev.Result` звертаємось, коли воно вже завершене — тому без очікування."

  - row:
      gap: 24
      children:
        - panel:
            heading: "Умова запуску — TaskContinuationOptions"
            children:
              - kv:
                  check: skip
                  key_code: false
                  columns: ["опція", "продовження запуститься, якщо попереднє…"]
                  groups:
                    - rows:
                        - ["(за замовчуванням)",        "[[завершилось будь-як]] — навіть з помилкою"]
                        - ["`OnlyOnRanToCompletion`",  "успішне"]
                        - ["`OnlyOnFaulted`",          "з винятком — місце для обробника"]
                        - ["`OnlyOnCanceled`",         "скасоване"]
                        - ["`ExecuteSynchronously`",   "(не умова) — у потоці, що завершив попереднє"]
              - note:
                  text:
                    - "Умова не виконалась → продовження стає `Canceled`;"
                    - "`Wait` на ньому кидає `TaskCanceledException`."

        - panel:
            heading: "Помилка не зупиняє ланцюг сама"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["крок 1 кинув виняток",    "крок 2 (без опцій) [[все одно]] стартує"]
                        - ["крок 2 читає `prev.Result`", "`AggregateException` → крок 2 теж `Faulted`"]
                        - ["кінець ланцюга",          "`AggregateException` в `AggregateException`"]
              - note:
                  kind: box_accent
                  text:
                    - "Розгалуження: `OnlyOnRanToCompletion` — далі,"
                    - "`OnlyOnFaulted` — обробник помилки."

check:
  usings: [System, System.Threading.Tasks]
  context: |
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(plan.Result, "Лізиноприл для P-042:I10");
    var bad = Task.Run(() => { if (DateTime.Now.Year > 0) throw new InvalidOperationException(); return 1; });
    Eq(bad.ContinueWith(p => "ran").Result, "ran");
    var c = bad.ContinueWith(p => p.Result + 1);
    try { c.Wait(); } catch (AggregateException e) { Eq(c.Status, TaskStatus.Faulted); Eq(e.InnerException is AggregateException, true); }
    var onlyF = Task.Run(() => 1).ContinueWith(_ => 0, TaskContinuationOptions.OnlyOnFaulted);
    try { onlyF.Wait(); } catch (AggregateException e) { Eq(e.InnerException is TaskCanceledException, true); }
    Eq(onlyF.Status, TaskStatus.Canceled);

publish:
  dark: ../../lectures/_assets/16-03/continuation-chain.png
  bw: ../../lectures/_assets/16-03/book/continuation-chain.png
