# Лекція 10.3 «Черга Queue<T>»
# Оригінал: lectures/_assets/10-03/Архив/queue-complexity.png
id: queue-complexity
title: "Queue<T>, Stack<T> і List<T>: складність операцій"
subtitle: "Черга й стек працюють лише з кінцями — зате обидва кінці коштують O(1)"

types: [Queue, Stack, List]

body:
  - panel:
      heading: "Порівняння"
      children:
        - kv:
            check: skip
            key_code: false
            columns: ["операція", "Queue<T>", "Stack<T>", "List<T>", "примітка"]
            groups:
              - heading: "додати"
                rows:
                  - ["в кінець / на вершину", "`Enqueue` O(1)*", "`Push` O(1)*", "`Add` O(1)*", "* амортизовано: буфер ×2"]
              - heading: "забрати"
                rows:
                  - ["перший (FIFO)",   "`Dequeue` [[O(1)]]", "—",               "`RemoveAt(0)` O(n)",  "List зсуває всі елементи"]
                  - ["останній (LIFO)", "—",                  "`Pop` [[O(1)]]", "`RemoveAt(Count-1)` O(1)", "кінець масиву — без зсуву"]
                  - ["підглянути",      "`Peek` O(1)",        "`Peek` O(1)",     "`list[0]` O(1)",       "без видалення"]
              - heading: "решта"
                rows:
                  - ["`Contains`",       "O(n)",              "O(n)",             "O(n)",                 "лінійний пошук"]
                  - ["доступ за індексом", "немає",           "немає",            "O(1)",                 "черга й стек не індексовані"]
                  - ["`foreach`",        "від head",          "від вершини",      "від 0",                "порядок обходу = порядок вилучення"]
        - note:
            kind: box_accent
            text:
              - "Черга на `List<T>` із `RemoveAt(0)` — O(n) на кожне вилучення; `Queue<T>` робить те саме за O(1)."

check:
  usings: [System, System.Collections.Generic]
  context: |
    void Assert(bool ok, string what) { if (!ok) throw new Exception("Схема бреше: " + what); }
  asserts: |
    var s = new Stack<int>(); s.Push(1); s.Push(2); s.Push(3);
    var order = new List<int>(); foreach (var x in s) order.Add(x);
    Assert(order[0] == 3 && order[2] == 1, "foreach стека від вершини");
    var q = new Queue<int>(new[] { 1, 2, 3 }); var oq = new List<int>(q); Assert(oq[0] == 1, "foreach черги від head");
    var l = new List<int> { 1, 2, 3 }; l.RemoveAt(l.Count - 1); Assert(l.Count == 2, "RemoveAt(^1)");

publish:
  dark: ../../lectures/_assets/10-03/queue-complexity.png
  bw: ../../lectures/_assets/10-03/book/queue-complexity.png
