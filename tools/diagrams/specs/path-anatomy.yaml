# Лекція 18.1 «Класи Path, File та Directory»
# Оригінал: lectures/_assets/18-01/Архив/path-anatomy.png
id: path-anatomy
title: "Анатомія шляху: методи Path"
subtitle: "Path розбирає й складає рядки шляхів; результат залежить від ОС, на якій виконується код"

types: [Path]

body:
  - panel:
      heading: "Windows: `p = @\"C:\\MedSystem\\Patients\\PT-2024\\card_001.txt\"`"
      children:
        - flow:
            check: skip
            right_code: false
            rows:
              - { left: "Path.GetPathRoot(p)",                  label: "", right: "C:\\" }
              - { left: "Path.GetDirectoryName(p)",             label: "", right: "C:\\MedSystem\\Patients\\PT-2024" }
              - { left: "Path.GetFileName(p)",                  label: "", right: "card_001.txt" }
              - { left: "Path.GetFileNameWithoutExtension(p)",  label: "", right: "card_001" }
              - { left: "Path.GetExtension(p)",                 label: "", right: ".txt — [[з крапкою]]" }

  - row:
      gap: 24
      children:
        - panel:
            heading: "Linux: `linux = \"/srv/med/PT-2024/card_001.txt\"`"
            children:
              - kv:
                  check: "Eq({}, {v});"
                  columns: ["виклик", "результат"]
                  groups:
                    - rows:
                        - ["Path.GetPathRoot(linux)",       "`\"/\"`"]
                        - ["Path.GetDirectoryName(linux)",  "`\"/srv/med/PT-2024\"`"]
                        - ["Path.GetExtension(\"card\")",   "`\"\"` — розширення немає"]
                        - ["Path.HasExtension(linux)",      "`true`"]
              - note:
                  text:
                    - "Шлях `C:\\…` на Linux — звичайне імʼя файлу:"
                    - "`\\` там не роздільник, `GetPathRoot` → `\"\"`"
        - panel:
            heading: "Складання шляху"
            children:
              - kv:
                  check: skip
                  columns: ["виклик", "Windows / Linux"]
                  groups:
                    - rows:
                        - ["Path.Combine(\"MedSystem\", \"PT-2024\", \"card.json\")", "`MedSystem\\PT-2024\\card.json`"]
                        - ["",                                       "`MedSystem/PT-2024/card.json`"]
                        - ["Path.DirectorySeparatorChar",            "`'\\'` / `'/'`"]
                        - ["Path.AltDirectorySeparatorChar",         "`'/'` / `'/'`"]
              - note:
                  kind: box_accent
                  text:
                    - "Роздільник підставляє [[ОС]]; `/` Windows"
                    - "теж розуміє, але `Combine` надійніше"

check:
  usings: [System, System.IO]
  context: |
    string linux = "/srv/med/PT-2024/card_001.txt";
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    Eq(Path.GetFileName(linux), "card_001.txt"); Eq(Path.GetFileNameWithoutExtension(linux), "card_001"); Eq(Path.GetExtension(linux), ".txt");
    Eq(Path.Combine("MedSystem", "PT-2024", "card.json"), "MedSystem/PT-2024/card.json");
    Eq(Path.DirectorySeparatorChar, '/'); Eq(Path.AltDirectorySeparatorChar, '/');
    Eq(Path.GetPathRoot(@"C:\MedSystem\x.txt"), ""); Eq(Path.GetFileName(@"C:\MedSystem\x.txt"), @"C:\MedSystem\x.txt");

publish:
  dark: ../../lectures/_assets/18-01/path-anatomy.png
  bw: ../../lectures/_assets/18-01/book/path-anatomy.png
