# Лекція 19.2 «XML-формат та XmlDocument»
# Оригінал: lectures/_assets/19-02/Архив/xmldocument-api.png
id: xmldocument-api
title: "XmlDocument: читати, змінювати, зберігати"
subtitle: "Увесь документ у памʼяті — довільна навігація і зміни; для великих файлів — XmlReader (19.4)"

types: [XmlDocument, XmlNode, XmlElement, XmlNodeList, XmlAttribute]

body:
  - panel:
      heading: "Читання"
      children:
        - kv:
            check: "Eq({}, {v});"
            columns: ["вираз", "результат"]
            groups:
              - rows:
                  - ["root.Name",                                         "`\"ward\"`"]
                  - ["root[\"patient\"]!.GetAttribute(\"id\")",           "`\"PT-1\"`"]
                  - ["root.SelectNodes(\"patient\")!.Count",               "`2`"]
                  - ["root.SelectSingleNode(\"patient[@id='PT-2']/name\")!.InnerText", "`\"Коваль\"`"]
                  - ["root.SelectSingleNode(\"patient[@id='PT-9']\")",     "`null`"]
                  - ["root.GetAttribute(\"none\")",                       "`\"\"` — не `null`"]

  - row:
      gap: 24
      children:
        - panel:
            heading: "Зміна"
            children:
              - box:
                  check: skip                       # змінює документ — перевірено в asserts на копії
                  code: |
                    XmlElement p = doc.CreateElement("patient");
                    p.SetAttribute("id", "PT-3");
                    p.InnerText = "Бойко";
                    root.AppendChild(p);

                    XmlNode old = root.FirstChild!;
                    root.RemoveChild(old);
                  notes:
                    - "`CreateElement` лише створює вузол —"
                    - "у дерево він потрапляє після [[`AppendChild`]]"
        - panel:
            heading: "Завантаження і збереження"
            children:
              - kv:
                  check: skip
                  key_code: false
                  groups:
                    - rows:
                        - ["`doc.LoadXml(string)`",    "з рядка; некоректний XML → `XmlException`"]
                        - ["`doc.Load(path / Stream)`", "з файлу чи потоку"]
                        - ["`doc.Save(path / Stream)`", "запис; `doc.OuterXml` — увесь документ рядком"]
                        - ["`doc.PreserveWhitespace`", "`false`: відступи між тегами відкидаються"]
                        - ["`root.InnerXml = \"…\"`",   "замінює вміст розібраним фрагментом XML"]
                        - ["`XmlDocument` vs `XDocument`", "класичний DOM (.NET 1.0) і LINQ to XML (19.3) — сучасніший"]

check:
  usings: [System, System.Xml]
  context: |
    var doc = new XmlDocument();
    doc.LoadXml("<ward><patient id='PT-1'><name>Петренко</name></patient><patient id='PT-2'><name>Коваль</name></patient></ward>");
    XmlElement root = doc.DocumentElement!;
    void Eq<T>(T a, T b) { if (!Equals(a, b)) throw new Exception($"Схема бреше: {a} != {b}"); }
  asserts: |
    var d2 = (XmlDocument)doc.Clone(); var r2 = d2.DocumentElement!;
    XmlElement p = d2.CreateElement("patient"); p.SetAttribute("id", "PT-3"); p.InnerText = "Бойко"; r2.AppendChild(p);
    r2.RemoveChild(r2.FirstChild!);
    Eq(r2.ChildNodes.Count, 2); Eq(r2.FirstChild!.Attributes!["id"]!.Value, "PT-2"); Eq(r2.LastChild!.InnerText, "Бойко");
    var orphan = doc.CreateElement("x"); Eq(orphan.ParentNode, (XmlNode?)null);
    try { new XmlDocument().LoadXml("<a><b></a>"); Eq(0, 1); } catch (XmlException) { }
    var w = new XmlDocument(); w.LoadXml("<a>\n  <b/>\n</a>"); Eq(w.DocumentElement!.ChildNodes.Count, 1); Eq(w.PreserveWhitespace, false);

publish:
  dark: ../../lectures/_assets/19-02/xmldocument-api.png
  bw: ../../lectures/_assets/19-02/book/xmldocument-api.png
